name: Release

# F19 打包分发 0.4.0（Issue #48）：tag v* 触发，三 job 流水线
# spec f19-packaging §7：R1 独立 workflow（触发/产物/权限与 ci.yml 不同）
# R3 各 job 自带 cache（GitHub Actions cache 按 workflow 隔离，不能复用 ci.yml）
on:
  push:
    tags:
      - 'v*'

jobs:
  # ── 内核 PyInstaller onedir ──
  # R2：只装 packaging extra（pyinstaller），不装 dev——pytest 等大体积测试依赖
  #     会被 PyInstaller 收集污染产物
  package-backend:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      # R4：版本单一来源 = tag（spec §2.4）
      # ⚠️ 顺序关键（M5 实测 rc.3 失败 #145）：必须**先注入版本再 uv sync**——
      #    editable install 的 dist-info 在 sync 时生成并记录当时 pyproject 的 version；
      #    sync 后再改 pyproject 不会更新已安装 dist-info → PyInstaller copy_metadata
      #    复制旧版本（rc.3 实测 INKFLOW_READY.version=0.1.0）
      - name: Inject version from tag into pyproject.toml
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          (Get-Content pyproject.toml) -replace 'version = "([^"]+)"', "version = `"$version`"" | Set-Content pyproject.toml
          Write-Host "pyproject.toml version set to $version"

      # version 变化需同步 uv.lock（uv.lock 含 inkflow 包 version 字段），否则 --frozen 校验失败
      - name: Sync lockfile version
        run: uv lock

      - name: Install dependencies (packaging extra)
        run: uv sync --frozen --extra packaging

      - name: Build kernel (PyInstaller onedir)
        run: uv run pyinstaller pyinstaller/inkflow.spec

      # F33 CLI 独立发布产物（spec f33-cli-dist §3.2）：同一份 onedir 产物打 zip
      # ⚠️ 必须先完成版本注入（上方 Inject version step）再打包——zip 内 exe 的
      #    dist-info 版本 = tag（copy_metadata 机制）；zip 文件名版本也从此派生
      # ⚠️ 命名对齐 GUI 风格（#185）：InkFlow-cli-<version>-x64.zip（与 electron-builder
      #    artifactName InkFlow-${version}-${arch}.${ext} 同构），zip 内结构不变
      - name: Package CLI zip
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          Compress-Archive -Path dist/inkflow -DestinationPath "dist/InkFlow-cli-$version-x64.zip" -CompressionLevel Optimal
          Write-Host "CLI zip created: dist/InkFlow-cli-$version-x64.zip"

      - name: Upload CLI zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-zip
          path: backend/dist/InkFlow-cli-*.zip

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v7
        with:
          name: kernel-onedir
          path: backend/dist/inkflow

  # ── renderer dist/ + electron out/（前端构建产物）──
  build-renderer:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer
        run: pnpm --filter renderer build

      - name: Build electron main/preload
        run: pnpm --filter inkflow-electron build

      - name: Upload renderer artifact
        uses: actions/upload-artifact@v7
        with:
          name: renderer-dist
          path: frontend/packages/renderer/dist

      - name: Upload electron artifact
        uses: actions/upload-artifact@v7
        with:
          name: electron-out
          path: frontend/packages/electron/out

  # ── 组装 + electron-builder（NSIS + 便携 ZIP）+ 发布 ──
  # R5：gh release create 需要 contents: write（ci.yml 各 job 只 read）
  package-electron:
    needs: [package-backend, build-renderer]
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download kernel artifact
        uses: actions/download-artifact@v7
        with:
          name: kernel-onedir
          path: kernel-onedir

      - name: Download renderer artifact
        uses: actions/download-artifact@v7
        with:
          name: renderer-dist
          path: renderer-dist

      - name: Download electron artifact
        uses: actions/download-artifact@v7
        with:
          name: electron-out
          path: electron-out

      # 组装 extraResources 源目录：内核 onedir 整体 → packages/kernel/
      # （electron-builder.yml extraResources.from: ../kernel 相对 electron 包解析）
      # ⚠️ artifact 结构（实测 v0.4.0-rc.1 失败 #145）：upload-artifact 单目录 path
      #    上传后 artifact 内**平铺**（无 backend/dist/inkflow 前缀）——download 到
      #    显式子目录后从该目录复制；不要假设下载后保留仓库相对路径。
      - name: Assemble kernel directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages/kernel | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE/kernel-onedir/*" packages/kernel/

      # renderer dist + electron out 放回 electron-builder 期望的位置
      # ⚠️ renderer dist 必须复制进 electron 包内（rc.5 实测空白 #145）：
      #    electron-builder files 的 ../renderer/dist/** 越出包目录**不会打进 asar**
      #    （asar 实测 0 命中 renderer → loadFile 失败 → 空白窗口）
      - name: Place renderer dist and electron out
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packages/electron/renderer-dist | Out-Null
          New-Item -ItemType Directory -Force packages/electron/out | Out-Null
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE/renderer-dist/*" packages/electron/renderer-dist/
          Copy-Item -Recurse -Force "$env:GITHUB_WORKSPACE/electron-out/*" packages/electron/out/

      # R4：package.json version ← tag（electron-builder 从 package.json 读版本）
      - name: Inject version from tag into package.json
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $pkgPath = 'packages/electron/package.json'
          (Get-Content $pkgPath -Raw) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content $pkgPath -Encoding UTF8
          Write-Host "electron package.json version set to $version"

      - name: Package Windows artifacts (NSIS + ZIP)
        run: pnpm --filter inkflow-electron dist:win

      - name: Download CLI zip artifact
        uses: actions/download-artifact@v7
        with:
          name: cli-zip
          path: cli-zip

      # CLI zip 并入发布资产目录（gh release create 资产收集的既有位置）
      - name: Place CLI zip into release assets
        shell: pwsh
        run: |
          Copy-Item -Force "$env:GITHUB_WORKSPACE/cli-zip/InkFlow-cli-*.zip" packages/electron/dist/

      - name: Create GitHub Release
        shell: pwsh
        # ⚠️ gh 在 Actions 中需显式 GH_TOKEN（实测 rc.2 失败 #145）——github.token 自动注入仅限
        #    特定 action，CLI 必须显式传 env；contents: write 权限已在上方 permissions 声明
        # ⚠️ rc 预发布 tag 必须标 prerelease（#183）：gh 非交互不自动推断，不标会抢占正式版
        #    Latest 标记（v0.5.0-rc1 预发布实测发现）；0.4.0 时代 rc.1-6 靠手动 edit，现固化
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $assets = @(Get-ChildItem -Path packages/electron/dist -File | Where-Object { $_.Extension -in '.exe', '.zip' } | Select-Object -ExpandProperty FullName)
          if (-not $assets) { throw "No release assets found in packages/electron/dist" }
          $releaseArgs = @('--generate-notes')
          if ($tag -match '-rc') { $releaseArgs += '--prerelease' }
          gh release create $tag $assets @releaseArgs
