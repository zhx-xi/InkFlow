name: CI
on:
  push:
    branches: [main, develop]
    # 功能/测试/CI 变更触发；文档类变更（*.md、design/、docs/、specs/、adr/ 等）也触发
    # （分支保护 required checks 需要结论；docs-only PR 若不触发 workflow 则 required
    # checks 无报告 → BLOCKED 无法 merge，#119 实测）
    paths:
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'tests/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/**'
      - '.github/**'
      - '*.md'
      - 'adr/**'
      - 'docs/**'
      - 'design/**'
      - 'specs/**'
  pull_request:
    branches: [main]
    # labeled 为 e2e-ai-backend 的触发入口（ADR-026）；opened/synchronize/reopened 为默认类型，必须显式保留
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'tests/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/**'
      - '.github/**'
      - '*.md'
      - 'adr/**'
      - 'docs/**'
      - 'design/**'
      - 'specs/**'
  # 手动触发 e2e-ai-backend（ADR-026 Q1=B 兜底）：任意分支/任意时间运行真实 AI 测试
  workflow_dispatch:

jobs:
  # ── 变更检测元 job：分层触发决策（dorny/paths-filter）──
  # core   = 核心功能代码 + 依赖配置
  # unit   = unit 测试代码（backend/tests/unit/）
  # tests  = 全部测试代码（unit + 集成 + E2E/CLI）
  # ci     = CI 配置本身（改 CI 全量重验）
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      unit: ${{ steps.filter.outputs.unit }}
      tests: ${{ steps.filter.outputs.tests }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      ci: ${{ steps.filter.outputs.ci }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'backend/src/**'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
            unit:
              - 'backend/tests/unit/**'
            tests:
              - 'backend/tests/**'
              - 'tests/**'
            frontend:
              - 'frontend/**'
            # E2E spec 变更（tests/e2e/）触发页面级 e2e-* job（#142 实测：纯 E2E 变更
            # 之前只命中 tests output，页面级 job 全部 skip → 新增用例 CI 无验证）
            e2e:
              - 'tests/e2e/**'
            ci:
              - '.github/**'
            # 文档类变更：分支保护 required checks（lint/unit/build）在 docs-only PR 也必须
            # 有结论（成功或跳过），否则 GitHub 视为 pending → BLOCKED 无法 merge
            # （#118 实测：docs-only PR 全部 job skipped → merge 被 base branch policy 阻止）。
            # docs 变化触发 required job 运行（AGENTS.md 变更跑 lint/unit/build 保守但可靠）
            docs:
              - 'AGENTS.md'
              - 'ARCHITECTURE.md'
              - 'FEATURES.md'
              - 'CONTRIBUTING.md'
              - 'adr/**'
              - 'docs/**'
              - 'design/**'
              - 'specs/**'

  # ── Lint: ruff check + mypy type check ──
  lint-backend:
    # 第一批：恒跑（required check，不依赖 paths-filter）——默认 needs 语义 = changes 成功后必跑
    needs: [changes]
    permissions:
      contents: read
      checks: write
      pull-requests: write   # reviewdog github-pr-review
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - uses: reviewdog/action-setup@v1

      - name: Ruff check + annotate (Reviewdog)
        shell: pwsh
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ruffOutput = uv run ruff check src/ tests/unit/ ../tests/ --output-format=concise
          $ruffExit = $LASTEXITCODE
          if ($ruffOutput) {
            $fixed = $ruffOutput `
              -replace '^src/', 'backend/src/' `
              -replace '^tests/unit/', 'backend/tests/unit/' `
              -replace '^\.\./tests/', 'tests/'
            $fixed | reviewdog -efm='%f:%l:%c: %m' -reporter=github-pr-review -level=warning -name=ruff -tee
          }
          if ($ruffExit -ne 0) { exit $ruffExit }

      - name: Type check with mypy
        run: uv run mypy src/ --ignore-missing-imports

      # ── 质量护栏（借鉴 LiteLLM ci_cd/）：monster file 禁令 + noqa 带理由 ──
      - name: "Guardrail: file length (monster file ban)"
        shell: pwsh
        run: |
          uv run python ../ci_cd/check_file_length.py 900 src/ ../tests/ tests/unit/ ../frontend/packages/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "Guardrail: noqa must carry a reason"
        shell: pwsh
        run: |
          uv run python ../ci_cd/check_noqa_reason.py src/ ../tests/ tests/unit/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── Unit tests (fast, no DB, < 10s) ──
  # 只跑核心代码 + unit 测试代码变更；集成/E2E 测试变更不触发
  unit-backend:
    # 第一批：恒跑（required check）——默认 needs 语义 = changes 成功后必跑
    needs: [changes]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        # #273: chromadb 与 coverage 同进程冲突已修复（#276 hnsw:sync_threshold=3 + chromadb 1.5.9），
        # chromadb 测试直接进 --cov 口径（与 coverage-backend 一致），不再单独无 --cov 跑。
        # --reruns 2：chromadb 1.5.9 Windows CI 上 hnsw 段读取偶发竞态（写入后立即 retrieve，
        # 本地稳定复现不了，CI 两次失败用例不同 = 非确定性）；pytest-rerunfailures 兜底重试
        # #685: 生成 .coverage 数据文件供 coverage-backend 下载合并，不再重跑 unit 测试
        run: |
          uv run pytest tests/unit/ -v --tb=short --cov=inkflow --reruns 2 --reruns-delay 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit-backend
          path: backend/.coverage
          retention-days: 1

  # ── Unit API tests (mock 式 API 测试，#685 拆分自原 coverage-backend 全量) ──
  # 第一批恒跑（required check）：与 unit-backend 同批并行
  unit-api-backend:
    needs: [changes]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run API tests
        # #685: 所有 tests/api/ 测试 + coverage 数据上传供合并
        # 多行 run 必须逐行检查 $LASTEXITCODE（#214 假绿坑）
        # --reruns 2：chromadb 1.5.9 Windows CI 上 hnsw 段读取偶发竞态（#409，与 unit-backend 对齐）
        run: |
          uv run pytest ../tests/api/ --cov=inkflow -q --reruns 2 --reruns-delay 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api-backend
          path: backend/.coverage
          retention-days: 1

  # ── Unit CLI tests (mock 式 CLI 测试，#685 拆分自原 coverage-backend 全量) ──
  # 第一批恒跑（required check）：与 unit-backend 同批并行
  unit-cli-backend:
    needs: [changes]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run CLI tests
        # #685: 所有 tests/cli/ 测试 + coverage 数据上传供合并
        run: |
          uv run pytest ../tests/cli/ --cov=inkflow -q --reruns 2 --reruns-delay 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cli-backend
          path: backend/.coverage
          retention-days: 1

  # ── Unit integration tests (repo + service，#685 拆分自原 coverage-backend 全量) ──
  # 第一批恒跑（required check）：与 unit-backend 同批并行
  unit-integration-backend:
    needs: [changes]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run integration tests
        # #685: 所有 tests/integration/ 测试 + coverage 数据上传供合并
        run: |
          uv run pytest ../tests/integration/ --cov=inkflow -q --reruns 2 --reruns-delay 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration-backend
          path: backend/.coverage
          retention-days: 1

  # ── Frontend unit: Vitest（renderer + electron 双包，第一批恒跑）──
  unit-frontend:
    # 第一批：恒跑（required check）——默认 needs 语义 = changes 成功后必跑
    needs: [changes]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 拆独立 step（#405）：多行 run 无退出码传播 → renderer vitest 失败被 electron 段成功掩盖
      # （job 假绿，#214 coverage-backend 同族）。每 step 独立退出码，vitest 失败真实红。
      # #685: 加 --coverage，vitest 生成覆盖率报告 + threshold 自检（不达标即红）
      - name: Unit tests (Vitest, renderer)
        run: pnpm --filter renderer test --coverage

      - name: Unit tests (Vitest, electron)
        run: pnpm --filter inkflow-electron test --coverage

      - name: Upload renderer coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend-renderer
          path: frontend/packages/renderer/coverage/
          retention-days: 1

      - name: Upload electron coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend-electron
          path: frontend/packages/electron/coverage/
          retention-days: 1

  # ── Frontend lint: ESLint + typecheck + compile check（静态检查，第一批恒跑）──
  lint-frontend:
    # 第一批：恒跑（required check）——默认 needs 语义 = changes 成功后必跑
    needs: [changes]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, renderer)
        run: pnpm --filter renderer lint

      - name: Type check (renderer)
        run: pnpm --filter renderer typecheck

      - name: Compile check (electron main/preload)
        run: pnpm --filter inkflow-electron build

  # ── Frontend integration: renderer API client ↔ 真实内核往返（spec §4.7 集成层）──
  integration-frontend:
    # 第二批：按需触发（frontend/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, unit-api-backend, unit-cli-backend, unit-integration-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      # Windows runner 默认 cp1252（charmap）：serve.py 启动横幅含 🚀/中文 → UnicodeEncodeError
      # → 内核崩溃 exit 1。PYTHONUTF8=1 强制 UTF-8 模式（Python 3.7+），spawn 子进程继承
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Integration tests (renderer apiFetch ↔ real kernel)
        run: pnpm --filter renderer test:integration

  # ── Frontend E2E 6 job 并行（ADR-028 E1：shell 第一批恒跑 required + 页面级第二批按需）──
  e2e-frontend-shell:
    # 第一批：恒跑（required check，不依赖 paths-filter）——默认 needs 语义 = changes 成功后必跑
    needs: [changes]
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      # 同 integration-frontend：内核 spawn 需 UTF-8（Windows runner cp1252 会 UnicodeEncodeError）
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build renderer (dist/)
        run: pnpm --filter renderer build

      - name: Build electron main/preload (out/)
        run: pnpm --filter inkflow-electron build

      - name: E2E shell (Playwright _electron launch/revive/recycle + tray)
        run: pnpm --filter inkflow-electron test:e2e e2e-shell e2e-tray

  e2e-frontend-projects:
    # 第二批：按需触发（frontend/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, unit-api-backend, unit-cli-backend, unit-integration-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      # 同 integration-frontend：内核 spawn 需 UTF-8（Windows runner cp1252 会 UnicodeEncodeError）
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build renderer (dist/)
        run: pnpm --filter renderer build

      - name: Build electron main/preload (out/)
        run: pnpm --filter inkflow-electron build

      - name: E2E projects (Playwright _electron projects page)
        run: pnpm --filter inkflow-electron test:e2e e2e-projects

  e2e-frontend-writing:
    # 第二批：按需触发（frontend/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, unit-api-backend, unit-cli-backend, unit-integration-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      # 同 integration-frontend：内核 spawn 需 UTF-8（Windows runner cp1252 会 UnicodeEncodeError）
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build renderer (dist/)
        run: pnpm --filter renderer build

      - name: Build electron main/preload (out/)
        run: pnpm --filter inkflow-electron build

      - name: E2E writing (Playwright _electron writing page)
        # --retries=1（#455）：该 job 在 Windows runner 环境不稳定（Electron+真实内核时序 + GH Actions 429 限流），
        # 失败用例自动重跑 1 次吸收环境抖动；真实功能缺陷重跑仍失败不受掩盖（对齐 #451 e2e-frontend-settings）
        run: pnpm --filter inkflow-electron test:e2e e2e-writing e2e-audit e2e-writer-chat --retries=1

  e2e-frontend-library:
    # 第二批：按需触发（frontend/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, unit-api-backend, unit-cli-backend, unit-integration-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      # 同 integration-frontend：内核 spawn 需 UTF-8（Windows runner cp1252 会 UnicodeEncodeError）
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build renderer (dist/)
        run: pnpm --filter renderer build

      - name: Build electron main/preload (out/)
        run: pnpm --filter inkflow-electron build

      - name: E2E library (Playwright _electron library page)
        run: pnpm --filter inkflow-electron test:e2e e2e-library

  e2e-frontend-models:
    # 第二批：按需触发（frontend/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, unit-api-backend, unit-cli-backend, unit-integration-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      # 同 integration-frontend：内核 spawn 需 UTF-8（Windows runner cp1252 会 UnicodeEncodeError）
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build renderer (dist/)
        run: pnpm --filter renderer build

      - name: Build electron main/preload (out/)
        run: pnpm --filter inkflow-electron build

      - name: E2E models (Playwright _electron models page)
        run: pnpm --filter inkflow-electron test:e2e e2e-models

  e2e-frontend-settings:
    # 第二批：按需触发（frontend/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, unit-api-backend, unit-cli-backend, unit-integration-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      # 同 integration-frontend：内核 spawn 需 UTF-8（Windows runner cp1252 会 UnicodeEncodeError）
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build renderer (dist/)
        run: pnpm --filter renderer build

      - name: Build electron main/preload (out/)
        run: pnpm --filter inkflow-electron build

      - name: E2E settings (Playwright _electron settings page)
        # --retries=1（#450）：该 job 在 Windows runner 环境不稳定（Electron+真实内核时序 + GH Actions 429 限流），
        # 失败用例自动重跑 1 次吸收环境抖动；真实功能缺陷重跑仍失败不受掩盖
        run: pnpm --filter inkflow-electron test:e2e e2e-settings e2e-settings-templates e2e-settings-agents e2e-settings-skills --retries=1

  # ── Coverage: 后端覆盖率门禁（#685：下载 4 个 .coverage artifact 合并，不重跑测试）──
  # 门槛（2026-08-06 Phase 3 实测 CI 权威口径）：
  #   行 98.90% / 分支 96.32% —— 写入 98.5/95.0（留 0.4/1.3 余量防环境抖动）。
  # 剩余 miss 均为物理不可达防御分支（payload 非 dict / for 循环耗尽弧 / except 重抛），
  # 已由 C 方案 exclude_lines 排除 Protocol 接口方法体；目标 99/90 已达（98.90 ≥ 目标线）。
  coverage-backend:
    # 第二批：needs 第一批的 4 个 coverage artifact 产出 job
    needs: [changes, unit-backend, unit-api-backend, unit-cli-backend, unit-integration-backend]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      # #685: 下载 4 个 .coverage 数据文件，coverage combine 合并
      # 每个 artifact 下载到独立子目录避免同名冲突（各 job 都生成 backend/.coverage）
      - name: Download unit coverage data
        uses: actions/download-artifact@v7
        with:
          name: coverage-unit-backend
          path: cov/unit

      - name: Download API coverage data
        uses: actions/download-artifact@v7
        with:
          name: coverage-api-backend
          path: cov/api

      - name: Download CLI coverage data
        uses: actions/download-artifact@v7
        with:
          name: coverage-cli-backend
          path: cov/cli

      - name: Download integration coverage data
        uses: actions/download-artifact@v7
        with:
          name: coverage-integration-backend
          path: cov/integration

      - name: Combine coverage data
        # coverage combine 接受多个 .coverage 文件，合并为 .coverage（基于 pyproject.toml 配置）
        # ubuntu runner 默认 bash shell（#685：coverage job 从 windows 迁到 ubuntu——只做合并+gate 不跑测试）
        # 各 job 的 .coverage 文件在独立子目录（cov/unit/.coverage 等），combine 直接引用
        shell: bash
        run: |
          uv run coverage combine cov/unit/.coverage cov/api/.coverage cov/cli/.coverage cov/integration/.coverage
          uv run coverage xml -o coverage.xml

      - name: Coverage gate (line >= 98.5%, branch >= 95%)
        run: uv run python ../ci_cd/check_coverage.py 98.5 95.0 coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Coverage: 前端覆盖率报告收集（#685：threshold 已在 unit-frontend 自检，此 job 只收集 artifact）──
  coverage-frontend:
    # 第三批：needs unit-frontend（artifact 产出者）
    needs: [changes, unit-frontend]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Download renderer coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-frontend-renderer
          path: frontend-coverage/renderer

      - name: Download electron coverage
        uses: actions/download-artifact@v7
        with:
          name: coverage-frontend-electron
          path: frontend-coverage/electron

      - name: Re-bundle coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend-coverage/

  # ── Build: wheel（依赖第一批 lint/unit，与第二批集成/E2E 并行；为后续打包 job 腾名）──
  build:
    # 第一批恒跑（lint/unit 全 required）→ 默认 needs 语义即可：
    # 任一 failure → build skip → required pending → BLOCKED（正确门禁）；cancelled → skip
    needs: [lint-backend, unit-backend, unit-api-backend, unit-cli-backend, unit-integration-backend, lint-frontend, unit-frontend]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Build wheel
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $sha = '${{ github.event.pull_request.head.sha }}'.Substring(0, 7)
            $devVersion = "0.1.0.dev0+g$sha"
            (Get-Content pyproject.toml) -replace 'version = "0.1.0"', "version = `"$devVersion`"" | Set-Content pyproject.toml
            Write-Host "PR build: version set to $devVersion"
          }
          uv build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: inkflow-wheel
          path: backend/dist/*.whl

  # ── 真实 AI e2e（ADR-026 / Issue #92）：label run-ai-tests 触发 + workflow_dispatch 兜底 ──
  # 信息性 check：不进 build needs、不设 required——外部 LLM 服务抖动不卡 merge。
  # 守卫：secrets.LLM_API_KEY 为空（fork PR / 未配置）时测试 step 跳过（缺 key 永远 skip 不 fail）。
  # ⚠️ 实现调整（2026-08-05 实测）：GitHub 拒绝在 job 级 if 中引用 secrets（workflow 解析失败），
  #    guard 移至 step 级 if（step 级 secrets 引用为 GitHub 标准支持模式）。
  e2e-ai-backend:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'run-ai-tests')
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run real-AI e2e tests (T1 connectivity + T2 writing generate)
        # 守卫（ADR-026）：LLM_API_KEY 为空（fork PR / 未配置）时跳过——缺 key 永远 skip 不 fail。
        # ⚠️ GitHub 限制：if 条件不支持 secrets 上下文（实测 job/step 级引用均解析失败）——
        #    secrets 经 job env 注入（合法），if 引用 env 上下文（合法）。
        if: env.LLM_API_KEY != ''
        run: |
          uv run pytest ../tests/e2e/test_llm_connectivity.py `
                 ../tests/e2e/test_writing_generate.py `
                 -v --tb=short -m e2e

  # ── 真实 AI GUI e2e（#298 管线化 / #161 Supervisor 动态路由）：与 e2e-ai-backend 同开关哲学 ──
  # label run-ai-tests 触发 + workflow_dispatch 兜底；信息性 check 不进 needs 不 required——
  # 外部 LLM 服务抖动不卡 merge。守卫：secrets.LLM_API_KEY 为空时测试 step 跳过（缺 key 永远 skip 不 fail）。
  # 说明：B1 spec（e2e-pipeline-ai.spec.ts）读 process.env.INKFLOW_LLM_KEY；deepseek key 经
  # INKFLOW_LLM_KEY 注入（secrets.LLM_API_KEY）；provider/model 由 tests/e2e/e2e-llm.config.ts 默认
  # （deepseek/deepseek-v4-flash），INKFLOW_E2E_LLM_PROVIDER/MODEL env 可覆盖。
  e2e-ai-frontend:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'run-ai-tests')
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      INKFLOW_LLM_KEY: ${{ secrets.LLM_API_KEY }}
      # 内核 spawn 需 UTF-8（Windows runner cp1252 会 UnicodeEncodeError）
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build renderer (dist/)
        run: pnpm --filter renderer build

      - name: Build electron main/preload (out/)
        run: pnpm --filter inkflow-electron build

      - name: E2E pipeline AI (real LLM, #298 管线化 + #366 G1-G4 补测)
        # 守卫（同 e2e-ai-backend）：INKFLOW_LLM_KEY 为空（fork PR / 未配置）时跳过——缺 key 永远 skip 不 fail。
        if: env.INKFLOW_LLM_KEY != ''
        run: pnpm --filter inkflow-electron test:e2e e2e-pipeline-ai e2e-pipeline-gaps
