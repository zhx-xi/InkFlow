name: CI
on:
  push:
    branches: [main, develop]
    # 只有修改功能代码 / 测试代码 / CI 代码才触发；纯文档（*.md、design/、docs/、specs/、adr/ 等）不触发
    paths:
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'tests/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'tests/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - '.github/**'

jobs:
  # ── 变更检测元 job：分层触发决策（dorny/paths-filter）──
  # core   = 核心功能代码 + 依赖配置
  # unit   = unit 测试代码（backend/tests/unit/）
  # tests  = 全部测试代码（unit + 集成 + E2E/CLI）
  # ci     = CI 配置本身（改 CI 全量重验）
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      unit: ${{ steps.filter.outputs.unit }}
      tests: ${{ steps.filter.outputs.tests }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'backend/src/**'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
            unit:
              - 'backend/tests/unit/**'
            tests:
              - 'backend/tests/**'
              - 'tests/**'
            ci:
              - '.github/**'

  # ── Lint: ruff check + mypy type check ──
  lint-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
      checks: write
      pull-requests: write   # reviewdog github-pr-review
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - uses: reviewdog/action-setup@v1

      - name: Ruff check + annotate (Reviewdog)
        shell: pwsh
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ruffOutput = uv run ruff check src/ tests/unit/ ../tests/ --output-format=concise
          $ruffExit = $LASTEXITCODE
          if ($ruffOutput) {
            $fixed = $ruffOutput `
              -replace '^src/', 'backend/src/' `
              -replace '^tests/unit/', 'backend/tests/unit/' `
              -replace '^\.\./tests/', 'tests/'
            $fixed | reviewdog -efm='%f:%l:%c: %m' -reporter=github-pr-review -level=warning -name=ruff -tee
          }
          if ($ruffExit -ne 0) { exit $ruffExit }

      - name: Type check with mypy
        run: uv run mypy src/ --ignore-missing-imports

  # ── Unit tests (fast, no DB, < 10s) ──
  # 只跑核心代码 + unit 测试代码变更；集成/E2E 测试变更不触发
  unit-test-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.unit == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short --cov=inkflow --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  # ── Integration: Chapter (repo + service + API + CLI) ──
  # 只要修改代码（核心或测试）都触发
  integration-chapter-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run chapter integration tests
        run: |
          uv run pytest ../tests/integration/test_chapter_repository.py `
                 ../tests/integration/test_chapter_service.py `
                 ../tests/api/test_chapter_api.py `
                 ../tests/cli/test_cli_chapter.py `
                 -v --tb=short

  # ── Integration: Project (repo + service + API + CLI) ──
  integration-project-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run project integration tests
        run: |
          uv run pytest ../tests/integration/test_project_repository.py `
                 ../tests/integration/test_project_service.py `
                 ../tests/api/test_project_api.py `
                 ../tests/cli/test_cli_project.py `
                 -v --tb=short

  # ── Integration: Writing (API + CLI) ──
  integration-writing-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run writing integration tests
        run: |
          uv run pytest ../tests/api/test_writing_api.py `
                 ../tests/cli/test_cli_writing.py `
                 -v --tb=short

  # ── Integration: Agent (pipeline + API + CLI) ──
  integration-agent-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run agent integration tests
        run: |
          uv run pytest ../tests/integration/test_agent_pipeline.py `
                 ../tests/api/test_agent_api.py `
                 ../tests/cli/test_cli_agent.py `
                 -v --tb=short

  # ── Integration: CLI（迁移后 tests/cli/ mock 式 CLI 测试，Issue #61 目录治理）──
  integration-cli-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run CLI integration tests
        run: |
          uv run pytest ../tests/cli/test_cli_project_mock.py `
                 ../tests/cli/test_cli_chapter_mock.py `
                 ../tests/cli/test_cli_write.py `
                 ../tests/cli/test_cli_output.py `
                 ../tests/cli/test_cli_serve.py `
                 ../tests/cli/test_cli_config.py `
                 ../tests/cli/test_cli_llm.py `
                 ../tests/cli/test_cli_character.py `
                 ../tests/cli/test_cli_world.py `
                 ../tests/cli/test_cli_outline.py `
                 ../tests/cli/test_cli_timeline.py `
                 ../tests/cli/test_cli_foreshadowing.py `
                 ../tests/cli/test_cli_extraction.py `
                 ../tests/cli/test_cli_vector.py `
                 ../tests/cli/test_cli_audit.py `
                 ../tests/cli/test_cli_style.py `
                 -v --tb=short

  # ── Smoke: health check (fastest) ──
  smoke-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Health check
        run: uv run pytest ../tests/api/test_health.py -v --tb=short

  # ── Build: wheel (all gates pass) ──
  build-backend:
    needs: [lint-backend, unit-test-backend, integration-chapter-backend, integration-project-backend, integration-writing-backend, integration-agent-backend, integration-cli-backend, smoke-backend]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Build wheel
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $sha = '${{ github.event.pull_request.head.sha }}'.Substring(0, 7)
            $devVersion = "0.1.0.dev0+g$sha"
            (Get-Content pyproject.toml) -replace 'version = "0.1.0"', "version = `"$devVersion`"" | Set-Content pyproject.toml
            Write-Host "PR build: version set to $devVersion"
          }
          uv build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: inkflow-wheel
          path: backend/dist/*.whl
