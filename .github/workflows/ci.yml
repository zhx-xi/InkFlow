name: CI
on:
  push:
    branches: [main, develop]
    # 只有修改功能代码 / 测试代码 / CI 代码才触发；纯文档（*.md、design/、docs/、specs/、adr/ 等）不触发
    paths:
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'tests/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/**'
      - '.github/**'
  pull_request:
    branches: [main]
    # labeled 为 e2e-ai-backend 的触发入口（ADR-026）；opened/synchronize/reopened 为默认类型，必须显式保留
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'tests/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/**'
      - '.github/**'
  # 手动触发 e2e-ai-backend（ADR-026 Q1=B 兜底）：任意分支/任意时间运行真实 AI 测试
  workflow_dispatch:

jobs:
  # ── 变更检测元 job：分层触发决策（dorny/paths-filter）──
  # core   = 核心功能代码 + 依赖配置
  # unit   = unit 测试代码（backend/tests/unit/）
  # tests  = 全部测试代码（unit + 集成 + E2E/CLI）
  # ci     = CI 配置本身（改 CI 全量重验）
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      unit: ${{ steps.filter.outputs.unit }}
      tests: ${{ steps.filter.outputs.tests }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'backend/src/**'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
            unit:
              - 'backend/tests/unit/**'
            tests:
              - 'backend/tests/**'
              - 'tests/**'
            frontend:
              - 'frontend/**'
            ci:
              - '.github/**'

  # ── Lint: ruff check + mypy type check ──
  lint-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
      checks: write
      pull-requests: write   # reviewdog github-pr-review
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - uses: reviewdog/action-setup@v1

      - name: Ruff check + annotate (Reviewdog)
        shell: pwsh
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ruffOutput = uv run ruff check src/ tests/unit/ ../tests/ --output-format=concise
          $ruffExit = $LASTEXITCODE
          if ($ruffOutput) {
            $fixed = $ruffOutput `
              -replace '^src/', 'backend/src/' `
              -replace '^tests/unit/', 'backend/tests/unit/' `
              -replace '^\.\./tests/', 'tests/'
            $fixed | reviewdog -efm='%f:%l:%c: %m' -reporter=github-pr-review -level=warning -name=ruff -tee
          }
          if ($ruffExit -ne 0) { exit $ruffExit }

      - name: Type check with mypy
        run: uv run mypy src/ --ignore-missing-imports

      # ── 质量护栏（借鉴 LiteLLM ci_cd/）：monster file 禁令 + noqa 带理由 ──
      - name: "Guardrail: file length (monster file ban)"
        shell: pwsh
        run: |
          uv run python ../ci_cd/check_file_length.py 900 src/ ../tests/ tests/unit/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "Guardrail: noqa must carry a reason"
        shell: pwsh
        run: |
          uv run python ../ci_cd/check_noqa_reason.py src/ ../tests/ tests/unit/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── Unit tests (fast, no DB, < 10s) ──
  # 只跑核心代码 + unit 测试代码变更；集成/E2E 测试变更不触发
  unit-test-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.unit == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        # RAG 测试文件与 coverage 同进程冲突（chromadb hnsw "Nothing found on disk"，F14 先例
        # ImportError 同族；branch=true 后 CI 实测暴露）——从 --cov 排除，单独无 --cov 跑（覆盖率以
        # coverage-backend job 的排除口径一致，docs/api-coverage.md 登记替代证据）。
        # --reruns 2：chromadb 1.5.9 Windows CI 上 hnsw 段读取偶发竞态（写入后立即 retrieve，
        # 本地稳定复现不了，CI 两次失败用例不同 = 非确定性）；pytest-rerunfailures 兜底重试
        run: |
          uv run pytest tests/unit/ --ignore=tests/unit/test_langchain_vector_store.py -v --tb=short --cov=inkflow --cov-report=xml
          uv run pytest tests/unit/test_langchain_vector_store.py -v --tb=short --reruns 2 --reruns-delay 1

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  # ── Integration: Chapter (repo + service + API + CLI) ──
  # 只要修改代码（核心或测试）都触发
  integration-chapter-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run chapter integration tests
        run: |
          uv run pytest ../tests/integration/test_chapter_repository.py `
                 ../tests/integration/test_chapter_service.py `
                 ../tests/api/test_chapter_api.py `
                 ../tests/cli/test_cli_chapter.py `
                 -v --tb=short

  # ── Integration: Project (repo + service + API + CLI) ──
  integration-project-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run project integration tests
        run: |
          uv run pytest ../tests/integration/test_project_repository.py `
                 ../tests/integration/test_project_service.py `
                 ../tests/api/test_project_api.py `
                 ../tests/cli/test_cli_project.py `
                 -v --tb=short

  # ── Integration: Writing (API + CLI) ──
  integration-writing-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run writing integration tests
        run: |
          uv run pytest ../tests/api/test_writing_api.py `
                 ../tests/cli/test_cli_writing.py `
                 -v --tb=short

  # ── Integration: Agent (pipeline + API + CLI) ──
  integration-agent-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run agent integration tests
        run: |
          uv run pytest ../tests/integration/test_agent_pipeline.py `
                 ../tests/api/test_agent_api.py `
                 ../tests/cli/test_cli_agent.py `
                 -v --tb=short

  # ── Integration: CLI（迁移后 tests/cli/ mock 式 CLI 测试，Issue #61 目录治理）──
  integration-cli-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run CLI integration tests
        run: |
          uv run pytest ../tests/cli/test_cli_project_mock.py `
                 ../tests/cli/test_cli_chapter_mock.py `
                 ../tests/cli/test_cli_write.py `
                 ../tests/cli/test_cli_output.py `
                 ../tests/cli/test_cli_serve.py `
                 ../tests/cli/test_cli_config.py `
                 ../tests/cli/test_cli_llm.py `
                 ../tests/cli/test_cli_character.py `
                 ../tests/cli/test_cli_world.py `
                 ../tests/cli/test_cli_outline.py `
                 ../tests/cli/test_cli_timeline.py `
                 ../tests/cli/test_cli_foreshadowing.py `
                 ../tests/cli/test_cli_extraction.py `
                 ../tests/cli/test_cli_vector.py `
                 ../tests/cli/test_cli_audit.py `
                 ../tests/cli/test_cli_style.py `
                 -v --tb=short

  # ── Smoke: health check (fastest) ──
  smoke-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Health check
        run: uv run pytest ../tests/api/test_health.py ../tests/api/test_token_auth.py -v --tb=short

  # ── Frontend unit: lint + typecheck + vitest（renderer + electron 双包）──
  frontend-unit:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, renderer)
        run: pnpm --filter renderer lint

      - name: Type check (renderer + electron)
        run: |
          pnpm --filter renderer typecheck
          pnpm --filter inkflow-electron build

      - name: Unit tests (Vitest, renderer + electron)
        run: |
          pnpm --filter renderer test
          pnpm --filter inkflow-electron test

  # ── Frontend integration: renderer API client ↔ 真实内核往返（spec §4.7 集成层）──
  frontend-integration:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      # Windows runner 默认 cp1252（charmap）：serve.py 启动横幅含 🚀/中文 → UnicodeEncodeError
      # → 内核崩溃 exit 1。PYTHONUTF8=1 强制 UTF-8 模式（Python 3.7+），spawn 子进程继承
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Integration tests (renderer apiFetch ↔ real kernel)
        run: pnpm --filter renderer test:integration

  # ── Frontend E2E: Playwright _electron 冒烟（独立并行，spec §3.6；时长超标再拆细）──
  frontend-e2e:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      # 同 frontend-integration：内核 spawn 需 UTF-8（Windows runner cp1252 会 UnicodeEncodeError）
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build renderer (dist/)
        run: pnpm --filter renderer build

      - name: Build electron main/preload (out/)
        run: pnpm --filter inkflow-electron build

      - name: E2E smoke (Playwright _electron launch/revive/recycle)
        run: pnpm --filter inkflow-electron test:e2e

  # ── Coverage: 后端覆盖率门禁（unit + 顶层合并 --cov-append；RAG 文件 F14 先例排除）──
  # 首轮门槛 = 当前基线（行 91.17% / 分支 81.25%，2026-08-05 实测 CI 等价命令），
  # Phase 3 上调至目标（行 99% / 分支 90%）
  coverage-backend:
    needs: [changes]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Coverage (unit + top-level merged)
        # unit 与顶层 tests 不能同命令（conftest 命名冲突，0.2.0 收尾实测）——分两条 + --cov-append
        # test_langchain_vector_store.py 与 coverage 同进程冲突（chromadb C 扩展）——F14 先例 --ignore
        run: |
          uv run pytest tests/unit/ --cov=inkflow --cov-append --ignore=tests/unit/test_langchain_vector_store.py -q
          uv run pytest ../tests/api/ ../tests/integration/ ../tests/cli/ --cov=inkflow --cov-append -q
          uv run coverage xml -o coverage.xml

      - name: Coverage gate (line >= 91%, branch >= 81%)
        run: uv run python ../ci_cd/check_coverage.py 91.0 81.0 coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Coverage: 前端覆盖率门禁（renderer + electron；thresholds 内置于 vitest.config.ts）──
  coverage-frontend:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Coverage (renderer + electron)
        run: |
          pnpm --filter renderer test --coverage
          pnpm --filter inkflow-electron test --coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: |
            frontend/packages/renderer/coverage/
            frontend/packages/electron/coverage/

  # ── Build: wheel (all gates pass) ──
  build-backend:
    needs: [lint-backend, unit-test-backend, integration-chapter-backend, integration-project-backend, integration-writing-backend, integration-agent-backend, integration-cli-backend, smoke-backend, frontend-unit, frontend-integration, frontend-e2e, coverage-backend, coverage-frontend]
    # 显式条件：needs 中任一 job 被 skip（如后端-only PR 时 frontend-unit 不触发）时，
    # 默认语义会让 build 也被 skip——此处显式放行（skipped ≠ failure），仅 failure/cancelled 阻止
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Build wheel
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $sha = '${{ github.event.pull_request.head.sha }}'.Substring(0, 7)
            $devVersion = "0.1.0.dev0+g$sha"
            (Get-Content pyproject.toml) -replace 'version = "0.1.0"', "version = `"$devVersion`"" | Set-Content pyproject.toml
            Write-Host "PR build: version set to $devVersion"
          }
          uv build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: inkflow-wheel
          path: backend/dist/*.whl

  # ── 真实 AI e2e（ADR-026 / Issue #92）：label run-ai-tests 触发 + workflow_dispatch 兜底 ──
  # 信息性 check：不进 build-backend needs、不设 required——外部 LLM 服务抖动不卡 merge。
  # 守卫：secrets.LLM_API_KEY 为空（fork PR / 未配置）时测试 step 跳过（缺 key 永远 skip 不 fail）。
  # ⚠️ 实现调整（2026-08-05 实测）：GitHub 拒绝在 job 级 if 中引用 secrets（workflow 解析失败），
  #    guard 移至 step 级 if（step 级 secrets 引用为 GitHub 标准支持模式）。
  e2e-ai-backend:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'run-ai-tests')
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run real-AI e2e tests (T1 connectivity + T2 writing generate)
        # 守卫（ADR-026）：LLM_API_KEY 为空（fork PR / 未配置）时跳过——缺 key 永远 skip 不 fail。
        # ⚠️ GitHub 限制：if 条件不支持 secrets 上下文（实测 job/step 级引用均解析失败）——
        #    secrets 经 job env 注入（合法），if 引用 env 上下文（合法）。
        if: env.LLM_API_KEY != ''
        run: |
          uv run pytest ../tests/e2e/test_llm_connectivity.py `
                 ../tests/e2e/test_writing_generate.py `
                 -v --tb=short -m e2e
