name: CI
on:
  push:
    branches: [main, develop]
    # 功能/测试/CI 变更触发；文档类变更（*.md、design/、docs/、specs/、adr/ 等）也触发
    # （分支保护 required checks 需要结论；docs-only PR 若不触发 workflow 则 required
    # checks 无报告 → BLOCKED 无法 merge，#119 实测）
    paths:
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'tests/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/**'
      - '.github/**'
      - '*.md'
      - 'adr/**'
      - 'docs/**'
      - 'design/**'
      - 'specs/**'
  pull_request:
    branches: [main]
    # labeled 为 e2e-ai-backend 的触发入口（ADR-026）；opened/synchronize/reopened 为默认类型，必须显式保留
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'backend/src/**'
      - 'backend/tests/**'
      - 'tests/**'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'frontend/**'
      - '.github/**'
      - '*.md'
      - 'adr/**'
      - 'docs/**'
      - 'design/**'
      - 'specs/**'
  # 手动触发 e2e-ai-backend（ADR-026 Q1=B 兜底）：任意分支/任意时间运行真实 AI 测试
  workflow_dispatch:

jobs:
  # ── 变更检测元 job：分层触发决策（dorny/paths-filter）──
  # core   = 核心功能代码 + 依赖配置
  # unit   = unit 测试代码（backend/tests/unit/）
  # tests  = 全部测试代码（unit + 集成 + E2E/CLI）
  # ci     = CI 配置本身（改 CI 全量重验）
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core: ${{ steps.filter.outputs.core }}
      unit: ${{ steps.filter.outputs.unit }}
      tests: ${{ steps.filter.outputs.tests }}
      frontend: ${{ steps.filter.outputs.frontend }}
      e2e: ${{ steps.filter.outputs.e2e }}
      ci: ${{ steps.filter.outputs.ci }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'backend/src/**'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
            unit:
              - 'backend/tests/unit/**'
            tests:
              - 'backend/tests/**'
              - 'tests/**'
            frontend:
              - 'frontend/**'
            # E2E spec 变更（tests/e2e/）触发页面级 e2e-* job（#142 实测：纯 E2E 变更
            # 之前只命中 tests output，页面级 job 全部 skip → 新增用例 CI 无验证）
            e2e:
              - 'tests/e2e/**'
            ci:
              - '.github/**'
            # 文档类变更：分支保护 required checks（lint/unit/build）在 docs-only PR 也必须
            # 有结论（成功或跳过），否则 GitHub 视为 pending → BLOCKED 无法 merge
            # （#118 实测：docs-only PR 全部 job skipped → merge 被 base branch policy 阻止）。
            # docs 变化触发 required job 运行（AGENTS.md 变更跑 lint/unit/build 保守但可靠）
            docs:
              - 'AGENTS.md'
              - 'ARCHITECTURE.md'
              - 'FEATURES.md'
              - 'CONTRIBUTING.md'
              - 'adr/**'
              - 'docs/**'
              - 'design/**'
              - 'specs/**'

  # ── Lint: ruff check + mypy type check ──
  lint-backend:
    # 第一批：恒跑（required check，不依赖 paths-filter）——默认 needs 语义 = changes 成功后必跑
    needs: [changes]
    permissions:
      contents: read
      checks: write
      pull-requests: write   # reviewdog github-pr-review
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - uses: reviewdog/action-setup@v1

      - name: Ruff check + annotate (Reviewdog)
        shell: pwsh
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ruffOutput = uv run ruff check src/ tests/unit/ ../tests/ --output-format=concise
          $ruffExit = $LASTEXITCODE
          if ($ruffOutput) {
            $fixed = $ruffOutput `
              -replace '^src/', 'backend/src/' `
              -replace '^tests/unit/', 'backend/tests/unit/' `
              -replace '^\.\./tests/', 'tests/'
            $fixed | reviewdog -efm='%f:%l:%c: %m' -reporter=github-pr-review -level=warning -name=ruff -tee
          }
          if ($ruffExit -ne 0) { exit $ruffExit }

      - name: Type check with mypy
        run: uv run mypy src/ --ignore-missing-imports

      # ── 质量护栏（借鉴 LiteLLM ci_cd/）：monster file 禁令 + noqa 带理由 ──
      - name: "Guardrail: file length (monster file ban)"
        shell: pwsh
        run: |
          uv run python ../ci_cd/check_file_length.py 900 src/ ../tests/ tests/unit/ ../frontend/packages/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: "Guardrail: noqa must carry a reason"
        shell: pwsh
        run: |
          uv run python ../ci_cd/check_noqa_reason.py src/ ../tests/ tests/unit/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ── Unit tests (fast, no DB, < 10s) ──
  # 只跑核心代码 + unit 测试代码变更；集成/E2E 测试变更不触发
  unit-backend:
    # 第一批：恒跑（required check）——默认 needs 语义 = changes 成功后必跑
    needs: [changes]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        # #273: chromadb 与 coverage 同进程冲突已修复（#276 hnsw:sync_threshold=3 + chromadb 1.5.9），
        # chromadb 测试直接进 --cov 口径（与 coverage-backend 一致），不再单独无 --cov 跑。
        # --reruns 2：chromadb 1.5.9 Windows CI 上 hnsw 段读取偶发竞态（写入后立即 retrieve，
        # 本地稳定复现不了，CI 两次失败用例不同 = 非确定性）；pytest-rerunfailures 兜底重试
        run: |
          uv run pytest tests/unit/ -v --tb=short --cov=inkflow --cov-report=xml --reruns 2 --reruns-delay 1

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  # ── Integration: Chapter (repo + service + API + CLI) ──
  # 只要修改代码（核心或测试）都触发
  integration-chapter-backend:
    # 第二批：按需触发（core/tests/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run chapter integration tests
        run: |
          uv run pytest ../tests/integration/test_chapter_repository.py `
                 ../tests/integration/test_chapter_service.py `
                 ../tests/api/test_chapter_api.py `
                 ../tests/cli/test_cli_chapter.py `
                 -v --tb=short

  # ── Integration: Project (repo + service + API + CLI) ──
  integration-project-backend:
    # 第二批：按需触发（core/tests/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run project integration tests
        run: |
          uv run pytest ../tests/integration/test_project_repository.py `
                 ../tests/integration/test_project_service.py `
                 ../tests/api/test_project_api.py `
                 ../tests/api/test_export_api.py `
                 ../tests/cli/test_cli_project.py `
                 ../tests/api/test_search_api.py `
                 -v --tb=short

  # ── Integration: Writing (API + CLI) ──
  integration-writing-backend:
    # 第二批：按需触发（core/tests/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run writing integration tests
        run: |
          uv run pytest ../tests/api/test_writing_api.py `
                 ../tests/cli/test_cli_writing.py `
                 -v --tb=short

  # ── Integration: Agent (pipeline + API + CLI) ──
  integration-agent-backend:
    # 第二批：按需触发（core/tests/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run agent integration tests
        run: |
          uv run pytest ../tests/integration/test_agent_pipeline.py `
                 ../tests/api/test_agent_api.py `
                 ../tests/api/test_agents_api.py `
                 ../tests/api/test_books_api.py `
                 ../tests/api/test_skills_api.py `
                 ../tests/api/test_skills_cascade.py `
                 ../tests/integration/test_builtin_seed.py `
                 ../tests/cli/test_cli_agent.py `
                 -v --tb=short

  # ── Integration: CLI（迁移后 tests/cli/ mock 式 CLI 测试，Issue #61 目录治理）──
  integration-cli-backend:
    # 第二批：按需触发（core/tests/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run CLI integration tests
        run: |
          uv run pytest ../tests/cli/test_cli_chapter_mock.py `
                 ../tests/cli/test_cli_write.py `
                 ../tests/cli/test_cli_output.py `
                 ../tests/cli/test_cli_serve.py `
                 ../tests/cli/test_cli_config.py `
                 ../tests/cli/test_cli_llm.py `
                 ../tests/cli/test_cli_character_crud.py `
                 ../tests/cli/test_cli_character_relations.py `
                 ../tests/cli/test_cli_character_errors.py `
                 ../tests/cli/test_cli_world.py `
                 ../tests/cli/test_cli_world_tree.py `
                 ../tests/cli/test_cli_world_copy.py `
                 ../tests/cli/test_cli_map.py `
                 ../tests/cli/test_cli_map_coverage.py `
                 ../tests/cli/test_cli_outline.py `
                 ../tests/cli/test_cli_timeline_crud.py `
                 ../tests/cli/test_cli_timeline_ops.py `
                 ../tests/cli/test_cli_foreshadowing.py `
                 ../tests/cli/test_cli_extraction_crud.py `
                 ../tests/cli/test_cli_extraction_errors.py `
                 ../tests/cli/test_cli_vector.py `
                 ../tests/cli/test_cli_audit.py `
                 ../tests/cli/test_cli_audit_chapter.py `
                 ../tests/cli/test_cli_style.py `
                 ../tests/cli/test_cli_session.py `
                 ../tests/cli/test_cli_session_coverage.py `
                 ../tests/cli/test_cli_kernel.py `
                 ../tests/cli/test_cli_http_kernel.py `
                 ../tests/cli/test_cli_outline_http.py `
                 ../tests/cli/test_cli_display_helpers.py `
                 ../tests/cli/test_cli_run_fallback.py `
                 ../tests/cli/test_cli_export.py `
                 ../tests/cli/test_cli_search.py `
                 ../tests/cli/test_cli_agent_tools.py `
                 ../tests/cli/test_cli_agent_run.py `
                 ../tests/cli/test_cli_agent_draft.py `
                 ../tests/cli/test_cli_write_agentic.py `
                 ../tests/cli/test_cli_memory.py `
                 ../tests/cli/test_cli_llm_provider.py `
                 ../tests/cli/test_cli_agent_template.py `
                 ../tests/cli/test_cli_project_update.py `
                 ../tests/cli/test_cli_chapter_summary.py `
                 ../tests/cli/test_cli_context_assemble.py `
                 ../tests/cli/test_cli_skills.py `
                 ../tests/cli/test_cli_mcp.py `
                 ../tests/cli/test_cli_agent_entity.py `
                 ../tests/cli/test_cli_skill.py `
                 ../tests/cli/test_book_cmd.py `
                 -v --tb=short

  # ── Smoke: health check (fastest) ──
  smoke-backend:
    # 第二批：按需触发（core/tests/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Health check
        run: uv run pytest ../tests/api/test_health.py ../tests/api/test_token_auth.py -v --tb=short

  # ── Frontend unit: Vitest（renderer + electron 双包，第一批恒跑）──
  unit-frontend:
    # 第一批：恒跑（required check）——默认 needs 语义 = changes 成功后必跑
    needs: [changes]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 拆独立 step（#405）：多行 run 无退出码传播 → renderer vitest 失败被 electron 段成功掩盖
      # （job 假绿，#214 coverage-backend 同族）。每 step 独立退出码，vitest 失败真实红。
      - name: Unit tests (Vitest, renderer)
        run: pnpm --filter renderer test

      - name: Unit tests (Vitest, electron)
        run: pnpm --filter inkflow-electron test

  # ── Frontend lint: ESLint + typecheck + compile check（静态检查，第一批恒跑）──
  lint-frontend:
    # 第一批：恒跑（required check）——默认 needs 语义 = changes 成功后必跑
    needs: [changes]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, renderer)
        run: pnpm --filter renderer lint

      - name: Type check (renderer)
        run: pnpm --filter renderer typecheck

      - name: Compile check (electron main/preload)
        run: pnpm --filter inkflow-electron build

  # ── Frontend integration: renderer API client ↔ 真实内核往返（spec §4.7 集成层）──
  integration-frontend:
    # 第二批：按需触发（frontend/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      # Windows runner 默认 cp1252（charmap）：serve.py 启动横幅含 🚀/中文 → UnicodeEncodeError
      # → 内核崩溃 exit 1。PYTHONUTF8=1 强制 UTF-8 模式（Python 3.7+），spawn 子进程继承
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Integration tests (renderer apiFetch ↔ real kernel)
        run: pnpm --filter renderer test:integration

  # ── Frontend E2E 6 job 并行（ADR-028 E1：shell 第一批恒跑 required + 页面级第二批按需）──
  e2e-frontend-shell:
    # 第一批：恒跑（required check，不依赖 paths-filter）——默认 needs 语义 = changes 成功后必跑
    needs: [changes]
    permissions:
      contents: read
    runs-on: windows-latest
    env:
      # 同 integration-frontend：内核 spawn 需 UTF-8（Windows runner cp1252 会 UnicodeEncodeError）
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build renderer (dist/)
        run: pnpm --filter renderer build

      - name: Build electron main/preload (out/)
        run: pnpm --filter inkflow-electron build

      - name: E2E shell (Playwright _electron launch/revive/recycle + tray)
