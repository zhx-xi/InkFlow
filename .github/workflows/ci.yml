name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint: ruff check + mypy type check ──
  lint-backend:
    permissions:
      contents: read
      checks: write
      pull-requests: write   # reviewdog github-pr-review
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - uses: reviewdog/action-setup@v1

      - name: Ruff check + annotate (Reviewdog)
        shell: pwsh
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ruffOutput = ruff check src/ tests/unit/ ../tests/ --output-format=concise
          $ruffExit = $LASTEXITCODE
          if ($ruffOutput) {
            $fixed = $ruffOutput `
              -replace '^src/', 'backend/src/' `
              -replace '^tests/unit/', 'backend/tests/unit/' `
              -replace '^\.\./tests/', 'tests/'
            $fixed | reviewdog -efm='%f:%l:%c: %m' -reporter=github-pr-review -level=warning -name=ruff -tee
          }
          if ($ruffExit -ne 0) { exit $ruffExit }

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports

  # ── Unit tests (fast, no DB, < 10s) ──
  unit-test-backend:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=inkflow --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          fail_ci_if_error: false

  # ── Integration: Chapter (repo + service + API + CLI) ──
  integration-chapter-backend:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run chapter integration tests
        run: |
          pytest ../tests/integration/test_chapter_repository.py `
                 ../tests/integration/test_chapter_service.py `
                 ../tests/api/test_chapter_api.py `
                 ../tests/cli/test_cli_chapter.py `
                 -v --tb=short

  # ── Integration: Project (repo + service + API + CLI) ──
  integration-project-backend:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run project integration tests
        run: |
          pytest ../tests/integration/test_project_repository.py `
                 ../tests/integration/test_project_service.py `
                 ../tests/api/test_project_api.py `
                 ../tests/cli/test_cli_project.py `
                 -v --tb=short

  # ── Integration: Writing (API + CLI) ──
  integration-writing-backend:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run writing integration tests
        run: |
          pytest ../tests/api/test_writing_api.py `
                 ../tests/cli/test_cli_writing.py `
                 -v --tb=short

  # ── Integration: Agent (pipeline + API + CLI) ──
  integration-agent-backend:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run agent integration tests
        run: |
          pytest ../tests/integration/test_agent_pipeline.py `
                 ../tests/api/test_agent_api.py `
                 ../tests/cli/test_cli_agent.py `
                 -v --tb=short

  # ── Smoke: health check (fastest) ──
  smoke-backend:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Health check
        run: pytest ../tests/api/test_health.py -v --tb=short

  # ── Build: wheel (all gates pass) ──
  build-backend:
    needs: [lint-backend, unit-test-backend, integration-chapter-backend, integration-project-backend, integration-writing-backend, integration-agent-backend, smoke-backend]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $sha = '${{ github.event.pull_request.head.sha }}'.Substring(0, 7)
            $devVersion = "0.1.0.dev0+g$sha"
            (Get-Content pyproject.toml) -replace 'version = "0.1.0"', "version = `"$devVersion`"" | Set-Content pyproject.toml
            Write-Host "PR build: version set to $devVersion"
          }
          python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkflow-wheel
          path: backend/dist/*.whl
