  # ── Build: wheel（依赖第一批 lint/unit，与第二批集成/E2E 并行；为后续打包 job 腾名）──
  build:
    # 第一批恒跑（lint/unit 全 required）→ 默认 needs 语义即可：
    # 任一 failure → build skip → required pending → BLOCKED（正确门禁）；cancelled → skip
    needs: [lint-backend, unit-backend, lint-frontend, unit-frontend]
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Build wheel
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $sha = '${{ github.event.pull_request.head.sha }}'.Substring(0, 7)
            $devVersion = "0.1.0.dev0+g$sha"
            (Get-Content pyproject.toml) -replace 'version = "0.1.0"', "version = `"$devVersion`"" | Set-Content pyproject.toml
            Write-Host "PR build: version set to $devVersion"
          }
          uv build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: inkflow-wheel
          path: backend/dist/*.whl

  # ── 真实 AI e2e（ADR-026 / Issue #92）：label run-ai-tests 触发 + workflow_dispatch 兜底 ──
  # 信息性 check：不进 build needs、不设 required——外部 LLM 服务抖动不卡 merge。
  # 守卫：secrets.LLM_API_KEY 为空（fork PR / 未配置）时测试 step 跳过（缺 key 永远 skip 不 fail）。
  # ⚠️ 实现调整（2026-08-05 实测）：GitHub 拒绝在 job 级 if 中引用 secrets（workflow 解析失败），
  #    guard 移至 step 级 if（step 级 secrets 引用为 GitHub 标准支持模式）。
  e2e-ai-backend:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'run-ai-tests')
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run real-AI e2e tests (T1 connectivity + T2 writing generate)
        # 守卫（ADR-026）：LLM_API_KEY 为空（fork PR / 未配置）时跳过——缺 key 永远 skip 不 fail。
        # ⚠️ GitHub 限制：if 条件不支持 secrets 上下文（实测 job/step 级引用均解析失败）——
        #    secrets 经 job env 注入（合法），if 引用 env 上下文（合法）。
        if: env.LLM_API_KEY != ''
        run: |
          uv run pytest ../tests/e2e/test_llm_connectivity.py `
                 ../tests/e2e/test_writing_generate.py `
                 -v --tb=short -m e2e

  # ── 真实 AI GUI e2e（#298 管线化 / #161 Supervisor 动态路由）：与 e2e-ai-backend 同开关哲学 ──
  # label run-ai-tests 触发 + workflow_dispatch 兜底；信息性 check 不进 needs 不 required——
  # 外部 LLM 服务抖动不卡 merge。守卫：secrets.LLM_API_KEY 为空时测试 step 跳过（缺 key 永远 skip 不 fail）。
  # 说明：B1 spec（e2e-pipeline-ai.spec.ts）读 process.env.INKFLOW_LLM_KEY；deepseek key 经
  # INKFLOW_LLM_KEY 注入（secrets.LLM_API_KEY）；provider/model 由 tests/e2e/e2e-llm.config.ts 默认
  # （deepseek/deepseek-v4-flash），INKFLOW_E2E_LLM_PROVIDER/MODEL env 可覆盖。
  e2e-ai-frontend:
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && github.event.label.name == 'run-ai-tests')
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      INKFLOW_LLM_KEY: ${{ secrets.LLM_API_KEY }}
      # 内核 spawn 需 UTF-8（Windows runner cp1252 会 UnicodeEncodeError）
      PYTHONUTF8: "1"
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install backend deps (kernel venv)
        working-directory: backend
        run: uv sync --frozen --extra dev

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build renderer (dist/)
        run: pnpm --filter renderer build

      - name: Build electron main/preload (out/)
        run: pnpm --filter inkflow-electron build

      - name: E2E pipeline AI (real LLM, #298 管线化 + #366 G1-G4 补测)
        # 守卫（同 e2e-ai-backend）：INKFLOW_LLM_KEY 为空（fork PR / 未配置）时跳过——缺 key 永远 skip 不 fail。
        if: env.INKFLOW_LLM_KEY != ''
        run: pnpm --filter inkflow-electron test:e2e e2e-pipeline-ai e2e-pipeline-gaps
