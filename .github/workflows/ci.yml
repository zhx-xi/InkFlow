  # ── Coverage: 后端覆盖率门禁（unit + 顶层合并 --cov-append；RAG 文件 F14 先例排除）──
  # 门槛（2026-08-06 Phase 3 实测 CI 权威口径）：
  #   行 98.90% / 分支 96.32% —— 写入 98.5/95.0（留 0.4/1.3 余量防环境抖动）。
  # 剩余 miss 均为物理不可达防御分支（payload 非 dict / for 循环耗尽弧 / except 重抛），
  # 已由 C 方案 exclude_lines 排除 Protocol 接口方法体；目标 99/90 已达（98.90 ≥ 目标线）。
  coverage-backend:
    # 第二批：按需触发（core/tests/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
    needs: [changes, lint-backend, unit-backend, lint-frontend, unit-frontend]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Coverage (unit + top-level merged)
        # unit 与顶层 tests 不能同命令（conftest 命名冲突，0.2.0 收尾实测）——分两条 + --cov-append
        # #273: chromadb 与 coverage 同进程冲突已修复（#276 hnsw:sync_threshold=3 + chromadb 1.5.9），
        # 不再 --ignore test_langchain_vector_store.py —— langchain_vector_store 真实覆盖 99% 进 cov 口径
        # 多行 run 必须逐行检查 $LASTEXITCODE（#214 假绿坑：coverage xml 成功掩盖 pytest 失败）
        # --reruns 2：chromadb 1.5.9 Windows CI 上 hnsw 段读取偶发竞态（#409，与 unit-backend 对齐）；pytest-rerunfailures 兜底重试
        run: |
          uv run pytest tests/unit/ --cov=inkflow --cov-append -q --reruns 2 --reruns-delay 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run pytest ../tests/api/ ../tests/integration/ ../tests/cli/ --cov=inkflow --cov-append -q --reruns 2 --reruns-delay 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run coverage xml -o coverage.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Coverage gate (line >= 98.5%, branch >= 95%)
        run: uv run python ../ci_cd/check_coverage.py 98.5 95.0 coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ── Coverage: 前端覆盖率门禁（renderer + electron；thresholds 内置于 vitest.config.ts）──
  coverage-frontend:
    # 第二批：按需触发（frontend/ci 变更）；第一批 failure 时默认 needs 语义自动 skip（止损）
