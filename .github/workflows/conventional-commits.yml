name: Conventional Commits

# PR 标题遵循 Conventional Commits（与本地 commit-msg 钩子同规则，双保险）。
# 规则: <type>(<scope>)!: <description>，description 小写开头。
# 类型: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: PR title check
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: [^A-Z]'; then
            echo "::error::PR title must follow Conventional Commits: <type>(<scope>)!: <description> (description lowercase)"
            echo "Got: $TITLE"
            exit 1
          fi
