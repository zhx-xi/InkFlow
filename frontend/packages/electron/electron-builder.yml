# electron-builder 配置（F19 打包分发 0.4.0，Issue #48；spec f19-packaging §6.2）
# 本地/CI 打包前需先把 PyInstaller 产物组装到 frontend/packages/kernel/：
#   backend/dist/inkflow/ 整体 → frontend/packages/kernel/
appId: com.inkflow.app
productName: InkFlow
directories:
  output: dist
files:
  - out/**
  - favicon.ico
  - renderer-dist/**
  - inkflow-icon-256.png
  # ⚠️ 不用 ../renderer/dist/**——越出包目录的 glob 不会打进 asar（rc.5 实测空白 #145）；
  #    renderer dist 由 release.yml 组装步骤复制进 packages/electron/renderer-dist/
# 内核可执行目录整体打进 resources/kernel/（kernel.ts isPackaged 分支定位）
extraResources:
  - from: ../kernel
    to: kernel
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip
artifactName: InkFlow-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
compression: maximum
