<!DOCTYPE html>
<html lang="zh" data-theme="paper">
<head>
<meta charset="utf-8" />
<title>InkFlow 项目页 — 官方简图原型</title>
<style>
/* ═══════════ 设计 Token（对齐 frontend/packages/renderer/src/theme/tokens.css） ═══════════ */
:root{
  --radius-s:4px; --radius-m:6px; --radius-l:8px;
  --font-ui:"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  --font-serif:"Noto Serif SC","Source Han Serif SC","SimSun","宋体",Georgia,serif;
  --dur:180ms; --ease:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="paper"]{
  --bg:#FAF9F7; --surface:#FFFFFF; --surface-2:#F3F1EC; --surface-3:#EBE8E1;
  --ink:#2A2A28; --ink-2:#6B6A66; --ink-3:#A4A29B; --line:#E5E2DA;
  --accent:#3B5B7C; --accent-ink:#FFFFFF; --accent-hover:#325370; --accent-weak:rgba(59,91,124,.10);
  --ring:rgba(59,91,124,.38); --ok:#4A7C59; --warn:#B07A2E; --err:#B04A3A;
  --shadow:0 1px 2px rgba(42,42,40,.05),0 4px 16px rgba(42,42,40,.05);
  --shadow-hover:0 2px 4px rgba(42,42,40,.07),0 8px 24px rgba(42,42,40,.09);
}
[data-theme="night"]{
  --bg:#1A1A18; --surface:#22221F; --surface-2:#282823; --surface-3:#4A493F;
  --ink:#E8E6E1; --ink-2:#9B988F; --ink-3:#6E6B63; --line:#42413A;
  --accent:#C9A24B; --accent-ink:#1A1A18; --accent-hover:#B8923F; --accent-weak:rgba(201,162,75,.13);
  --ring:rgba(201,162,75,.45); --ok:#8FAE8E; --warn:#C9A24B; --err:#C97B63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-hover:0 2px 6px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
[data-theme="ink"]{
  --bg:#F3EEE2; --surface:#FAF6EC; --surface-2:#EFE9DA; --surface-3:#C9BFA4;
  --ink:#2B2A26; --ink-2:#6E6A5E; --ink-3:#A49F90; --line:#CBC0A4;
  --accent:#A6402E; --accent-ink:#FAF6EC; --accent-hover:#96382A; --accent-weak:rgba(166,64,46,.09);
  --ring:rgba(166,64,46,.38); --ok:#5A7A58; --warn:#9A7B3C; --err:#A6402E;
  --shadow:0 1px 2px rgba(43,42,38,.06),0 4px 16px rgba(43,42,38,.06);
  --shadow-hover:0 2px 4px rgba(43,42,38,.08),0 8px 24px rgba(43,42,38,.10);
}
/* ═══════════ 基础 ═══════════ */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;line-height:1.5;overflow:hidden}
.ic{width:16px;height:16px;flex:none}
.ic svg{display:block;width:100%;height:100%}
/* 兜底：所有 data-ic 图标默认尺寸（可被更具体规则覆盖） */
[data-ic] svg{width:16px;height:16px;display:block;flex:none}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--ring)}

/* ═══════════ 布局骨架 ═══════════ */
.app{display:flex;height:100vh;overflow:hidden}
.app-nav{display:flex;flex-direction:column;flex:none;width:216px;border-right:1px solid var(--line);background:var(--surface-2)}
.nav-brand{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-bottom:1px solid var(--line)}
.nav-brand .logo{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.nav-brand .logo svg{width:15px;height:15px}
.nav-brand span{font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 0}
.nav-group{padding:0 8px}
.nav-group-label{display:flex;align-items:center;gap:6px;padding:12px 8px 4px;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.nav-group-label svg{width:14px;height:14px;flex:none}
.nav-item{display:flex;width:100%;align-items:center;gap:10px;border-radius:6px;padding:6px 10px;font-size:13px;color:var(--ink-2);text-decoration:none;transition:background var(--dur)}
.nav-item svg{width:16px;height:16px;flex:none}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:500}
.nav-item.active svg{color:var(--accent)}
.nav-collapse{flex:none;border-top:1px solid var(--line);padding:8px}
.nav-collapse button{display:flex;width:100%;align-items:center;gap:10px;border:none;background:none;border-radius:6px;padding:6px 10px;font-size:12px;color:var(--ink-3)}
.nav-collapse button:hover{background:var(--surface-3);color:var(--ink)}
.app-main{display:flex;flex:1;min-width:0;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;height:48px;flex:none;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar .page-title{font-size:13px;color:var(--ink-2)}
.topbar .spacer{flex:1}
.select{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-2);font-size:12px;padding:3px 8px;height:26px}
.select svg{width:12px;height:12px;color:var(--ink-3)}
.win-ctrl{display:flex;align-items:center;gap:2px;height:100%}
.win-ctrl button{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;background:none;border-radius:4px;color:var(--ink-3)}
.win-ctrl button:hover{background:var(--surface-3);color:var(--ink)}
.win-ctrl button.close:hover{background:var(--err);color:#fff}

/* ═══════════ 项目页 ═══════════ */
.page-projects{flex:1;min-height:0;overflow-y:auto;margin:0 auto;max-width:1080px;width:100%;padding:40px 48px}
.page-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px}
.page-head h1{margin:0;font-family:var(--font-serif);font-size:26px;font-weight:600}
.page-head .sub{margin-top:2px;font-size:13px;color:var(--ink-3)}
.btn-primary{border:none;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:13px;padding:6px 16px;transition:background var(--dur)}
.btn-primary:hover{background:var(--accent-hover)}
.card-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.project-card{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:24px;box-shadow:var(--shadow);cursor:pointer;transition:box-shadow var(--dur),border-color var(--dur)}
.project-card:hover{box-shadow:var(--shadow-hover)}
.project-card.current{border-color:var(--accent)}
.writing-badge{position:absolute;right:48px;top:12px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;padding:2px 8px}
.card-menu-wrap{position:absolute;right:12px;top:12px}
.menu-btn{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;border-radius:6px;background:none;color:var(--ink-3)}
.menu-btn:hover{background:var(--surface-3);color:var(--accent)}
.menu-btn svg{width:16px;height:16px}
.card-menu{position:absolute;right:0;top:28px;z-index:20;width:112px;border:1px solid var(--line);border-radius:6px;background:var(--surface);box-shadow:var(--shadow);padding:4px}
.card-menu button{display:flex;width:100%;align-items:center;border:none;border-radius:6px;background:none;padding:6px 10px;text-align:left;font-size:13px;color:var(--ink-2)}
.card-menu button:hover{background:var(--surface-3);color:var(--ink)}
.card-menu button.danger:hover{color:var(--err)}
.card-title{font-family:var(--font-serif);font-size:18px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta{margin-top:12px;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2)}
.card-meta .time{color:var(--ink-3)}
.progressbar{margin-top:16px;height:6px;border-radius:8px;overflow:hidden;background:var(--surface-3)}
.progressbar .fill{height:100%;border-radius:8px;background:var(--accent)}
.new-card{display:flex;align-items:center;justify-content:center;min-height:168px;border:2px dashed var(--line);border-radius:8px;background:none;font-size:13px;color:var(--ink-3);transition:border-color var(--dur),color var(--dur)}
.new-card:hover{border-color:var(--accent);color:var(--accent)}
.projects-empty{display:none;flex-direction:column;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:8px;background:var(--surface);padding:64px 24px;text-align:center}
.projects-empty .big-ic{width:40px;height:40px;color:var(--ink-3)}
.projects-empty .big-ic svg{width:40px;height:40px}
.projects-empty h3{margin:12px 0 0;font-family:var(--font-serif);font-size:17px;font-weight:600}
.projects-empty p{margin:4px 0 0;font-size:13px;color:var(--ink-3)}
.projects-empty button{margin-top:20px}

/* 空态：隐藏网格与表头按钮 */
body[data-state="empty"] .card-grid,body[data-state="empty"] .page-head .btn-primary{display:none}
body[data-state="empty"] .projects-empty{display:flex}

/* ═══════════ 新建项目对话框 ═══════════ */
.dialog-overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
body[data-state="new-dialog"] .dialog-overlay{display:flex}
.dialog{width:420px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:24px;box-shadow:var(--shadow-hover)}
.dialog h2{margin:0;font-family:var(--font-serif);font-size:18px;font-weight:600}
.dialog .fields{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px}
.field input[type=text],.field input[type=number]{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:8px 12px;font-size:14px;color:var(--ink);outline:none}
.field input:focus{border-color:var(--accent)}
.field .select{width:100%;height:36px;justify-content:space-between;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:8px;background:var(--surface-3);padding:2px 10px;font-size:12px;color:var(--ink)}
.chip button{display:flex;align-items:center;justify-content:center;width:16px;height:16px;border:none;border-radius:50%;background:none;color:var(--ink-3);font-size:13px;line-height:1}
.chip button:hover{background:var(--surface);color:var(--err)}
.form-error{font-size:13px;color:var(--err)}
.dialog .actions{margin-top:24px;display:flex;justify-content:flex-end;gap:8px}
.btn-ghost{border:1px solid var(--line);border-radius:6px;background:none;font-size:14px;color:var(--ink-2);padding:6px 16px}
.btn-ghost:hover{background:var(--surface-3)}
.btn-primary.sm{font-size:14px;padding:6px 16px}

/* ═══════════ 演示切换条（截图前隐藏） ═══════════ */
.demo-bar{position:fixed;right:14px;bottom:14px;z-index:200;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-hover);padding:8px 12px;font-size:12px;color:var(--ink-2)}
.demo-bar select{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12px;padding:3px 6px}
.demo-bar .sep{width:1px;height:18px;background:var(--line)}
</style>
</head>
<body data-state="grid">

<div class="app">
  <!-- ═══ 侧边导航 AppNav ═══ -->
  <nav class="app-nav" data-testid="app-nav">
    <div class="nav-brand">
      <span class="logo"><span data-ic="penline"></span></span>
      <span>InkFlow</span>
    </div>
    <div class="nav-scroll">
      <div class="nav-group">
        <div class="nav-group-label"><span data-ic="folderopen"></span>写作区</div>
        <a class="nav-item" data-testid="nav-item-writing"><span data-ic="penline"></span>写作</a>
        <a class="nav-item active" data-testid="nav-item-projects"><span data-ic="bookopen"></span>项目</a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label"><span data-ic="library"></span>设定库</div>
        <a class="nav-item"><span data-ic="library"></span>设定库</a>
        <a class="nav-item"><span data-ic="users"></span>角色</a>
        <a class="nav-item"><span data-ic="globe"></span>世界观</a>
        <a class="nav-item"><span data-ic="listtree"></span>大纲</a>
        <a class="nav-item"><span data-ic="clock"></span>时间线</a>
        <a class="nav-item"><span data-ic="sparkles"></span>伏笔</a>
        <a class="nav-item"><span data-ic="database"></span>知识图谱</a>
        <a class="nav-item"><span data-ic="search"></span>检索</a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label"><span data-ic="history"></span>会话</div>
        <a class="nav-item"><span data-ic="history"></span>会话</a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label"><span data-ic="settings"></span>系统</div>
        <a class="nav-item"><span data-ic="bot"></span>Agent</a>
        <a class="nav-item"><span data-ic="brain"></span>记忆</a>
        <a class="nav-item"><span data-ic="settings"></span>设置</a>
      </div>
    </div>
    <div class="nav-collapse"><button><span data-ic="chevronsleft"></span>折叠</button></div>
  </nav>

  <div class="app-main">
    <!-- ═══ 顶栏 ═══ -->
    <header class="topbar" role="banner">
      <span class="page-title">我的项目</span>
      <span class="spacer"></span>
      <span class="select"><span data-ic="palette"></span>素笺 · 纸张<span data-ic="chevron-down"></span></span>
      <span class="select">中文<span data-ic="chevron-down"></span></span>
      <div class="win-ctrl">
        <button><span data-ic="minus"></span></button>
        <button><span data-ic="square"></span></button>
        <button class="close"><span data-ic="x"></span></button>
      </div>
    </header>

    <!-- ═══ 项目页 ═══ -->
    <div class="page-projects">
      <div class="page-head">
        <div>
          <h1>我的项目</h1>
          <p class="sub">本地存储 · 自动存档 · 断网可用</p>
        </div>
        <button class="btn-primary" data-testid="new-project-btn">新建项目</button>
      </div>

      <div class="card-grid">
        <!-- 卡片 1：青云志（当前写作中） -->
        <div class="project-card current" data-testid="project-card">
          <span class="writing-badge" data-testid="writing-badge">写作中</span>
          <div class="card-menu-wrap">
            <button class="menu-btn" data-testid="project-card-menu-1"><span data-ic="moreh"></span></button>
            <div class="card-menu" data-testid="project-menu-1" style="display:none">
              <button>修改</button>
              <button>重命名</button>
              <button>导出</button>
              <button class="danger">删除</button>
            </div>
          </div>
          <h3 class="card-title">青云志</h3>
          <div class="card-meta">
            <div>仙侠，仙途，宗门</div>
            <div>800,000</div>
            <div>第 12 章 / 36 章</div>
            <div class="time">2 小时前</div>
          </div>
          <div class="progressbar" role="progressbar"><div class="fill" style="width:33%"></div></div>
        </div>
        <!-- 卡片 2：归墟记 -->
        <div class="project-card" data-testid="project-card">
          <div class="card-menu-wrap">
            <button class="menu-btn"><span data-ic="moreh"></span></button>
          </div>
          <h3 class="card-title">归墟记</h3>
          <div class="card-meta">
            <div>玄幻，东方神话</div>
            <div>500,000</div>
            <div>第 5 章 / 24 章</div>
            <div class="time">3 天前</div>
          </div>
          <div class="progressbar"><div class="fill" style="width:21%"></div></div>
        </div>
        <!-- 卡片 3：长夜行 -->
        <div class="project-card" data-testid="project-card">
          <div class="card-menu-wrap">
            <button class="menu-btn"><span data-ic="moreh"></span></button>
          </div>
          <h3 class="card-title">长夜行</h3>
          <div class="card-meta">
            <div>悬疑，都市，单元剧</div>
            <div>300,000</div>
            <div>第 8 章 / 20 章</div>
            <div class="time">1 周前</div>
          </div>
          <div class="progressbar"><div class="fill" style="width:40%"></div></div>
        </div>
        <!-- 末位虚线新建卡 -->
        <button class="new-card" data-testid="new-project-card">+ 新建项目</button>
      </div>

      <div class="projects-empty" data-testid="projects-empty">
        <span class="big-ic"><span data-ic="bookopen"></span></span>
        <h3>还没有项目</h3>
        <p>创建你的第一个故事，从书名开始。</p>
        <button class="btn-primary">新建项目</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ 新建项目对话框 ═══ -->
<div class="dialog-overlay">
  <div class="dialog" role="dialog" aria-modal="true" aria-label="新建项目" data-testid="new-project-dialog">
    <h2>新建项目</h2>
    <div class="fields">
      <label class="field">
        <span>书名</span>
        <input type="text" placeholder="例如: 青山入我怀" data-testid="new-project-name" />
      </label>
      <div class="field">
        <span>标签</span>
        <div class="chips">
          <span class="chip">仙侠<button>×</button></span>
          <span class="chip">复仇<button>×</button></span>
        </div>
        <span class="select">选择或输入标签，回车添加<span data-ic="chevron-down"></span></span>
        <input type="text" placeholder="输入标签，回车添加" data-testid="tags-input" />
      </div>
      <label class="field">
        <span>语言</span>
        <span class="select">中文<span data-ic="chevron-down"></span></span>
      </label>
      <label class="field">
        <span>Agent 模板</span>
        <span class="select">默认模板<span data-ic="chevron-down"></span></span>
      </label>
      <label class="field">
        <span>目标字数</span>
        <input type="number" min="0" value="800000" data-testid="new-project-target" />
      </label>
    </div>
    <div class="actions">
      <button class="btn-ghost" data-testid="new-project-cancel">取消</button>
      <button class="btn-primary sm" data-testid="new-project-create">创建</button>
    </div>
  </div>
</div>

<!-- ═══ 演示切换条 ═══ -->
<div class="demo-bar">
  <label>状态
    <select id="stateSel">
      <option value="grid">卡片网格</option>
      <option value="new-dialog">新建对话框</option>
      <option value="menu-open">卡片菜单</option>
      <option value="empty">空态</option>
    </select>
  </label>
  <span class="sep"></span>
  <label>主题
    <select id="themeSel">
      <option value="paper">素笺 · 纸张</option>
      <option value="night">夜航 · 深色</option>
      <option value="ink">墨韵 · 东方</option>
    </select>
  </label>
</div>

<script>
/* ── 内联 SVG 图标库（lucide 风格） ── */
const ICONS = {
  penline:'<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>',

  library:'<path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  listtree:'<path d="M11 6H3"/><path d="M15.5 12H3"/><path d="M15.5 18H3"/><path d="M18 6h3"/><path d="M18 12h3"/><path d="M18 18h3"/>',

document.querySelectorAll('[data-ic]').forEach(el=>{
  const name = el.getAttribute('data-ic');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 24 24');
  svg.setAttribute('fill','none');
  svg.setAttribute('stroke','currentColor');
  svg.setAttribute('stroke-width','2');
  svg.setAttribute('stroke-linecap','round');
  svg.setAttribute('stroke-linejoin','round');
  svg.innerHTML = ICONS[name] || '';
  el.appendChild(svg);
});

/* ── 状态机 ── */
const STATES = ['grid','new-dialog','menu-open','empty'];
function setState(s){
  document.body.dataset.state = s;
  const menu = document.querySelector('[data-testid="project-menu-1"]');
  if (menu) menu.style.display = s === 'menu-open' ? '' : 'none';
}
function setTheme(th){
  document.documentElement.dataset.theme = th;
  document.body.dataset.theme = th;
}
document.getElementById('stateSel').addEventListener('change',e=>setState(e.target.value));
document.getElementById('themeSel').addEventListener('change',e=>setTheme(e.target.value));
const init = location.hash.replace('#','');
if (STATES.includes(init)) { setState(init); document.getElementById('stateSel').value = init; }
/* hash 变化（含 file:// 下同文档导航）也切状态 */
window.addEventListener('hashchange', () => {
  const s = location.hash.replace('#','');
  if (STATES.includes(s)) { setState(s); document.getElementById('stateSel').value = s; }
});
</script>
