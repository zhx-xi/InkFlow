<!doctype html>
<html lang="zh" data-theme="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色列表 #679 排版验证</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { font-family: var(--font-ui, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif); background: var(--bg); color: var(--ink); padding: 32px; }
  .shell { max-width: 720px; margin: 0 auto; }
  .page-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
  .relation-panel { margin-top: 32px; }
  .panel-label { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; font-weight: 600; }
</style>
</head>
<body>
<div class="shell">
  <div class="page-title">设定库 · 角色</div>

  <!-- 等级选项卡（总览/分览）；全部·总览 为默认激活 -->
  <div data-testid="character-rank-tabs" class="flex flex-wrap gap-1 px-3 py-2 rounded-lg border border-line mb-3" style="background:var(--surface)">
    <button type="button" data-testid="character-rank-tab-all" aria-pressed="true"
      class="rounded-full px-3 py-1 text-[12px] transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring bg-accent text-accent-ink">全部·总览</button>
    <button type="button" data-testid="character-rank-tab-protagonist" aria-pressed="false"
      class="rounded-full px-3 py-1 text-[12px] transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring bg-surface-3 text-ink-2">主角</button>
    <button type="button" data-testid="character-rank-tab-major" aria-pressed="false"
      class="rounded-full px-3 py-1 text-[12px] transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring bg-surface-3 text-ink-2">重要配角</button>
    <button type="button" data-testid="character-rank-tab-minor" aria-pressed="false"
      class="rounded-full px-3 py-1 text-[12px] transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring bg-surface-3 text-ink-2">配角</button>
    <button type="button" data-testid="character-rank-tab-scene" aria-pressed="false"
      class="rounded-full px-3 py-1 text-[12px] transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring bg-surface-3 text-ink-2">场景角色</button>
    <button type="button" data-testid="character-rank-tab-walkon" aria-pressed="false"
      class="rounded-full px-3 py-1 text-[12px] transition-colors duration-150 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring bg-surface-3 text-ink-2">一次性角色</button>
  </div>

  <!-- 列表：group_id 分组卡片（含未分组收尾组） -->
  <div data-testid="library-list" class="divide-y divide-line overflow-hidden rounded-lg border border-line bg-surface shadow-card">

    <!-- 主角团 g1 -->
    <section data-testid="lib-group-g1">
      <div data-testid="lib-group-title-g1" class="px-4 pt-3 pb-1.5 text-[12px] font-medium text-ink-2">主角团 · 2人</div>
      <ul class="divide-y divide-line">
        <!-- 林晚 主角 -->
        <li class="group lib-item flex items-center gap-3 px-4 py-2.5 text-[13px] text-ink">
          <button type="button" data-testid="lib-name-c1" class="min-w-0 flex-1 truncate rounded text-left transition-colors duration-150 hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/60">林晚</button>
          <span data-testid="lib-rank-c1" class="shrink-0 rounded-full px-2 py-0.5 text-[11px] bg-accent text-accent-ink">主角</span>
          <span data-testid="lib-tags-c1" class="flex shrink-0 items-center gap-1"><span class="rounded-full bg-surface-3 px-2 py-0.5 text-[11px] text-ink-2">剑客</span></span>
          <div class="flex shrink-0 items-center gap-1"><button type="button" aria-label="编辑 林晚" class="rounded p-1.5 text-ink-3 transition duration-180 hover:bg-surface-3 hover:text-accent"><svg aria-hidden="true" class="h-3.5 w-3.5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button><button type="button" aria-label="删除 林晚" class="rounded p-1.5 text-ink-3 transition duration-180 hover:bg-surface-3 hover:text-err"><svg aria-hidden="true" class="h-3.5 w-3.5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>
        </li>
        <!-- 沈砚 重要配角 -->
        <li class="group lib-item flex items-center gap-3 px-4 py-2.5 text-[13px] text-ink">
          <button type="button" data-testid="lib-name-c2" class="min-w-0 flex-1 truncate rounded text-left transition-colors duration-150 hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/60">沈砚</button>
          <span data-testid="lib-rank-c2" class="shrink-0 rounded-full px-2 py-0.5 text-[11px] bg-accent/40 text-accent-ink">重要配角</span>
          <div class="flex shrink-0 items-center gap-1"><button type="button" aria-label="编辑 沈砚" class="rounded p-1.5 text-ink-3 transition duration-180 hover:bg-surface-3 hover:text-accent"><svg aria-hidden="true" class="h-3.5 w-3.5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button><button type="button" aria-label="删除 沈砚" class="rounded p-1.5 text-ink-3 transition duration-180 hover:bg-surface-3 hover:text-err"><svg aria-hidden="true" class="h-3.5 w-3.5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>
        </li>
      </ul>
    </section>

    <!-- 青云宗 g2 -->
    <section data-testid="lib-group-g2">
      <div data-testid="lib-group-title-g2" class="px-4 pt-3 pb-1.5 text-[12px] font-medium text-ink-2">青云宗 · 1人</div>
      <ul class="divide-y divide-line">
        <!-- 叶孤城 配角 -->
        <li class="group lib-item flex items-center gap-3 px-4 py-2.5 text-[13px] text-ink">
          <button type="button" data-testid="lib-name-c3" class="min-w-0 flex-1 truncate rounded text-left transition-colors duration-150 hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/60">叶孤城</button>
          <span data-testid="lib-rank-c3" class="shrink-0 rounded-full px-2 py-0.5 text-[11px] bg-surface-3 text-ink-2">配角</span>
          <div class="flex shrink-0 items-center gap-1"><button type="button" aria-label="编辑 叶孤城" class="rounded p-1.5 text-ink-3 transition duration-180 hover:bg-surface-3 hover:text-accent"><svg aria-hidden="true" class="h-3.5 w-3.5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button><button type="button" aria-label="删除 叶孤城" class="rounded p-1.5 text-ink-3 transition duration-180 hover:bg-surface-3 hover:text-err"><svg aria-hidden="true" class="h-3.5 w-3.5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>
        </li>
      </ul>
    </section>

    <!-- 未分组 -->
    <section data-testid="lib-group-ungrouped">
      <div data-testid="lib-group-ungrouped-title" class="px-4 pt-3 pb-1.5 text-[12px] font-medium text-ink-2">未分组</div>
      <ul class="divide-y divide-line">
        <!-- 路人甲 场景角色 -->
        <li class="group lib-item flex items-center gap-3 px-4 py-2.5 text-[13px] text-ink">
          <button type="button" data-testid="lib-name-c4" class="min-w-0 flex-1 truncate rounded text-left transition-colors duration-150 hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/60">路人甲</button>
          <span data-testid="lib-rank-c4" class="shrink-0 rounded-full px-2 py-0.5 text-[11px] bg-surface-2 text-ink-3">场景角色</span>
          <div class="flex shrink-0 items-center gap-1"><button type="button" aria-label="编辑 路人甲" class="rounded p-1.5 text-ink-3 transition duration-180 hover:bg-surface-3 hover:text-accent"><svg aria-hidden="true" class="h-3.5 w-3.5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button><button type="button" aria-label="删除 路人甲" class="rounded p-1.5 text-ink-3 transition duration-180 hover:bg-surface-3 hover:text-err"><svg aria-hidden="true" class="h-3.5 w-3.5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>
        </li>
        <!-- 路人乙 一次性 -->
        <li class="group lib-item flex items-center gap-3 px-4 py-2.5 text-[13px] text-ink">
          <button type="button" data-testid="lib-name-c5" class="min-w-0 flex-1 truncate rounded text-left transition-colors duration-150 hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring/60">路人乙</button>
          <span data-testid="lib-rank-c5" class="shrink-0 rounded-full px-2 py-0.5 text-[11px] bg-surface-3 text-ink-3/60">一次性角色</span>
          <div class="flex shrink-0 items-center gap-1"><button type="button" aria-label="编辑 路人乙" class="rounded p-1.5 text-ink-3 transition duration-180 hover:bg-surface-3 hover:text-accent"><svg aria-hidden="true" class="h-3.5 w-3.5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg></button><button type="button" aria-label="删除 路人乙" class="rounded p-1.5 text-ink-3 transition duration-180 hover:bg-surface-3 hover:text-err"><svg aria-hidden="true" class="h-3.5 w-3.5" fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button></div>
        </li>
      </ul>
    </section>
  </div>

  <!-- 角色详情面板：关系区双向显示（#678） -->
  <div class="relation-panel">
    <div class="panel-label">角色详情面板 · 关系区（#678 双向显示）</div>
    <div data-testid="character-detail-panel" class="rounded-lg border border-line bg-surface p-6 shadow-card" style="max-width:560px">
      <div class="flex items-start justify-between gap-3">
        <h2 class="font-serif text-[18px] font-semibold">林晚</h2>
        <button type="button" data-testid="character-detail-close" aria-label="关闭" class="rounded p-1 text-ink-3 hover:bg-surface-3 hover:text-ink">×</button>
      </div>
      <div class="mt-4">
        <div class="text-[13px] font-medium">角色关系</div>
        <div data-testid="character-rel-list" class="mt-2 divide-y divide-line overflow-hidden rounded-lg border border-line bg-surface shadow-card">
          <!-- r1：当前角色(林晚)是 from 端 → 对方 = to_name(沈砚) -->
          <div data-testid="character-rel-r1" class="group flex items-center gap-3 px-4 py-2.5 text-[13px] text-ink">
            <div class="min-w-0 flex-1"><span class="font-medium">沈砚</span><span class="mx-1.5 text-ink-3">·</span><span class="text-accent">宿敌</span><p class="mt-0.5 text-[12px] text-ink-2">宿命对决</p></div>
            <div class="flex shrink-0 items-center gap-1"><button type="button" aria-label="编辑 宿敌" class="rounded p-1 text-ink-3 hover:bg-surface-3 hover:text-accent">✎</button><button type="button" aria-label="删除 宿敌" class="rounded p-1 text-ink-3 hover:bg-surface-3 hover:text-err">🗑</button></div>
          </div>
          <!-- r2：当前角色(林晚)是 to 端 → 对方 = from_name(沈砚)，绝不显示当前角色自己(林晚) -->
          <div data-testid="character-rel-r2" class="group flex items-center gap-3 px-4 py-2.5 text-[13px] text-ink">
            <div class="min-w-0 flex-1"><span class="font-medium">沈砚</span><span class="mx-1.5 text-ink-3">·</span><span class="text-accent">师徒</span><p class="mt-0.5 text-[12px] text-ink-2">剑道传承</p></div>
            <div class="flex shrink-0 items-center gap-1"><button type="button" aria-label="编辑 师徒" class="rounded p-1 text-ink-3 hover:bg-surface-3 hover:text-accent">✎</button><button type="button" aria-label="删除 师徒" class="rounded p-1 text-ink-3 hover:bg-surface-3 hover:text-err">🗑</button></div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
