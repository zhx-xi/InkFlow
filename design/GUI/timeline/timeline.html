<!DOCTYPE html>
<html lang="zh" data-theme="paper">
<head>
<meta charset="utf-8" />
<title>InkFlow 设定库 · 时间线 — 双序轴向语义重构原型（#1374）</title>
<!--
  #1374 时间线「叙事序/世界序」轴向语义重构原型（0.15.0 原型阶段，不写实现）
  状态集（demo-bar 切换）：
    narrative        叙事序 · 章为轴（新）——修掉「两序轴完全相同」
    narrative-filter 叙事序 + 按章筛选面板展开（已选第十二章）
    world            世界序 · 方案 A 拆半（世界内时间单轴，无章分组）
    world-b          世界序 · 方案 B 全做（纪元多泳道 + 轴选择器，需 0.16.0 数据面）
    empty            空态
  A/B 拆法说明见左下角 review-note（截图时隐藏）。
-->
<style>
/* ═══════════ 设计 Token（对齐 frontend/packages/renderer/src/theme/tokens.css） ═══════════ */
:root{
  --radius-s:4px; --radius-m:6px; --radius-l:8px;
  --font-ui:"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  --font-serif:"Noto Serif SC","Source Han Serif SC","SimSun","宋体",Georgia,serif;
  --dur:180ms; --ease:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="paper"]{
  --bg:#FAF9F7; --surface:#FFFFFF; --surface-2:#F3F1EC; --surface-3:#EBE8E1;
  --ink:#2A2A28; --ink-2:#6B6A66; --ink-3:#A4A29B; --line:#E5E2DA;
  --accent:#3B5B7C; --accent-ink:#FFFFFF; --accent-hover:#325370; --accent-weak:rgba(59,91,124,.10);
  --ring:rgba(59,91,124,.38); --ok:#4A7C59; --warn:#B07A2E; --err:#B04A3A;
  --shadow:0 1px 2px rgba(42,42,40,.05),0 4px 16px rgba(42,42,40,.05);
  --shadow-hover:0 2px 4px rgba(42,42,40,.07),0 8px 24px rgba(42,42,40,.09);
}
[data-theme="night"]{
  --bg:#1A1A18; --surface:#22221F; --surface-2:#282823; --surface-3:#4A493F;
  --ink:#E8E6E1; --ink-2:#9B988F; --ink-3:#6E6B63; --line:#42413A;
  --accent:#C9A24B; --accent-ink:#1A1A18; --accent-hover:#B8923F; --accent-weak:rgba(201,162,75,.13);
  --ring:rgba(201,162,75,.45); --ok:#8FAE8E; --warn:#C9A24B; --err:#C97B63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-hover:0 2px 6px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
[data-theme="ink"]{
  --bg:#F3EEE2; --surface:#FAF6EC; --surface-2:#EFE9DA; --surface-3:#C9BFA4;
  --ink:#2B2A26; --ink-2:#6E6A5E; --ink-3:#A49F90; --line:#CBC0A4;
  --accent:#A6402E; --accent-ink:#FAF6EC; --accent-hover:#96382A; --accent-weak:rgba(166,64,46,.09);
  --ring:rgba(166,64,46,.38); --ok:#5A7A58; --warn:#9A7B3C; --err:#A6402E;
  --shadow:0 1px 2px rgba(43,42,38,.06),0 4px 16px rgba(43,42,38,.06);
  --shadow-hover:0 2px 4px rgba(43,42,38,.08),0 8px 24px rgba(43,42,38,.10);
}
/* ═══════════ 基础 ═══════════ */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;line-height:1.5;overflow:hidden}
[data-ic] svg{width:16px;height:16px;display:block;flex:none}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--ring)}

/* ═══════════ 布局骨架 ═══════════ */
.app{display:flex;height:100vh;overflow:hidden}
.app-nav{display:flex;flex-direction:column;flex:none;width:216px;border-right:1px solid var(--line);background:var(--surface-2)}
.nav-brand{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-bottom:1px solid var(--line)}
.nav-brand .logo{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.nav-brand .logo svg{width:15px;height:15px}
.nav-brand span{font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 0}
.nav-group{padding:0 8px}
.nav-group-label{display:flex;align-items:center;gap:6px;padding:12px 8px 4px;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.nav-group-label svg{width:14px;height:14px;flex:none}
.nav-item{display:flex;width:100%;align-items:center;gap:10px;border-radius:6px;padding:6px 10px;font-size:13px;color:var(--ink-2);text-decoration:none;transition:background var(--dur)}
.nav-item svg{width:16px;height:16px;flex:none}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:500}
.nav-item.active svg{color:var(--accent)}
.nav-collapse{flex:none;border-top:1px solid var(--line);padding:8px}
.nav-collapse button{display:flex;width:100%;align-items:center;gap:10px;border:none;background:none;border-radius:6px;padding:6px 10px;font-size:12px;color:var(--ink-3)}
.nav-collapse button:hover{background:var(--surface-3);color:var(--ink)}
.app-main{display:flex;flex:1;min-width:0;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;height:48px;flex:none;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar .page-title{font-size:13px;color:var(--ink-2)}
.topbar .spacer{flex:1}
.select{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-2);font-size:12px;padding:3px 8px;height:26px}
.select svg{width:12px;height:12px;color:var(--ink-3)}
.win-ctrl{display:flex;align-items:center;gap:2px;height:100%}
.win-ctrl button{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;background:none;border-radius:4px;color:var(--ink-3)}
.win-ctrl button:hover{background:var(--surface-3);color:var(--ink)}
.win-ctrl button.close:hover{background:var(--err);color:#fff}

/* ═══════════ 设定库页骨架 ═══════════ */
.page-lib{margin:0 auto;max-width:1080px;width:100%;padding:40px 48px;flex:1;min-height:0;overflow-y:auto}
.page-lib h1{margin:0;font-family:var(--font-serif);font-size:26px;font-weight:600}
.lib-ctx{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:20px}
.lib-project{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-2);font-size:13px;padding:6px 12px;height:36px;width:224px;justify-content:space-between;box-shadow:var(--shadow)}
.lib-project svg{width:14px;height:14px;color:var(--ink-3)}
.lib-breadcrumb{font-size:13px;color:var(--ink-2)}
.lib-breadcrumb .sep{margin:0 4px;color:var(--ink-3)}
.lib-breadcrumb .cur{color:var(--ink)}
.lib-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:24px;border-bottom:1px solid var(--line)}
.lib-tab{border:none;background:none;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;padding:8px 14px;font-size:13px;color:var(--ink-2);transition:color var(--dur),border-color var(--dur)}
.lib-tab:hover{color:var(--ink)}
.lib-tab.active{border-bottom-color:var(--accent);color:var(--accent);font-weight:500}
.btn-primary{border:none;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:13px;padding:6px 16px;transition:background var(--dur)}
.btn-primary:hover{background:var(--accent-hover)}

/* ═══════════ 时间线（#1374 双序轴向语义重构原型） ═══════════ */
.tl-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tl-seg{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);box-shadow:var(--shadow)}
.tl-seg button{border:none;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink-2);background:none;transition:background var(--dur),color var(--dur)}
.tl-seg button.active{background:var(--accent);color:var(--accent-ink)}
.tl-seg button:hover:not(.active){color:var(--ink)}
.check-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:none;font-size:12px;color:var(--ink-2);padding:4px 12px;transition:border-color var(--dur),color var(--dur)}
.check-btn:hover{border-color:var(--accent);color:var(--accent)}
.check-btn svg{width:13px;height:13px}

/* 筛选（#1374 新增：按章 / 按类型；世界/角色维度留 0.16.0） */
.tl-filter{position:relative}
.tl-filter-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:none;font-size:12px;color:var(--ink-2);padding:4px 12px;transition:border-color var(--dur),color var(--dur),background var(--dur)}
.tl-filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.tl-filter-btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.tl-filter-btn svg{width:11px;height:11px}
.tl-filter-panel{position:absolute;left:0;top:calc(100% + 6px);z-index:60;min-width:250px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow-hover);padding:6px;display:none}
body[data-state="narrative-filter"] .tl-filter-panel{display:block}
.tl-fp-title{padding:4px 8px 6px;font-size:11px;color:var(--ink-3)}
.tl-fp-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--ink);cursor:pointer}
.tl-fp-item:hover{background:var(--surface-2)}
.tl-fp-item .cb{flex:none;display:flex;align-items:center;justify-content:center;width:14px;height:14px;border:1.5px solid var(--ink-3);border-radius:4px;color:var(--accent-ink)}
.tl-fp-item.sel .cb{background:var(--accent);border-color:var(--accent)}
.tl-fp-item .cb svg{width:10px;height:10px;display:none}
.tl-fp-item.sel .cb svg{display:block}

/* 纪元轴选择器（方案 B） */
.tl-axis-picker{display:none;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
body[data-state="world-b"] .tl-axis-picker{display:inline-flex}
.axis-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--ink-3);background:var(--surface)}
.axis-chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.axis-chip .ck{display:flex;align-items:center;justify-content:center;width:12px;height:12px;color:var(--accent)}
.axis-chip .ck svg{width:9px;height:9px;display:none}
.axis-chip.on .ck svg{display:block}

.tl-legend{width:100%;margin:4px 0 14px;font-size:12px;color:var(--ink-3)}

/* 轴容器（叙事序 = 章轴；世界序 = 时间轴）——统一 padding-left，轴线居中于 7px */
.tl-axis{position:relative;padding-left:26px}
.tl-axis--chapter::before{content:"";position:absolute;left:6px;top:14px;bottom:14px;width:2px;border-radius:1px;background:var(--line)}
.tl-axis--time::before{content:"";position:absolute;left:6px;top:12px;bottom:12px;width:2px;border-radius:1px;background:var(--line)}

/* 章刻度（叙事序：轴的刻度 = 章） */
.tl-chgroup{position:relative}
.tl-chgroup + .tl-chgroup{margin-top:16px}
.tl-chtick{position:relative;display:flex;align-items:center;gap:8px;padding:2px 0}
.tl-chtick .tickdot{position:absolute;left:-24px;top:50%;width:10px;height:10px;border-radius:2px;background:var(--accent);transform:translateY(-50%) rotate(45deg)}
.tl-chtick--none .tickdot{background:var(--surface);border:1.5px solid var(--ink-3)}
.tl-chlabel{font-size:13px;font-weight:500;color:var(--ink)}
.tl-chtick--none .tl-chlabel{color:var(--ink-2)}
.tl-chcount{font-size:11px;color:var(--ink-3)}
.tl-chbody{margin-top:8px}

/* 事件节点（两序共用） */
.tl-node{position:relative;display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px}
.tl-node + .tl-node{margin-top:6px}
.tl-node::before{content:"";position:absolute;left:-23px;top:50%;width:8px;height:8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--accent);transform:translateY(-50%)}
.tl-axis--time .tl-node::before{background:var(--accent)}
.tl-main{flex:none;width:84px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.tl-main--dim{width:66px;font-weight:400;color:var(--ink-3)}
.tl-node .tname{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.tl-node--demo .tname{color:var(--ink-2)}
.tl-src{flex:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--ink-3);white-space:nowrap}
.tl-demo{flex:none;border:1px dashed var(--warn);border-radius:4px;padding:0 4px;font-size:10px;color:var(--warn);white-space:nowrap}
.check-one{flex:none;border:1px solid var(--line);border-radius:6px;background:none;font-size:11px;color:var(--ink-2);padding:4px 10px;transition:border-color var(--dur),color var(--dur)}
.check-one:hover{border-color:var(--accent);color:var(--accent)}
.tl-actions{display:flex;flex:none;align-items:center;gap:1px;opacity:0;transition:opacity var(--dur)}
.tl-node:hover .tl-actions{opacity:1}
.tl-actions button{display:flex;align-items:center;justify-content:center;border:none;background:none;border-radius:4px;padding:3px;color:var(--ink-3)}
.tl-actions button svg{width:13px;height:13px}
.tl-actions button:hover{background:var(--surface-3);color:var(--accent)}

/* 纪元泳道（方案 B） */
.tl-lanes{display:flex;flex-direction:column;gap:12px}
.tl-lane{border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);padding:10px 16px 12px}
.tl-lane-head{display:flex;align-items:center;gap:8px;padding:0 0 8px;margin-bottom:6px;border-bottom:1px dashed var(--line)}
.lane-dot{flex:none;width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.tl-lane-name{font-size:12.5px;font-weight:500;color:var(--ink)}
.tl-lane-meta{font-size:11px;color:var(--ink-3)}

/* 空态 */
.lib-empty{display:none;flex-direction:column;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:8px;background:var(--surface);padding:56px 24px;text-align:center}
body[data-state="empty"] .tl-toolbar,body[data-state="empty"] [data-testid="tl-axis"]{display:none}
body[data-state="empty"] .lib-empty{display:flex}
.lib-empty p{margin:0;font-size:13px;color:var(--ink-2)}
.lib-empty button{margin-top:16px}

/* 状态栏 */
.statusbar{display:flex;align-items:center;gap:20px;flex:none;padding:6px 16px;border-top:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--ink-3)}

/* ═══════════ 演示切换条 + 评审说明卡（截图前隐藏） ═══════════ */
.demo-bar{position:fixed;right:14px;bottom:14px;z-index:200;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-hover);padding:8px 12px;font-size:12px;color:var(--ink-2)}
.demo-bar select{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font-size:12px;padding:3px 6px}
.demo-bar .sep{width:1px;height:18px;background:var(--line)}
.review-note{position:fixed;left:14px;bottom:14px;z-index:200;max-width:460px;border:1px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--shadow-hover);padding:10px 14px;font-size:12px;line-height:1.7;color:var(--ink-2)}
.review-note b{color:var(--ink)}
.review-note code{font-family:ui-monospace,Consolas,monospace;font-size:11px;background:var(--surface-2);border-radius:4px;padding:0 4px}
body[data-shot="1"] .demo-bar,body[data-shot="1"] .review-note{display:none}
/* #1400：截图态同时**冻结动效** —— 动画/过渡会让同一次重出落在不同相位（PNG 字节不稳定 → 重出判据失真） */
body[data-shot="1"],body[data-shot="1"] *,body[data-shot="1"] *::before,body[data-shot="1"] *::after{animation:none!important;transition:none!important}
</style>
</head>
<body data-state="narrative">

<div class="app">
  <!-- ═══ 侧边导航 AppNav（设定库分组，时间线激活） ═══ -->
  <nav class="app-nav" data-testid="app-nav">
    <div class="nav-brand">
      <span class="logo"><span data-ic="penline"></span></span>
      <span>InkFlow</span>
    </div>
    <div class="nav-scroll">
      <div class="nav-group">
        <div class="nav-group-label"><span data-ic="folderopen"></span>写作区</div>
        <a class="nav-item"><span data-ic="penline"></span>写作</a>
        <a class="nav-item"><span data-ic="bookopen"></span>项目</a>
      </div>
      <div class="nav-group">
        <div class="nav-group-label"><span data-ic="library"></span>设定库</div>
        <a class="nav-item"><span data-ic="library"></span>设定库</a>
        <a class="nav-item"><span data-ic="users"></span>角色</a>

  <div class="app-main">

      </div>
    </header>

    <!-- ═══ 时间线分类页（/library?cat=timeline） ═══ -->
    <div class="page-lib" data-testid="library-page">
      <h1>设定库</h1>
      <div class="lib-ctx">
        <span class="lib-project" data-testid="library-project-select">
          <span>青云志</span><span data-ic="chevron-down"></span>
        </span>
        <span class="lib-breadcrumb" data-testid="library-breadcrumb">

      </div>

        <button class="lib-tab" role="tab" aria-selected="false">角色</button>
        <button class="lib-tab" role="tab" aria-selected="false">世界观</button>
        <button class="lib-tab" role="tab" aria-selected="false">大纲</button>
        <button class="lib-tab active" role="tab" aria-selected="true">时间线</button>
        <button class="lib-tab" role="tab" aria-selected="false">伏笔</button>
        <button class="lib-tab" role="tab" aria-selected="false">知识图谱</button>
      </div>

      <div style="margin-top:20px">
        <!-- 工具栏：双序 chips + 筛选 + 轴选择器(B) + 整体检查 -->
        <div class="tl-toolbar" data-testid="timeline-toolbar">
          <div class="tl-seg">
            <button id="segNarrative" class="active" data-testid="tl-view-narrative">叙事序</button>
            <button id="segWorld" data-testid="tl-view-world">世界序</button>
          </div>

/* ── 内联 SVG 图标库 ── */
const ICONS = {

  brain:'<path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/><path d="M12 5v14"/>',
  bot:'<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
  settings:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  folderopen:'<path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>',
  chevronsleft:'<path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/>',
  'chevron-down':'<path d="m6 9 6 6 6-6"/>',
  'chevron-right':'<path d="m9 18 6-6-6-6"/>',

  trash:'<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  palette:'<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
  scansearch:'<path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/><path d="m16 16-1.9-1.9"/>',
};
document.querySelectorAll('[data-ic]').forEach(el=>{
  const name = el.getAttribute('data-ic');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 24 24');
  svg.setAttribute('fill','none');
  svg.setAttribute('stroke','currentColor');
  svg.setAttribute('stroke-width','2');
  svg.setAttribute('stroke-linecap','round');
  svg.setAttribute('stroke-linejoin','round');
  svg.innerHTML = ICONS[name] || '';
  el.appendChild(svg);
});
const CK_SVG = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 4.8 9 10 3.2"/></svg>';

/* ── 演示数据（沿用本页原型既有数据集；演示数据 = 假想结构，非真实项目素材） ── */
const DEMO = {
  chapters: [
    { key:'c11', title:'第十一章 剑心为何物' },
    { key:'c12', title:'第十二章 夜访剑冢' },
    { key:'c13', title:'第十三章 剑心蒙尘' },
  ],
  noneKey: '__none__',
  noneTitle: '未分章',
  /* axis = 纪元轴（仅方案 B 演示用；真实数据面暂无该字段，见说明卡） */
  /* 时间文案 = 纪年式（用户 2026-09-22 拍板：不用相对时间「xx 年前」；纪年式如「青元历 317 年」/「始皇三年」） */
  events: [
    { id:'1', ch:'c11', time:17,  timeText:'青元历 17 年',  title:'师父闭关前夜，问苏云舟「剑心为何物」', axis:'qingyuan' },
    { id:'2', ch:'c12', time:217, timeText:'青元历 217 年', title:'苏云舟下山，林晚照追随', axis:'qingyuan' },
    { id:'3', ch:'c12', time:297, timeText:'青元历 297 年', title:'夜访剑冢，发现二十年前异动痕迹', axis:'qingyuan' },
    { id:'4', ch:'c13', time:314, timeText:'青元历 314 年', title:'剑心蒙尘，断剑于山门', axis:'qingyuan' },
    { id:'5', ch:null,  time:null, timeText:'未知',          title:'守陵人失踪（手工录入，未归章）', axis:'qingyuan' },
    { id:'6', ch:null,  time:1024, timeText:'仙历 1024 年', title:'仙界法旨降下（演示：另一纪元轴事件）', axis:'xianjie', demo:true },
  ],
  axes: [
    { key:'qingyuan', name:'青云界 · 青元历', on:true },
    { key:'xianjie',  name:'仙界 · 仙历',    on:true },
    { key:'mingjie',  name:'幽冥界 · 冥历',  on:false },
  ],
};
const chTitle = (key) => {
  if (key === null || key === undefined) return DEMO.noneTitle;
  const c = DEMO.chapters.find((x) => x.key === key);
  return c ? c.title : '未知章节';
};
const ALL_EVENTS = DEMO.events.map((ev) => Object.assign({}, ev, { chTitle: chTitle(ev.ch) }));
/* 非演示事件（叙事序 / 世界序 A 视作现有数据面；「另一纪元」演示事件仅方案 B 泳道展示） */
const NON_DEMO = ALL_EVENTS.filter((ev) => !ev.demo);

const STATES = ['narrative','narrative-filter','world','world-b','empty'];
const LEGENDS = {
  'narrative':        '轴=章 · 事件按章推进排列；行内小字=世界内时间',
  'narrative-filter': '轴=章 · 已筛选：第十二章（筛选对两序共用）',
  'world':            '轴=世界内时间（升序，未知末尾）· 不再按章分组；行尾=来源章',
  'world-b':          '轴=纪元 · 每轴独立时间刻度 · 勾选控制显示哪几条轴',
  'empty':            '',
};
const NOTES = {
  'narrative':
    '<b>叙事序（新）</b>：轴的刻度 = <b>章</b>（章节标题原样，#999 归一化保证「第 N 章」序号）；排序 = 章序 → 章内叙事序；世界内时间降为行内小字。未归章事件落「未分章」章刻度。',
  'narrative-filter':
    '<b>按章筛选（新）</b>：数据面 ✅（source_chapter_id + 章节列表）。已选「第十二章」→ 列表仅显示该章事件。按事件类型（正叙/倒叙/插叙）同样可做；<b>按世界 / 按角色关联 = 0.16.0</b>（无字段，见 B 版缺口说明）。',
  'world':
    '<b>世界序 · 方案 A（拆半，推荐）</b>：轴 = <b>世界内时间</b>，全局升序、未知末尾，<b>不再按章分组</b>；行尾小字 = 来源章。<b>纪元分轴（多纪元）留 0.16.0</b>（#1353，需 era 数据面）——避免与多纪元体系二次重构。',
  'world-b':
    '<b>世界序 · 方案 B（全做）</b>：轴 = <b>纪元（多泳道）</b> + 轴选择器（勾选显示哪几条轴）。⚠ <b>数据面缺口</b>：事件无 era/world 字段、time_value 为单标量（f12:84 曾否决复合键）→ 0.15.0 落地须先把 #1353 的 <code>extra.era</code> 最小落点提前，并先改 f12:84 否决记录（spec 级决策前置）。',
  'empty':
    '<b>空态</b>：无变化（「还没有时间线，去创建」+ CTA）。',
};

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 事件行模板：timeMode = 'dim'(叙事序行内小字) | 'tick'(时间轴刻度) */
function nodeHTML(ev, opts){
  const o = opts || {};
  const timeCls = o.timeMode === 'tick' ? 'tl-main' : 'tl-main tl-main--dim';
  const src = o.showSrc ? `<span class="tl-src" data-testid="tl-src-${ev.id}">${esc(ev.chTitle)}</span>` : '';
  const demo = ev.demo ? '<span class="tl-demo">演示</span>' : '';
  return `<div class="tl-node${ev.demo ? ' tl-node--demo' : ''}" data-testid="tl-axis-node-${ev.id}">
    <span class="${timeCls}" data-testid="tl-axis-main-${ev.id}">${esc(ev.timeText)}</span>
    <span class="tname">${esc(ev.title)}</span>${demo}${src}
    <button class="check-one" data-testid="tl-check-one-${ev.id}">单事件检查</button>
    <span class="tl-actions">
      <button data-testid="tl-edit-${ev.id}" aria-label="编辑 ${esc(ev.title)}"><span data-ic2="pencil"></span></button>
      <button data-testid="tl-delete-${ev.id}" aria-label="删除 ${esc(ev.title)}"><span data-ic2="trash"></span></button>
    </span>
  </div>`;
}

/* 叙事序 = 章轴：章刻度（tick）+ 章下事件；组顺序 = 章序，末尾「未分章」 */
function renderNarrative(evs){
  const groups = DEMO.chapters.map((c) => ({ key:c.key, title:c.title, evs:[] }));
  groups.push({ key:DEMO.noneKey, title:DEMO.noneTitle, evs:[] });
  for (const ev of evs) {
    const key = ev.ch === null || ev.ch === undefined ? DEMO.noneKey : ev.ch;
    const g = groups.find((x) => x.key === key);
    if (g) g.evs.push(ev);
  }
  const body = groups.filter((g) => g.evs.length > 0).map((g) => `
    <div class="tl-chgroup" data-testid="tl-chgroup-${g.key}">
      <div class="tl-chtick${g.key === DEMO.noneKey ? ' tl-chtick--none' : ''}" data-testid="tl-chtick-${g.key}">
        <span class="tickdot"></span>
        <span class="tl-chlabel">${esc(g.title)}</span>
        <span class="tl-chcount">${g.evs.length} 个事件</span>
      </div>
      <div class="tl-chbody">${g.evs.map((ev) => nodeHTML(ev, { timeMode:'dim' })).join('')}</div>
    </div>`).join('');
  return `<div class="tl-axis tl-axis--chapter" data-testid="tl-axis">${body}</div>`;
}

/* 世界序 A = 世界内时间单轴：全局升序（未知末尾），不分组，行尾来源章 */
function renderWorldA(){
  const evs = NON_DEMO.slice().sort((a, b) => {
    if (a.time === null && b.time === null) return 0;
    if (a.time === null) return 1;
    if (b.time === null) return -1;
    return a.time - b.time;
  });
  return `<div class="tl-axis tl-axis--time" data-testid="tl-axis">${evs
    .map((ev) => nodeHTML(ev, { timeMode:'tick', showSrc:true })).join('')}</div>`;
}

/* 世界序 B = 纪元泳道（每轴独立时间刻度） */
function renderWorldB(){
  const lanes = DEMO.axes.filter((a) => a.on).map((a) => {
    const evs = ALL_EVENTS.filter((ev) => ev.axis === a.key).sort((x, y) => {
      if (x.time === null && y.time === null) return 0;
      if (x.time === null) return 1;
      if (y.time === null) return -1;
      return x.time - y.time;
    });
    return `<section class="tl-lane" data-testid="tl-lane-${a.key}">
      <header class="tl-lane-head">
        <span class="lane-dot"></span>
        <span class="tl-lane-name">${esc(a.name)}</span>
        <span class="tl-lane-meta">${evs.length} 个事件</span>
      </header>
      <div class="tl-axis tl-axis--time">${evs.map((ev) => nodeHTML(ev, { timeMode:'tick', showSrc:true })).join('')}</div>
    </section>`;
  }).join('');
  return `<div class="tl-lanes">${lanes}</div>`;
}

/* 筛选面板（按章）：narrative-filter 态演示「已选第十二章」 */
function renderFilterPanel(state){
  const items = [{ key:'all', title:'全部章节' }]
    .concat(DEMO.chapters.map((c) => ({ key:c.key, title:c.title })))
    .concat([{ key:DEMO.noneKey, title:DEMO.noneTitle }]);
  const isFiltered = state === 'narrative-filter';
  document.getElementById('fpChapterItems').innerHTML = items.map((it) => {
    const sel = isFiltered ? it.key === 'c12' : it.key === 'all';
    return `<div class="tl-fp-item${sel ? ' sel' : ''}" data-testid="tl-fp-item-${it.key}"><span class="cb">${CK_SVG}</span>${esc(it.title)}</div>`;
  }).join('');
  const btn = document.getElementById('filterChapterBtn');
  btn.classList.toggle('on', isFiltered);
  document.getElementById('filterChapterLabel').textContent = isFiltered ? '章：第十二章' : '章：全部';
}

function renderBody(state){
  if (state === 'narrative' || state === 'narrative-filter') {
    const evs = state === 'narrative-filter'
      ? NON_DEMO.filter((ev) => (ev.ch === null ? DEMO.noneKey : ev.ch) === 'c12')
      : NON_DEMO;
    return renderNarrative(evs);
  }
  if (state === 'world') return renderWorldA();
  if (state === 'world-b') return renderWorldB();
  return '';
}

/* 渲染出的行内 pencil/trash 图标（data-ic2 在动态节点上二次挂载） */
function mountDynIcons(){
  document.querySelectorAll('#tlBody [data-ic2]').forEach((el) => {
    const name = el.getAttribute('data-ic2');
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('fill','none');
    svg.setAttribute('stroke','currentColor');
    svg.setAttribute('stroke-width','2');
    svg.setAttribute('stroke-linecap','round');
    svg.setAttribute('stroke-linejoin','round');
    svg.innerHTML = ICONS[name] || '';
    el.appendChild(svg);
  });
}

function setState(s){
  if (!STATES.includes(s)) s = 'narrative';
  document.body.dataset.state = s;
  const sel = document.getElementById('stateSel');
  if (sel) sel.value = s;
  const isWorld = s === 'world' || s === 'world-b';
  document.getElementById('segNarrative').classList.toggle('active', !isWorld);
  document.getElementById('segWorld').classList.toggle('active', isWorld);
  document.getElementById('tlLegend').textContent = LEGENDS[s] || '';
  document.getElementById('tlBody').innerHTML = renderBody(s);
  mountDynIcons();
  renderFilterPanel(s);
  document.getElementById('reviewNote').innerHTML = NOTES[s] || '';
}
function setTheme(th){
  document.documentElement.dataset.theme = th;
  document.body.dataset.theme = th;
}
document.getElementById('stateSel').addEventListener('change', (e) => setState(e.target.value));
document.getElementById('themeSel').addEventListener('change', (e) => setTheme(e.target.value));
const init = location.hash.replace('#','');
setState(STATES.includes(init) ? init : 'narrative');
window.addEventListener('hashchange', () => {
  const s = location.hash.replace('#','');
  if (STATES.includes(s)) setState(s);
});
</script>
