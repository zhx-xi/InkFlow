<!DOCTYPE html>
<html lang="zh" data-theme="paper">
<head>
<meta charset="utf-8" />
<title>InkFlow 设定库 · 时间线 — 双序轴向语义 + 世界序纪元轴族原型（#1374 / #1353）</title>
<!--
  #1374 时间线「叙事序/世界序」轴向语义重构原型（世界序纪元轴族为 #1353 / 0.16.0 落地形态）
  状态集（demo-bar 切换）：
    narrative        叙事序 · 章为轴——修掉「两序轴完全相同」
    narrative-filter 叙事序 + 按章筛选面板展开（已选第十二章）
    world            世界序 · 单轴形态（项目无纪元数据时；世界内时间单轴，无章分组）
    world-eras       世界序 · 纪元轴族（#1353，默认只勾选主力轴）
    world-eras-multi 世界序 · 纪元轴族（多轴同时显示，含默认轴「未分纪元」）
    empty            空态
  说明见左下角 review-note（截图时隐藏）。
-->
<style>
/* ═══════════ 设计 Token（对齐 frontend/packages/renderer/src/theme/tokens.css） ═══════════ */
@font-face{font-family:'InkFlow Serif';font-style:normal;font-weight:400;font-display:block;src:url(../_assets/fonts/inkflow-serif-400.woff2) format('woff2')}
@font-face{font-family:'InkFlow Serif';font-style:normal;font-weight:600;font-display:block;src:url(../_assets/fonts/inkflow-serif-600.woff2) format('woff2')}
@font-face{font-family:'InkFlow Sans';font-style:normal;font-weight:400;font-display:block;src:url(../_assets/fonts/inkflow-sans-400.woff2) format('woff2')}
@font-face{font-family:'InkFlow Sans';font-style:normal;font-weight:600;font-display:block;src:url(../_assets/fonts/inkflow-sans-600.woff2) format('woff2')}
:root{
  --radius-s:4px; --radius-m:6px; --radius-l:8px;
  --font-ui:"PingFang SC","Microsoft YaHei","InkFlow Sans","Noto Sans SC","Segoe UI",sans-serif;
  --font-serif:"InkFlow Serif","Noto Serif SC","Source Han Serif SC","SimSun","宋体",Georgia,serif;
  --dur:180ms; --ease:cubic-bezier(0.16,1,0.3,1);
}
[data-theme="paper"]{
  --bg:#FAF9F7; --surface:#FFFFFF; --surface-2:#F3F1EC; --surface-3:#EBE8E1;
  --ink:#2A2A28; --ink-2:#6B6A66; --ink-3:#A4A29B; --line:#E5E2DA;
  --accent:#3B5B7C; --accent-ink:#FFFFFF; --accent-hover:#325370; --accent-weak:rgba(59,91,124,.10);
  --ring:rgba(59,91,124,.38); --ok:#4A7C59; --warn:#B07A2E; --err:#B04A3A;
  --shadow:0 1px 2px rgba(42,42,40,.05),0 4px 16px rgba(42,42,40,.05);
  --shadow-hover:0 2px 4px rgba(42,42,40,.07),0 8px 24px rgba(42,42,40,.09);
}
[data-theme="night"]{
  --bg:#1A1A18; --surface:#22221F; --surface-2:#282823; --surface-3:#4A493F;
  --ink:#E8E6E1; --ink-2:#9B988F; --ink-3:#6E6B63; --line:#42413A;
  --accent:#C9A24B; --accent-ink:#1A1A18; --accent-hover:#B8923F; --accent-weak:rgba(201,162,75,.13);
  --ring:rgba(201,162,75,.45); --ok:#8FAE8E; --warn:#C9A24B; --err:#C97B63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  --shadow-hover:0 2px 6px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
}
[data-theme="ink"]{
  --bg:#F3EEE2; --surface:#FAF6EC; --surface-2:#EFE9DA; --surface-3:#C9BFA4;
  --ink:#2B2A26; --ink-2:#6E6A5E; --ink-3:#A49F90; --line:#CBC0A4;
  --accent:#A6402E; --accent-ink:#FAF6EC; --accent-hover:#96382A; --accent-weak:rgba(166,64,46,.09);
  --ring:rgba(166,64,46,.38); --ok:#5A7A58; --warn:#9A7B3C; --err:#A6402E;
  --shadow:0 1px 2px rgba(43,42,38,.06),0 4px 16px rgba(43,42,38,.06);
  --shadow-hover:0 2px 4px rgba(43,42,38,.08),0 8px 24px rgba(43,42,38,.10);
}
/* ═══════════ 基础 ═══════════ */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:13px;line-height:1.5;overflow:hidden}
[data-ic] svg{width:16px;height:16px;display:block;flex:none}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--ring)}

/* ═══════════ 布局骨架 ═══════════ */
.app{display:flex;height:100vh;overflow:hidden}
.app-nav{display:flex;flex-direction:column;flex:none;width:216px;border-right:1px solid var(--line);background:var(--surface-2)}
.nav-brand{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-bottom:1px solid var(--line)}
.nav-brand .logo{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--accent);color:var(--accent-ink)}
.nav-brand .logo svg{width:15px;height:15px}
.nav-brand span{font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 0}
.nav-group{padding:0 8px}
.nav-group-label{display:flex;align-items:center;gap:6px;padding:12px 8px 4px;font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.nav-group-label svg{width:14px;height:14px;flex:none}
.nav-item{display:flex;width:100%;align-items:center;gap:10px;border-radius:6px;padding:6px 10px;font-size:13px;color:var(--ink-2);text-decoration:none;transition:background var(--dur)}
.nav-item svg{width:16px;height:16px;flex:none}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:500}
.nav-item.active svg{color:var(--accent)}
.nav-collapse{flex:none;border-top:1px solid var(--line);padding:8px}
.nav-collapse button{display:flex;width:100%;align-items:center;gap:10px;border:none;background:none;border-radius:6px;padding:6px 10px;font-size:12px;color:var(--ink-3)}
.nav-collapse button:hover{background:var(--surface-3);color:var(--ink)}
.app-main{display:flex;flex:1;min-width:0;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;height:48px;flex:none;padding:0 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar .page-title{font-size:13px;color:var(--ink-2)}
.topbar .spacer{flex:1}
.select{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-2);font-size:12px;padding:3px 8px;height:26px}
.select svg{width:12px;height:12px;color:var(--ink-3)}
.win-ctrl{display:flex;align-items:center;gap:2px;height:100%}
.win-ctrl button{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border:none;background:none;border-radius:4px;color:var(--ink-3)}
.win-ctrl button:hover{background:var(--surface-3);color:var(--ink)}
.win-ctrl button.close:hover{background:var(--err);color:#fff}

/* ═══════════ 设定库页骨架 ═══════════ */
.page-lib{margin:0 auto;max-width:1080px;width:100%;padding:40px 48px;flex:1;min-height:0;overflow-y:auto}
.page-lib h1{margin:0;font-family:var(--font-serif);font-size:26px;font-weight:600}
.lib-ctx{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:20px}
.lib-project{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink-2);font-size:13px;padding:6px 12px;height:36px;width:224px;justify-content:space-between;box-shadow:var(--shadow)}
.lib-project svg{width:14px;height:14px;color:var(--ink-3)}
.lib-breadcrumb{font-size:13px;color:var(--ink-2)}
.lib-breadcrumb .sep{margin:0 4px;color:var(--ink-3)}
.lib-breadcrumb .cur{color:var(--ink)}
.lib-tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:24px;border-bottom:1px solid var(--line)}
.lib-tab{border:none;background:none;border-bottom:2px solid transparent;border-radius:6px 6px 0 0;padding:8px 14px;font-size:13px;color:var(--ink-2);transition:color var(--dur),border-color var(--dur)}
.lib-tab:hover{color:var(--ink)}
.lib-tab.active{border-bottom-color:var(--accent);color:var(--accent);font-weight:500}
.btn-primary{border:none;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:13px;padding:6px 16px;transition:background var(--dur)}
.btn-primary:hover{background:var(--accent-hover)}

/* ═══════════ 时间线（#1374 双序轴向语义重构原型） ═══════════ */
.tl-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tl-seg{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);box-shadow:var(--shadow)}
.tl-seg button{border:none;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink-2);background:none;transition:background var(--dur),color var(--dur)}
.tl-seg button.active{background:var(--accent);color:var(--accent-ink)}
.tl-seg button:hover:not(.active){color:var(--ink)}
.check-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:none;font-size:12px;color:var(--ink-2);padding:4px 12px;transition:border-color var(--dur),color var(--dur)}
.check-btn:hover{border-color:var(--accent);color:var(--accent)}
.check-btn svg{width:13px;height:13px}

/* 筛选（#1374 新增：按章 / 按类型；世界/角色维度留 0.16.0） */
.tl-filter{position:relative}
.tl-filter-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;background:none;font-size:12px;color:var(--ink-2);padding:4px 12px;transition:border-color var(--dur),color var(--dur),background var(--dur)}
.tl-filter-btn:hover{border-color:var(--accent);color:var(--accent)}
.tl-filter-btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.tl-filter-btn svg{width:11px;height:11px}
.tl-filter-panel{position:absolute;left:0;top:calc(100% + 6px);z-index:60;min-width:250px;border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow-hover);padding:6px;display:none}
body[data-state="narrative-filter"] .tl-filter-panel{display:block}
.tl-fp-title{padding:4px 8px 6px;font-size:11px;color:var(--ink-3)}
.tl-fp-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12px;color:var(--ink);cursor:pointer}
.tl-fp-item:hover{background:var(--surface-2)}
.tl-fp-item .cb{flex:none;display:flex;align-items:center;justify-content:center;width:14px;height:14px;border:1.5px solid var(--ink-3);border-radius:4px;color:var(--accent-ink)}
.tl-fp-item.sel .cb{background:var(--accent);border-color:var(--accent)}
.tl-fp-item .cb svg{width:10px;height:10px;display:none}
.tl-fp-item.sel .cb svg{display:block}

/* 纪元轴选择器（#1353：仅世界序 + 轴族 ≥ 2 条时可见） */
.tl-axis-picker{display:none;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
body[data-state="world-eras"] .tl-axis-picker,body[data-state="world-eras-multi"] .tl-axis-picker,body[data-state="world-eras-b"] .tl-axis-picker{display:inline-flex}
#axisChips{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}
.axis-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--ink-3);background:var(--surface)}
.axis-chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
.axis-chip .ck{display:flex;align-items:center;justify-content:center;width:12px;height:12px;color:var(--accent)}
.axis-chip .ck svg{width:9px;height:9px;display:none}
.axis-chip.on .ck svg{display:block}

.tl-legend{width:100%;margin:4px 0 14px;font-size:12px;color:var(--ink-3)}

/* 轴容器（叙事序 = 章轴；世界序 = 时间轴）——统一 padding-left，轴线居中于 7px */
.tl-axis{position:relative;padding-left:26px}
.tl-axis--chapter::before{content:"";position:absolute;left:6px;top:14px;bottom:14px;width:2px;border-radius:1px;background:var(--line)}
.tl-axis--time::before{content:"";position:absolute;left:6px;top:12px;bottom:12px;width:2px;border-radius:1px;background:var(--line)}

/* 章刻度（叙事序：轴的刻度 = 章） */
.tl-chgroup{position:relative}
.tl-chgroup + .tl-chgroup{margin-top:16px}
.tl-chtick{position:relative;display:flex;align-items:center;gap:8px;padding:2px 0}
.tl-chtick .tickdot{position:absolute;left:-24px;top:50%;width:10px;height:10px;border-radius:2px;background:var(--accent);transform:translateY(-50%) rotate(45deg)}
.tl-chtick--none .tickdot{background:var(--surface);border:1.5px solid var(--ink-3)}
.tl-chlabel{font-size:13px;font-weight:500;color:var(--ink)}
.tl-chtick--none .tl-chlabel{color:var(--ink-2)}
.tl-chcount{font-size:11px;color:var(--ink-3)}
.tl-chbody{margin-top:8px}

/* 事件节点（两序共用） */
.tl-node{position:relative;display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px}
.tl-node + .tl-node{margin-top:6px}
.tl-node::before{content:"";position:absolute;left:-23px;top:50%;width:8px;height:8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--accent);transform:translateY(-50%)}
.tl-axis--time .tl-node::before{background:var(--accent)}
.tl-main{flex:none;min-width:84px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink)}
.tl-main--dim{min-width:66px;font-weight:400;color:var(--ink-3)}
.tl-node .tname{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.tl-node--demo .tname{color:var(--ink-2)}
.tl-src{flex:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--ink-3);white-space:nowrap}
.tl-demo{flex:none;border:1px dashed var(--warn);border-radius:4px;padding:0 4px;font-size:10px;color:var(--warn);white-space:nowrap}
.check-one{flex:none;border:1px solid var(--line);border-radius:6px;background:none;font-size:11px;color:var(--ink-2);padding:4px 10px;transition:border-color var(--dur),color var(--dur)}
.check-one:hover{border-color:var(--accent);color:var(--accent)}
.tl-actions{display:flex;flex:none;align-items:center;gap:1px;opacity:0;transition:opacity var(--dur)}
.tl-node:hover .tl-actions{opacity:1}
.tl-actions button{display:flex;align-items:center;justify-content:center;border:none;background:none;border-radius:4px;padding:3px;color:var(--ink-3)}
.tl-actions button svg{width:13px;height:13px}
.tl-actions button:hover{background:var(--surface-3);color:var(--accent)}

/* 纪元泳道（#1353：每轴独立时间刻度，轴内按纪元值升序） */
.tl-lanes{display:flex;flex-direction:column;gap:12px}
.tl-lane{border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow);padding:10px 16px 12px}
.tl-lane-head{display:flex;align-items:center;gap:8px;padding:0 0 8px;margin-bottom:6px;border-bottom:1px dashed var(--line)}
.lane-dot{flex:none;width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.tl-lane-name{font-size:12.5px;font-weight:500;color:var(--ink)}
.tl-lane-meta{font-size:11px;color:var(--ink-3)}

/* 时间刻度节点（#1467：组内按时间分层——同刻度事件归属同一时间节点，形成树状层级） */
.tl-timenode{position:relative}
.tl-timenode + .tl-timenode{margin-top:12px}
.tl-timenode-head{position:relative;display:flex;align-items:center;gap:8px;padding:2px 0}
.tl-timenode-head .tn-dot{position:absolute;left:-23px;top:50%;width:8px;height:8px;border-radius:999px;background:var(--surface);border:1.5px solid var(--accent);transform:translateY(-50%)}
.tl-timenode-label{font-size:12px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.tl-timenode-count{font-size:11px;color:var(--ink-3)}
.tl-timenode-events{position:relative;margin-top:4px;padding-left:22px}
.tl-timenode-events::before{content:"";position:absolute;left:8px;top:2px;bottom:8px;width:2px;border-radius:1px;background:var(--line)}
.tl-timenode-events .tl-node::before{left:-17px;background:var(--surface)}

/* #1527-v2：多历共存「单块刻度带」——左侧 N 条历竖轴（刻度按流速换算定位，隔断疏密不同）+ 右侧对应事件。
   范式参考：Perfetto 多 track 合入单一共享时间线 + 左侧轨道标签；Wikipedia EasyTimeline 多平行竖轴（每轴一色 + 独立刻度）。 */
.mvs{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);box-shadow:var(--shadow);overflow:hidden}
.mvs-colhead{position:absolute;top:4px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--ink);white-space:nowrap;transform:translateX(-50%)}
.mvs-colhead .swatch{width:10px;height:3px;border-radius:2px;background:var(--c)}
.mvs-colhead .cnt{font-weight:400;color:var(--ink-3)}
.mvs-spine{position:absolute;width:2px;border-radius:1px;background:var(--c);opacity:.42}
.mvs-tickmark{position:absolute;height:2px;border-radius:1px;background:var(--c);opacity:.55;transform:translateY(-50%)}
.mvs-tick{position:absolute;z-index:2;font-size:11px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums;transform:translateY(-50%);background:var(--bg);padding:0 4px}
.mvs-node{position:absolute;z-index:2;width:9px;height:9px;border-radius:999px;background:var(--bg);border:2px solid var(--c);transform:translate(-50%,-50%)}
.mvs-link{position:absolute;z-index:1;height:1px;background:var(--c);opacity:.2}
.mvs-rule{position:absolute;z-index:1;left:0;right:0;height:0;border-top:1px dashed var(--line)}
.mvs-ev{position:absolute;z-index:3;display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;border-radius:6px;font-size:12.5px;transition:background 150ms}
.mvs-ev:hover{background:var(--surface-2)}
.mvs-ev .tname{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}

/* #1564 世界序刻度带 v2 —— 不定高刻度 + 时间主轴 + 按刻度分页 */
.mvs-mainhead{position:absolute;top:4px;transform:translateX(-50%);font-size:11px;color:var(--ink-3);white-space:nowrap}
.mvs-mainspine{position:absolute;width:2px;border-radius:1px;background:var(--ink-3);opacity:.45}
.mvs-mainnode{position:absolute;z-index:2;width:7px;height:7px;border-radius:999px;background:var(--bg);border:1.5px solid var(--ink-3);transform:translate(-50%,-50%)}
.mvs-rowguide{position:absolute;z-index:0;height:0;border-top:1px dashed var(--line);opacity:.75}
.mvs-ev--flow{position:relative;left:auto;right:auto;top:auto}
.mvs-unkblock{position:absolute;left:0;right:0}
.mvs-unkblock .mvs-rule{position:relative;left:auto;right:auto;top:auto;display:block;height:0;border-top:1px dashed var(--line)}
.mvs-unkhead{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px 0 104px;font-size:11.5px;color:var(--ink-3)}
.mvs-unkhead .cnt{color:var(--ink-2);font-variant-numeric:tabular-nums}
.mvs-unklist{overflow-y:auto;padding:0 0 2px 0}
.mvs-pager{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;font-size:12px;color:var(--ink-2)}
.mvs-pg-btn{border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink-2);font-size:12px;padding:4px 12px;cursor:pointer;transition:border-color 150ms,color 150ms}
.mvs-pg-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.mvs-pg-btn:disabled{opacity:.45;cursor:default}
.mvs-pg-info{font-variant-numeric:tabular-nums}
.mvs-badge{position:absolute;top:4px;right:16px;font-size:11px;color:var(--ink-3)}
/* 空态 */
.lib-empty{display:none;flex-direction:column;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:8px;background:var(--surface);padding:56px 24px;text-align:center}
body[data-state="empty"] .tl-toolbar,body[data-state="empty"] [data-testid="tl-axis"]{display:none}
body[data-state="empty"] .lib-empty{display:flex}

<script>
/* ── 内联 SVG 图标库 ── */
const ICONS = {

  palette:'<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',

};
document.querySelectorAll('[data-ic]').forEach(el=>{
  const name = el.getAttribute('data-ic');
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');

  svg.setAttribute('fill','none');
  svg.setAttribute('stroke','currentColor');
  svg.setAttribute('stroke-width','2');

});
const CK_SVG = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5 4.8 9 10 3.2"/></svg>';

/* ── 演示数据（沿用本页原型既有数据集；演示数据 = 假想结构，非真实项目素材） ── */
const DEMO = {
  chapters: [
    { key:'c11', title:'第十一章 事件乙' },
    { key:'c12', title:'第十二章 夜访地点乙' },
    { key:'c13', title:'第十三章 事件甲' },
  ],
  noneKey: '__none__',
  noneTitle: '未分章',
  /* 纪元轴（#1353 / 0.16.0）：事件以 extra.era（轴名）+ extra.era_value（轴内值）承载，零 DDL。
     轴顺序 = 事件流中**首次出现**的顺序；`on` = 该演示态的勾选态
     （真实实现：默认只勾选**主力轴** = 事件数最多的轴；至少保留一条轴） */
  axes: [
    { key:'qingyuan', name:'示例界 · 示例历', on:true },
    { key:'none',     name:'未分纪元',        on:false },
    { key:'xianjie',  name:'示例仙界 · 示例仙历',     on:false },
  ],
  /* time = 轴内值（extra.era_value，仅轴内排序/标签用）；timeText = time_display（原样优先）
     标签回落链（#1353）：time_display → 「轴名 + 轴内值」→ 未知（事件 6 无 time_display 即走回落）
     时间文案 = 纪年式（用户 2026-09-22 拍板：不用相对时间「xx 年前」） */
  events: [
    { id:'1', ch:'c11', axis:'qingyuan', time:17,   timeText:'示例历 17 年',  title:'师父闭关前夜，问角色甲「事件乙」' },
    { id:'2', ch:'c12', axis:'qingyuan', time:217,  timeText:'示例历 217 年', title:'角色甲下山，角色乙追随' },
    { id:'3', ch:'c12', axis:'qingyuan', time:217,  timeText:'示例历 217 年', title:'夜访地点乙，发现二十年前异动痕迹' },
    { id:'4', ch:'c13', axis:'qingyuan', time:314,  timeText:'示例历 314 年', title:'事件甲，断剑于地点己' },
    { id:'5', ch:null,  axis:'none',     time:null, timeText:'未知',          title:'角色戊失踪（手工录入，未归章、未设纪元）' },
    { id:'6', ch:null,  axis:'xianjie',  time:1024, timeText:'',              unit:'年', title:'示例仙界法旨降下（另一纪元轴事件）' },
  ],
};
const chTitle = (key) => {
  if (key === null || key === undefined) return DEMO.noneTitle;
  const c = DEMO.chapters.find((x) => x.key === key);
  return c ? c.title : '未知章节';
};
const eraName = (key) => {
  const axis = DEMO.axes.find((a) => a.key === key);
  return axis ? axis.name : key;
};
/* 标签回落链（#1353）：time_display 原样 → 轴名 + 轴内值 → 未知 */
const eventLabel = (ev) => {
  if (ev.timeText) return ev.timeText;
  if (ev.axis) return ev.time === null || ev.time === undefined ? eraName(ev.axis) : `${eraName(ev.axis)} ${ev.time}`;
  return '未知';
};
/* #1467：世界序组内时间刻度（time_display 优先 -> 轴内值 + 单位 -> 未知）。
   轴名只在组头出现一次，行内不再重复轴名（对照 eventLabel 的「轴名 + 轴内值」回退）。 */
const timeScaleOf = (ev) => {
  if (ev.timeText) return ev.timeText;
  if (ev.time !== null && ev.time !== undefined) return `${ev.time}${ev.unit || ''}`;
  return '未知';
};
/* #1467：轴内按纪元值升序（缺失排末尾） */
function byEraValue(a, b){
  if (a.time === null && b.time === null) return 0;
  if (a.time === null) return 1;
  if (b.time === null) return -1;
  return a.time - b.time;
}
/* #1467：组内按时间刻度分层（同刻度合并为一个时间节点，保持轴内顺序）。 */
function groupByTime(evs){
  const order = [];
  const buckets = new Map();
  for (const ev of evs) {
    const key = timeScaleOf(ev);
    if (!buckets.has(key)) { buckets.set(key, []); order.push(key); }
    buckets.get(key).push(ev);
  }
  return order.map((key) => ({ key, evs: buckets.get(key) }));
}

const ALL_EVENTS = DEMO.events.map((ev) =>
  Object.assign({}, ev, { chTitle: chTitle(ev.ch), label: eventLabel(ev) }),
);
/* 轴族（#1353 派生规则：仅含有事件的轴；顺序 = 事件流首次出现） */
const AXIS_KEYS = DEMO.axes.map((a) => a.key).filter((k) => ALL_EVENTS.some((ev) => ev.axis === k));
/* 主力轴 = 事件数最多的轴（并列取先出现）——「主角所在轴」的启发式（用户 2026-10-02 拍板默认只显示它） */
const PRIMARY_AXIS = AXIS_KEYS.slice().sort((a, b) => {
  const ca = ALL_EVENTS.filter((ev) => ev.axis === a).length;
  const cb = ALL_EVENTS.filter((ev) => ev.axis === b).length;
  return cb - ca || AXIS_KEYS.indexOf(a) - AXIS_KEYS.indexOf(b);

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* 事件行模板：timeMode = 'dim'(叙事序行内小字) | 'tick'(时间轴刻度) */
function nodeHTML(ev, opts){
  const o = opts || {};
  const timeCls = o.timeMode === 'tick' ? 'tl-main' : 'tl-main tl-main--dim';
  const timeSpan = o.showTime === false ? '' : `<span class="${timeCls}" data-testid="tl-axis-main-${ev.id}">${esc(ev.label)}</span>`;
  const src = o.showSrc ? `<span class="tl-src" data-testid="tl-src-${ev.id}">${esc(ev.chTitle)}</span>` : '';
  return `<div class="tl-node" data-testid="tl-axis-node-${ev.id}">
    ${timeSpan}
    <span class="tname">${esc(ev.title)}</span>${src}
    <button class="check-one" data-testid="tl-check-one-${ev.id}">单事件检查</button>
    <span class="tl-actions">
      <button data-testid="tl-edit-${ev.id}" aria-label="编辑 ${esc(ev.title)}"><span data-ic2="pencil"></span></button>
      <button data-testid="tl-delete-${ev.id}" aria-label="删除 ${esc(ev.title)}"><span data-ic2="trash"></span></button>
    </span>
  </div>`;
}

/* 叙事序 = 章轴：章刻度（tick）+ 章下事件；组顺序 = 章序，末尾「未分章」 */
function renderNarrative(evs){
  const groups = DEMO.chapters.map((c) => ({ key:c.key, title:c.title, evs:[] }));
  groups.push({ key:DEMO.noneKey, title:DEMO.noneTitle, evs:[] });
  for (const ev of evs) {
    const key = ev.ch === null || ev.ch === undefined ? DEMO.noneKey : ev.ch;
    const g = groups.find((x) => x.key === key);
    if (g) g.evs.push(ev);
  }
  const body = groups.filter((g) => g.evs.length > 0).map((g) => `
    <div class="tl-chgroup" data-testid="tl-chgroup-${g.key}">
      <div class="tl-chtick${g.key === DEMO.noneKey ? ' tl-chtick--none' : ''}" data-testid="tl-chtick-${g.key}">
        <span class="tickdot"></span>
        <span class="tl-chlabel">${esc(g.title)}</span>
        <span class="tl-chcount">${g.evs.length} 个事件</span>
      </div>
      <div class="tl-chbody">${g.evs.map((ev) => nodeHTML(ev, { timeMode:'dim' })).join('')}</div>
    </div>`).join('');
  return `<div class="tl-axis tl-axis--chapter" data-testid="tl-axis">${body}</div>`;
}

/* 主轴行模型：合并选中历刻度（g = to_global 去重升序） */
function bandRowsV2(eras, evs) {
  const axOf = function (e) { return eras.filter(function (a) { return a.key === e.axis; })[0]; };
  const map = new Map();
  evs.forEach(function (e) {
    const ax = axOf(e);
    if (!ax || e.time === null || e.time === undefined) return;
    const g = e.time / (ax.scale || 1);
    let row = map.get(g);
    if (!row) { row = { g:g, count:0, evs:[], perAxis:{} }; map.set(g, row); }
    row.count += 1;
    row.evs.push(e);
    if (!row.perAxis[e.axis]) row.perAxis[e.axis] = { local:e.time, label:timeScaleOf(e) };
  });
  return Array.from(map.values()).sort(function (a, b) { return a.g - b.g; });
}

    + '</div>';
}

/* 刻度带 v2：不定高刻度 + 时间主轴 + 按刻度分页。mode = 'ordinal' | 'metric' */
function renderBandV2(eras, evs, mode, page) {
  const rows = bandRowsV2(eras, evs);
  /* 度量态（B）单页全量展示（分位数需全量计算）*/
  const per = mode === 'metric' ? Math.max(1, rows.length) : B2.PER_PAGE;
  const pageCount = Math.max(1, Math.ceil(rows.length / per));
  const p = Math.min(Math.max(page || 0, 0), pageCount - 1);
  const pageRows = rows.slice(p * per, p * per + per);
  const unknown = evs.filter(function (e) {
    return eras.some(function (a) { return a.key === e.axis; }) && (e.time === null || e.time === undefined);
  });
  /* 行高 = 该刻度实际事件数（拍板 ①） */
  const rowH = function (r) { return B2.ROW_PAD * 2 + Math.max(1, r.count) * B2.ROW_H; };
  const span = pageRows.reduce(function (s, r) { return s + rowH(r); }, 0);
  /* 离群策略（拍板 ④） */
  let idealOf = function () { return B2.PAD_T; };
  if (mode === 'metric' && pageRows.length > 2) {
    const gs = pageRows.map(function (r) { return r.g; }).sort(function (a, b) { return a - b; });
    const lo = gs[Math.floor((gs.length - 1) * 0.10)];
    const hi = gs[Math.ceil((gs.length - 1) * 0.90)];
    const d = (hi - lo) || 1;
    idealOf = function (r) { return B2.PAD_T + ((Math.min(Math.max(r.g, lo), hi) - lo) / d) * span; };
  }
  let cursor = B2.PAD_T;
  const placed = pageRows.map(function (r) {
    const h = rowH(r);
    const top = Math.max(cursor, idealOf(r));
    cursor = top + h;
    return { row:r, top:top, h:h };
  });
  const bottom = cursor;
  /* 未知区列表高度按整数行取整（避免半行被裁成「破损」观感） */
  const rawListH = Math.min(unknown.length * B2.ROW_H, B2.UNK_MAX);
  const listH = unknown.length ? Math.max(B2.ROW_H, Math.floor(rawListH / B2.ROW_H) * B2.ROW_H) : 0;
  const unknownH = unknown.length ? B2.RULE_GAP + 24 + listH + 8 : 0;
  const H = bottom + unknownH + B2.BOT_PAD;
  const spineH = Math.max(0, bottom - B2.PAD_T);
  let html = '';
  eras.forEach(function (ax, i) {
    const x = B2.AX0 + i * B2.AXDX;
    const cnt = evs.filter(function (e) { return e.axis === ax.key; }).length;
    html += '<span class="mvs-colhead" style="left:' + x + 'px;--c:' + ax.color + '"><span class="swatch"></span>'
      + esc(ax.name) + '<span class="cnt">' + cnt + '</span></span>';
  });
  /* 时间主轴（拍板 ③） */
  html += '<span class="mvs-mainhead" style="left:' + B2.MAINX + 'px">时间主轴</span>';
  html += '<span class="mvs-mainspine" style="left:' + B2.MAINX + 'px;top:' + B2.PAD_T + 'px;height:' + spineH + 'px"></span>';
  placed.forEach(function (it, i) {
    const cy = it.top + it.h / 2;
    html += '<span class="mvs-rowguide" style="left:' + B2.MAINX + 'px;right:18px;top:' + cy + 'px"></span>';
    html += '<span class="mvs-mainnode" data-testid="tl-band-mainnode-' + i + '" style="left:' + B2.MAINX + 'px;top:' + cy + 'px"></span>';
  });
  eras.forEach(function (ax, i) {
    const x = B2.AX0 + i * B2.AXDX;
    html += '<span class="mvs-spine" style="left:' + x + 'px;top:' + B2.PAD_T + 'px;height:' + spineH + 'px;--c:' + ax.color + '"></span>';
    placed.forEach(function (it) {
      const info = it.row.perAxis[ax.key];
      if (!info) return;
      const cy = it.top + it.h / 2;
      html += '<span class="mvs-tickmark" style="left:' + (x - 5) + 'px;top:' + cy + 'px;width:12px;--c:' + ax.color + '"></span>';
      html += '<span class="mvs-node" style="left:' + x + 'px;top:' + cy + 'px;--c:' + ax.color + '"></span>';
      html += '<span class="mvs-tick" style="left:' + (x + 9) + 'px;top:' + cy + 'px">' + esc(info.label) + '</span>';
    });
  });
  placed.forEach(function (it) {
    eras.forEach(function (ax, ai) {
      const x = B2.AX0 + ai * B2.AXDX;
      it.row.evs.filter(function (e) { return e.axis === ax.key; }).forEach(function (e, k) {
        const y = it.top + B2.ROW_PAD + k * B2.ROW_H;
        html += '<span class="mvs-link" style="left:' + x + 'px;top:' + (y + 12) + 'px;width:' + (B2.EVX - x - 6) + 'px;--c:' + ax.color + '"></span>';
        html += bandEventRow(e, 'abs', y);
      });
    });
  });
  if (unknown.length) {
    html += '<div class="mvs-unkblock" style="top:' + (bottom + B2.RULE_GAP) + 'px">'
      + '<span class="mvs-rule" data-testid="tl-band-unknown"></span>'
      + '<div class="mvs-unkhead">未知 <span class="cnt">' + unknown.length + '</span></div>'
      + '<div class="mvs-unklist" style="height:' + listH + 'px">'
      + unknown.map(function (e) { return bandEventRow(e, 'flow', 0); }).join('')
      + '</div></div>';
  }
  if (mode === 'metric') html += '<span class="mvs-badge">离群压缩：p10–p90 截断（越界夹端点）· 单页全量</span>';
  const pager = '<div class="mvs-pager" data-testid="tl-band-pager">'
    + '<button class="mvs-pg-btn" data-testid="tl-band-page-prev"' + (p === 0 ? ' disabled' : '') + ' onclick="bandGo(-1)">‹ 上一页</button>'
    + '<span class="mvs-pg-info" data-testid="tl-band-pageinfo">第 ' + (p + 1) + ' / ' + pageCount + ' 页 · 每页 ' + per + ' 刻度 · 共 ' + rows.length + ' 刻度</span>'
    + '<button class="mvs-pg-btn" data-testid="tl-band-page-next"' + (p >= pageCount - 1 ? ' disabled' : '') + ' onclick="bandGo(1)">下一页 ›</button>'
    + '</div>';
  return '<div class="mvs" data-testid="tl-band" style="height:' + H + 'px">' + html + '</div>' + pager;
}

/* #1541 旧形态复现（M6 改前对照）：高度 ∝ 事件总数 + 线性铺满 + unknown 双计 */
function renderBandLegacy() {
  const eras = DENSE_ERAS, evs = DENSE_EVENTS;
  const TOP = 54, AX0 = 150, AXDX = 104, EVX = 352, GAP = 28, LH = 26;
  const axOf = function (e) { return eras.filter(function (a) { return a.key === e.axis; })[0]; };
  const timed = evs.filter(function (e) { const ax = axOf(e); return ax && e.time !== null && e.time !== undefined; });
  const unknown = evs.filter(function (e) { const ax = axOf(e); return ax && (e.time === null || e.time === undefined); });
  const gv = function (e) { return e.time / (axOf(e).scale || 1); };
  const gmax = Math.max.apply(null, timed.map(gv).concat([0])) * 1.05;
  const unknownBlock = unknown.length > 0 ? 20 + unknown.length * GAP + 8 : 0;
  const height = Math.max(400, 120 + (timed.length + unknown.length) * GAP + unknownBlock);
  const spineH = height - TOP - 80;
  const Y = function (g) { return TOP + (g / gmax) * spineH; };
  let html = '';
  eras.forEach(function (ax, i) {
    const x = AX0 + i * AXDX;
    const mine = timed.filter(function (e) { return e.axis === ax.key; });
    html += '<span class="mvs-colhead" style="left:' + x + 'px;--c:' + ax.color + '"><span class="swatch"></span>'
      + esc(ax.name) + '<span class="cnt">' + evs.filter(function (e) { return e.axis === ax.key; }).length + '</span></span>';
    html += '<span class="mvs-spine" style="left:' + x + 'px;top:' + TOP + 'px;height:' + spineH + 'px;--c:' + ax.color + '"></span>';
    Array.from(new Set(mine.map(function (e) { return e.time; }))).sort(function (a, b) { return a - b; }).forEach(function (t) {
      const y = Y(t / (ax.scale || 1));
      html += '<span class="mvs-node" style="left:' + x + 'px;top:' + y + 'px;--c:' + ax.color + '"></span>';
      html += '<span class="mvs-tick" style="left:' + (x + 9) + 'px;top:' + y + 'px">' + t + ' 年</span>';
    });
  });
  const seen = {};
  timed.slice().sort(function (a, b) { return gv(a) - gv(b); }).forEach(function (e) {
    const ax = axOf(e);
    const x = AX0 + eras.indexOf(ax) * AXDX;
    const gy = Y(gv(e));
    const slot = Math.round(gy / LH);
    seen[slot] = (seen[slot] || 0) + 1;
    const y = gy + (seen[slot] - 1) * LH;
    html += '<span class="mvs-link" style="left:' + x + 'px;top:' + y + 'px;width:' + (EVX - x - 6) + 'px;--c:' + ax.color + '"></span>';
    html += bandEventRow(e, 'abs', y - 12);
  });
  const uy = TOP + spineH + 24;
  html += '<span class="mvs-rule" data-testid="tl-band-unknown" style="top:' + (TOP + spineH + 12) + 'px"></span>';
  html += '<span class="mvs-tick" style="left:' + (AX0 + 9) + 'px;top:' + uy + 'px">未知</span>';
  unknown.forEach(function (e, i) { html += bandEventRow(e, 'abs', uy - 12 + i * GAP); });
  html += '<span class="mvs-badge">#1541 旧形态复现：height = max(400, 120 + (rows+unknown)×28 + unknownBlock) = ' + height + 'px</span>';
  return '<div class="mvs" data-testid="tl-band" style="height:' + height + 'px">' + html + '</div>';
}

/* 状态 → 刻度带 HTML（分页管理） */
let bandCur = { state:'world-band', page:0 };
function renderBandStateHTML(state, page) {
  if (state === 'world-band') return renderBandV2(BAND_ERAS, BAND_EVENTS, 'ordinal', page);
  if (state === 'world-band-p2') return renderBandV2(BAND_ERAS, BAND_EVENTS, 'ordinal', page);
  if (state === 'world-band-metric') return renderBandV2(DENSE_ERAS, DENSE_EVENTS, 'metric', page);
  if (state === 'world-band-dense') return renderBandV2(DENSE_ERAS, DENSE_EVENTS, 'ordinal', page);
  if (state === 'world-band-dense-legacy') return renderBandLegacy();
  return '';
}
window.bandGo = function (d) {
  bandCur.page = Math.max(0, bandCur.page + d);
  document.getElementById('tlBody').innerHTML = renderBandStateHTML(bandCur.state, bandCur.page);
  mountDynIcons();
};

/* 筛选面板（按章）：narrative-filter 态演示「已选第十二章」 */
function renderFilterPanel(state){
  const items = [{ key:'all', title:'全部章节' }]
    .concat(DEMO.chapters.map((c) => ({ key:c.key, title:c.title })))
    .concat([{ key:DEMO.noneKey, title:DEMO.noneTitle }]);
  const isFiltered = state === 'narrative-filter';
  document.getElementById('fpChapterItems').innerHTML = items.map((it) => {
    const sel = isFiltered ? it.key === 'c12' : it.key === 'all';
    return `<div class="tl-fp-item${sel ? ' sel' : ''}" data-testid="tl-fp-item-${it.key}"><span class="cb">${CK_SVG}</span>${esc(it.title)}</div>`;
  }).join('');
  const btn = document.getElementById('filterChapterBtn');
  btn.classList.toggle('on', isFiltered);
  document.getElementById('filterChapterLabel').textContent = isFiltered ? '章：第十二章' : '章：全部';
}

function renderBody(state){
  if (state === 'narrative' || state === 'narrative-filter') {
    const evs = state === 'narrative-filter'
      ? ALL_EVENTS.filter((ev) => (ev.ch === null ? DEMO.noneKey : ev.ch) === 'c12')
      : ALL_EVENTS;
    return renderNarrative(evs);
  }
  if (state === 'world') return renderWorldA();
  if (state === 'world-eras') return renderWorldEras(['qingyuan']);
  if (state === 'world-eras-b') return renderWorldErasB(['qingyuan']);
  if (state === 'world-eras-multi') return renderWorldEras(AXIS_KEYS);
  if (state === 'world-single') return renderWorldSingle();
  if (state === 'world-band') { bandCur = { state:'world-band', page:0 }; return renderBandStateHTML('world-band', 0); }
  if (state === 'world-band-p2') { bandCur = { state:'world-band-p2', page:1 }; return renderBandStateHTML('world-band-p2', 1); }
  if (state === 'world-band-metric') { bandCur = { state:'world-band-metric', page:0 }; return renderBandStateHTML('world-band-metric', 0); }
  if (state === 'world-band-dense') { bandCur = { state:'world-band-dense', page:0 }; return renderBandStateHTML('world-band-dense', 0); }
  if (state === 'world-band-dense-legacy') { bandCur = { state:'world-band-dense-legacy', page:0 }; return renderBandStateHTML('world-band-dense-legacy', 0); }
  return '';
}

/* 渲染出的行内 pencil/trash 图标（data-ic2 在动态节点上二次挂载） */
function mountDynIcons(){
  document.querySelectorAll('#tlBody [data-ic2]').forEach((el) => {
    const name = el.getAttribute('data-ic2');
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('fill','none');
    svg.setAttribute('stroke','currentColor');
    svg.setAttribute('stroke-width','2');
    svg.setAttribute('stroke-linecap','round');
    svg.setAttribute('stroke-linejoin','round');
    svg.innerHTML = ICONS[name] || '';
    el.appendChild(svg);
  });
}

function setState(s){
  if (!STATES.includes(s)) s = 'narrative';
  document.body.dataset.state = s;
  const sel = document.getElementById('stateSel');
  if (sel) sel.value = s;
  const isWorld = s === 'world' || s === 'world-eras' || s === 'world-eras-multi' || s === 'world-eras-b' || s === 'world-single' || s.indexOf('world-band') === 0;
  document.getElementById('segNarrative').classList.toggle('active', !isWorld);
  document.getElementById('segWorld').classList.toggle('active', isWorld);
  document.getElementById('tlLegend').textContent = LEGENDS[s] || '';
  document.getElementById('tlBody').innerHTML = renderBody(s);
  renderPicker(s === 'world-eras-multi' ? AXIS_KEYS : [PRIMARY_AXIS]);
  mountDynIcons();
  renderFilterPanel(s);
  document.getElementById('reviewNote').innerHTML = NOTES[s] || '';
}
function setTheme(th){
  document.documentElement.dataset.theme = th;
  document.body.dataset.theme = th;
  const sel = document.getElementById('themeSel');
  const label = document.getElementById('themeLabel');
  if (sel && label) {
    const opt = Array.prototype.find.call(sel.options, (o) => o.value === th);
    if (opt) label.textContent = opt.textContent;
  }
}
document.getElementById('stateSel').addEventListener('change', (e) => setState(e.target.value));
document.getElementById('themeSel').addEventListener('change', (e) => setTheme(e.target.value));
const init = location.hash.replace('#','');
setState(STATES.includes(init) ? init : 'narrative');
window.addEventListener('hashchange', () => {
  const s = location.hash.replace('#','');
  if (STATES.includes(s)) setState(s);
});
</script>
