<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper" data-bg="default">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InkFlow 设定库 UI 原型 v2（角色/世界观/大纲/时间线/伏笔）</title>
<style>
/* ============ 布局常量 ============ */
:root{
  --dur:180ms; --ease:cubic-bezier(.16,1,.3,1);
  --radius-s:4px; --radius-m:6px; --radius-l:8px;
  --reviewbar-h:36px; --topbar-h:44px;
  --shadow:0 1px 2px rgba(42,42,40,.05), 0 4px 16px rgba(42,42,40,.06);
}
/* ============ 三主题色板（token 原文） ============ */
[data-theme]{ --font-ui:"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif; --font-body:var(--font-ui); }
[data-theme="paper"]{
  --bg:#FAF9F7; --surface:#FFFFFF; --surface-2:#F3F1EC; --surface-3:#EBE8E1;
  --ink:#2A2A28; --ink-2:#6B6A66; --ink-3:#A4A29B; --line:#E5E2DA;
  --accent:#3B5B7C; --accent-ink:#FFFFFF; --accent-weak:rgba(59,91,124,.10);
  --ok:#4A7C59; --warn:#B07A2E; --err:#B04A3A;
  --font-serif:"Noto Serif SC","Source Han Serif SC","SimSun","宋体",Georgia,serif;
  --font-title:var(--font-serif);
}
[data-theme="night"]{
  --bg:#1A1A18; --surface:#22221F; --surface-2:#282823; --surface-3:#32322C;
  --ink:#E8E6E1; --ink-2:#9B988F; --ink-3:#6E6B63; --line:#34332E;
  --accent:#C9A24B; --accent-ink:#1A1A18; --accent-weak:rgba(201,162,75,.13);
  --ok:#8FAE8E; --warn:#C9A24B; --err:#C97B63;
  --font-serif:"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
  --font-title:var(--font-ui);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}
[data-theme="ink"]{
  --bg:#F3EEE2; --surface:#FAF6EC; --surface-2:#EFE9DA; --surface-3:#E6DFCC;
  --ink:#2B2A26; --ink-2:#6E6A5E; --ink-3:#A49F90; --line:#DED6C2;
  --accent:#A6402E; --accent-ink:#FAF6EC; --accent-weak:rgba(166,64,46,.09);
  --ok:#5A7A58; --warn:#9A7B3C; --err:#A6402E;
  --font-serif:"KaiTi","STKaiti","楷体","PingFang SC",serif;
  --font-title:var(--font-serif);
  --font-body:"Noto Serif SC","Source Han Serif SC","SimSun","宋体",Georgia,serif;
}
[data-theme="paper"][data-bg="parchment"]{ --bg:#F4EFE6; --surface:#FBF8F2; --surface-2:#EFE8DA; --surface-3:#E7DFCC; --line:#E0D7C4; }
[data-theme="night"][data-bg="navy"]{ --bg:#171A1E; --surface:#1E2227; --surface-2:#232830; --surface-3:#2C323C; --line:#363D47; }
[data-theme="ink"][data-bg="brown"]{ --bg:#EDE6D6; --surface:#F6F0E2; --surface-2:#E7DEC9; --surface-3:#DED3BA; --line:#D6C9AC; }
/* ============ 基础 ============ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-ui); font-size:13px; color:var(--ink);
  background:var(--bg); overflow:hidden; display:flex; flex-direction:column;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit; color:inherit}
::placeholder{color:var(--ink-3)}
/* ============ 评审控制栏 ============ */
.reviewbar{
  position:fixed; top:0; left:0; right:0; height:var(--reviewbar-h); z-index:200;
  display:flex; align-items:center; gap:12px; padding:0 12px;
  background:var(--surface-2); border-bottom:1px solid var(--line);
  font-size:11px; color:var(--ink-2);
}
.reviewbar .rb-tag{color:var(--ink-3); white-space:nowrap}
.rb-group{display:flex; align-items:center; gap:4px; white-space:nowrap}
.rb-label{color:var(--ink-3); margin-right:2px}
.rb-btn{padding:3px 9px; border-radius:var(--radius-s); border:1px solid var(--line); background:var(--surface); color:var(--ink-2); font-size:11px; transition:all var(--dur) var(--ease);}
.rb-btn:hover{border-color:var(--accent); color:var(--accent)}
.rb-btn.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.rb-btn.active:hover{color:var(--accent-ink)}
.rb-select{padding:2px 6px; border-radius:var(--radius-s); border:1px solid var(--line); background:var(--surface); font-size:11px; color:var(--ink-2);}
.rb-sep{width:1px; height:14px; background:var(--line); margin:0 4px}
/* ============ 应用骨架 ============ */
.app{flex:1; display:flex; flex-direction:column; min-height:0; padding-top:var(--reviewbar-h)}
.topbar{height:var(--topbar-h); flex:none; display:flex; align-items:center; gap:12px; padding:0 16px; background:var(--surface); border-bottom:1px solid var(--line);}
.topbar-title{font-family:var(--font-title); font-size:17px; font-weight:600; letter-spacing:.02em}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--ink-2)}
.kernel-badge{display:flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2); font-size:11px;}
.kernel-dot{width:7px; height:7px; border-radius:50%; background:var(--ok); display:inline-block}
.workspace{flex:1; display:flex; min-height:0}
/* ============ 侧边导航 ============ */
.app-nav{width:200px; flex:none; display:flex; flex-direction:column; background:var(--surface-2); border-right:1px solid var(--line); overflow:hidden;}
.nav-brand{display:flex; align-items:center; gap:9px; padding:12px 14px 10px; flex:none}
.nav-word{font-family:var(--font-title); font-size:15px; font-weight:700; letter-spacing:.04em; white-space:nowrap}
.nav-scroll{flex:1; overflow-y:auto; padding:4px 8px 8px}
.nav-group-title{font-size:10px; color:var(--ink-3); letter-spacing:.14em; padding:12px 8px 5px; white-space:nowrap;}
.nav-item{display:flex; align-items:center; gap:9px; width:100%; padding:6px 8px; margin:1px 0; border-radius:var(--radius-m); color:var(--ink-2); font-size:13px; text-align:left; white-space:nowrap; transition:background var(--dur) var(--ease), color var(--dur) var(--ease);}
.nav-item:hover{background:var(--surface-3); color:var(--ink)}
.nav-item.active{background:var(--accent-weak); color:var(--accent); font-weight:500}
.nav-ico{width:16px; height:16px; flex:none; opacity:.85}
/* ============ 视图 ============ */
.view{display:none; flex:1; min-width:0; min-height:0}
body[data-view="library"] .view-library{display:flex}
/* ============ 通用组件 ============ */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow)}
.btn{display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:var(--radius-m); border:1px solid var(--line); background:var(--surface); color:var(--ink-2); font-size:12px; white-space:nowrap; transition:all var(--dur) var(--ease);}
.btn:hover{border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{color:var(--accent-ink); opacity:.92}
.btn.danger:hover{border-color:var(--err); color:var(--err)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.sm{padding:3px 10px; font-size:11px; border-radius:var(--radius-s)}
.badge{display:inline-flex; align-items:center; gap:4px; padding:1px 8px; border-radius:999px; font-size:10px; line-height:16px; white-space:nowrap;}
.badge.ok{background:color-mix(in srgb, var(--ok) 12%, transparent); color:var(--ok)}
.badge.warn{background:color-mix(in srgb, var(--warn) 12%, transparent); color:var(--warn)}
.badge.err{background:color-mix(in srgb, var(--err) 12%, transparent); color:var(--err)}
.badge.neutral{background:var(--surface-3); color:var(--ink-2)}
.badge.accent{background:var(--accent-weak); color:var(--accent)}
.empty{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:36px 20px; text-align:center; color:var(--ink-3); font-size:13px; border:1px dashed var(--line); border-radius:var(--radius-l); background:var(--surface-2);}
.empty .empty-title{color:var(--ink-2); font-size:13px}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:11px; color:var(--ink-2)}
.input,.select,textarea.input{padding:6px 10px; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); font-size:13px; transition:border-color var(--dur) var(--ease); resize:vertical;}
.input:focus,.select:focus{outline:none; border-color:var(--accent)}
/* ============ 设定库视图 ============ */
.view-library{flex-direction:column}
.lib-head{flex:none; padding:18px 24px 0; max-width:1080px; width:100%; margin:0 auto}
.lib-title{font-family:var(--font-title); font-size:24px; font-weight:600}
.lib-ctx{display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap}
.lib-crumb{font-size:12px; color:var(--ink-2)}
.lib-crumb b{color:var(--ink)}
.lib-body{flex:1; overflow-y:auto; padding:14px 24px 40px; max-width:1080px; width:100%; margin:0 auto}
/* 分类 tab */
.lib-tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-top:14px; flex-wrap:wrap}
.lib-tab{padding:7px 14px; font-size:13px; color:var(--ink-2); border-bottom:2px solid transparent; margin-bottom:-1px; transition:color var(--dur) var(--ease), border-color var(--dur) var(--ease);}
.lib-tab:hover{color:var(--ink)}
.lib-tab.active{color:var(--accent); border-bottom-color:var(--accent); font-weight:500}
/* 工具栏 */
.lib-toolbar{display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap}
.lib-toolbar .spacer{flex:1}
/* 角色等级筛选 chips */
.chip-group{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.chip{padding:3px 11px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); font-size:11px; transition:all var(--dur) var(--ease);}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.active{background:var(--accent-weak); border-color:var(--accent); color:var(--accent)}
/* 列表 */
.lib-list{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.lib-item{display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow); transition:border-color var(--dur) var(--ease);}
.lib-item:hover{border-color:color-mix(in srgb, var(--accent) 40%, var(--line))}
.lib-item.clickable{cursor:pointer}
.lib-avatar{width:34px; height:34px; flex:none; border-radius:var(--radius-m); background:var(--accent-weak); color:var(--accent); display:flex; align-items:center; justify-content:center; font-family:var(--font-title); font-size:15px; font-weight:600;}
.li-main{flex:1; min-width:0}
.li-name{font-size:13.5px; font-weight:500; color:var(--ink)}
.li-bio{font-size:11.5px; color:var(--ink-3); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.li-tags{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.li-actions{display:flex; gap:4px; opacity:0; transition:opacity var(--dur) var(--ease)}
.lib-item:hover .li-actions, .tree-row:hover .li-actions, .tl-card:hover .li-actions, .point-row:hover .li-actions{opacity:1}
.icon-btn{width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--radius-s); color:var(--ink-3); font-size:12px; transition:all var(--dur) var(--ease);}
.icon-btn:hover{background:var(--surface-3); color:var(--ink)}
.icon-btn.danger:hover{background:color-mix(in srgb, var(--err) 10%, transparent); color:var(--err)}
/* 世界观树 */
.tree-node{position:relative}
.tree-row{display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:var(--radius-m); transition:background var(--dur) var(--ease);}
.tree-row:hover{background:var(--surface-3)}
.tree-row.selected{background:var(--accent-weak)}
.tree-toggle{width:16px; height:16px; flex:none; display:inline-flex; align-items:center; justify-content:center; color:var(--ink-3); font-size:10px; border-radius:var(--radius-s); transition:transform var(--dur) var(--ease);}
.tree-toggle:hover{color:var(--accent)}
.tree-toggle.open{transform:rotate(90deg)}
.tree-toggle.leaf{visibility:hidden}
.tree-children{margin-left:18px; border-left:1px dashed var(--line); padding-left:6px; display:none}
.tree-children.open{display:block}
.tree-scale{font-size:10px; color:var(--ink-3); font-family:var(--font-ui)}
/* ============ 地图工作台 ============ */
.map-workbench{display:flex; gap:12px; margin-top:12px; min-height:420px}
.map-tree-col{width:250px; flex:none; display:flex; flex-direction:column; gap:8px}
.map-canvas-col{flex:1; min-width:0; display:flex; flex-direction:column; gap:8px}
.map-canvas{
  position:relative; flex:1; min-height:340px; border-radius:var(--radius-l);
  border:1px solid var(--line); background:var(--surface);
  overflow:hidden; cursor:crosshair;
  box-shadow:var(--shadow);
}
.map-canvas-bg{position:absolute; inset:0; pointer-events:none}
.map-pin{
  position:absolute; transform:translate(-50%,-100%); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:1px;
  z-index:2; transition:transform var(--dur) var(--ease);
}
.map-pin:hover{transform:translate(-50%,-100%) scale(1.12); z-index:5}
.map-pin .pin-head{
  width:22px; height:22px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
  display:flex; align-items:center; justify-content:center;
  background:var(--accent); color:var(--accent-ink); font-size:10px;
  box-shadow:var(--shadow); border:1.5px solid var(--surface);
}
.map-pin .pin-head.role{background:var(--warn)}
.map-pin .pin-head.event{background:var(--ok)}
.map-pin .pin-head.other{background:var(--ink-3)}
.map-pin .pin-label{
  font-size:10.5px; color:var(--ink); background:color-mix(in srgb, var(--surface) 88%, transparent);
  padding:1px 7px; border-radius:999px; border:1px solid var(--line); white-space:nowrap;
}
.map-canvas .pin-add-hint{
  position:absolute; right:10px; bottom:10px; font-size:10.5px; color:var(--ink-3);
  background:color-mix(in srgb, var(--surface) 85%, transparent); padding:4px 10px; border-radius:999px; border:1px solid var(--line);
}
.pin-list{flex:none; max-height:130px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface);}
.pin-list-row{display:flex; align-items:center; gap:8px; padding:5px 10px; font-size:12px; border-bottom:1px solid var(--line);}
.pin-list-row:last-child{border-bottom:none}
.pin-list-row .pin-type{width:52px; flex:none}
.breadcrumb{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); margin-top:12px; flex-wrap:wrap}
.breadcrumb .sep{color:var(--ink-3)}
.breadcrumb .link{color:var(--accent); cursor:pointer}
.breadcrumb .link:hover{text-decoration:underline}
.breadcrumb .current{color:var(--ink); font-weight:500}
/* 简图模式形状 */
.map-shape{position:absolute; cursor:move; border:1.5px solid var(--accent); border-radius:var(--radius-s); z-index:1; touch-action:none}
.map-shape.ellipse{border-radius:50%}
.map-shape.text{border:none; font-size:12px; color:var(--ink-2); cursor:move; white-space:nowrap; text-align:center}
.map-shape.selected{outline:2px dashed var(--warn); outline-offset:2px}
.map-shape .shape-del{position:absolute; top:-8px; right:-8px; width:16px; height:16px; border-radius:50%; background:var(--err); color:#fff; font-size:9px; display:none; align-items:center; justify-content:center; cursor:pointer}
.map-shape.selected .shape-del{display:flex}
.map-bg-tools{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.map-bg-tools .sep{width:1px; height:14px; background:var(--line)}
/* 大纲 */
.arc-group{margin-top:14px}
.arc-head{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-2); padding:6px 10px; border-radius:var(--radius-m); background:var(--surface-2); border:1px solid var(--line);}
.arc-name{font-weight:500; color:var(--ink)}
.point-list{margin-top:6px; display:flex; flex-direction:column; gap:6px}
.point-row{display:flex; align-items:center; gap:10px; padding:8px 12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);}
.point-idx{width:20px; height:20px; flex:none; border-radius:50%; background:var(--accent-weak); color:var(--accent); font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:600;}
/* 时间线 */
.tl-legend{display:flex; gap:14px; font-size:11px; color:var(--ink-3); margin-top:10px; align-items:center}
.tl-list{display:flex; flex-direction:column; gap:0; margin-top:6px; position:relative}
.tl-list::before{content:""; position:absolute; left:15px; top:6px; bottom:6px; width:2px; background:var(--line);}
.tl-row{display:flex; gap:14px; position:relative; padding:8px 0 8px 0}
.tl-dot{width:12px; height:12px; flex:none; border-radius:50%; background:var(--surface); border:2px solid var(--accent); margin-top:12px; margin-left:10px; position:relative; z-index:1;}
.tl-card{flex:1; min-width:0; display:flex; align-items:flex-start; gap:12px; padding:10px 14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow);}
.tl-time{flex:none; width:110px; font-size:11.5px; color:var(--accent); font-weight:500; padding-top:2px}
.tl-main{flex:1; min-width:0}
.tl-title{font-size:13px; font-weight:500}
.tl-desc{font-size:11.5px; color:var(--ink-3); margin-top:2px}
/* 详情抽屉（大纲/伏笔） */
.detail-pane{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow); margin-top:14px; overflow:hidden}
.dp-head{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); background:var(--surface-2);}
.dp-title{font-family:var(--font-title); font-size:15px; font-weight:600}
.dp-body{padding:14px 16px}
.dp-desc{font-size:12.5px; color:var(--ink-2); line-height:1.7}
/* 弹窗 */
.modal-overlay{position:fixed; inset:0; background:rgba(20,20,18,.4); z-index:300; display:none; align-items:center; justify-content:center;}
.modal-overlay.open{display:flex}
.modal{width:520px; max-width:92vw; max-height:86vh; overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow); padding:20px 22px;}
.modal h2{font-family:var(--font-title); font-size:17px; font-weight:600; margin-bottom:14px}
.modal .form-grid{display:flex; flex-direction:column; gap:12px}
.modal .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.modal-foot{display:flex; justify-content:flex-end; gap:8px; margin-top:18px}
/* 标签多选编辑器 */
.tag-editor{display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 10px; border:1px solid var(--line); border-radius:var(--radius-m); background:var(--surface); min-height:34px; transition:border-color var(--dur) var(--ease);}
.tag-editor:focus-within{border-color:var(--accent)}
.tag-chip{display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:999px; background:var(--accent-weak); color:var(--accent); font-size:11px; cursor:pointer; transition:all var(--dur) var(--ease);}
.tag-chip:hover{background:color-mix(in srgb, var(--err) 10%, transparent); color:var(--err)}
.tag-chip .x{font-weight:700}
.tag-editor input{flex:1; min-width:80px; border:none; outline:none; background:none; font-size:12px; color:var(--ink)}
.tag-suggest{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px}
.tag-suggest .sug-chip{padding:2px 9px; border-radius:999px; border:1px dashed var(--line); background:var(--surface); color:var(--ink-3); font-size:10.5px; cursor:pointer; transition:all var(--dur) var(--ease);}
.tag-suggest .sug-chip:hover{border-color:var(--accent); color:var(--accent)}
.tag-suggest .sug-chip.on{background:var(--accent-weak); border-style:solid; border-color:var(--accent); color:var(--accent)}
/* 确认框 */
#confirmModal{z-index:400}
.confirm-modal{width:420px; max-width:92vw;}
.confirm-text{font-size:13px; color:var(--ink-2); line-height:1.7; margin-top:2px}
.confirm-text b{color:var(--ink)}
.confirm-danger{color:var(--err)}
/* Toast */
.toast-wrap{position:fixed; top:52px; left:50%; transform:translateX(-50%); z-index:500; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
.toast{display:flex; align-items:center; gap:8px; padding:8px 18px; border-radius:999px; background:var(--ink); color:var(--bg); font-size:12px; box-shadow:var(--shadow); opacity:1; transition:opacity .2s var(--ease), transform .2s var(--ease);}
.toast.out{opacity:0; transform:translateY(-6px)}
.toast .t-ico{font-weight:700}
.toast.ok .t-ico{color:var(--ok)}
.toast.err .t-ico{color:var(--err)}
/* Token 面板 */
#tokenPanel{position:fixed; right:12px; bottom:12px; width:236px; z-index:180; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow); font-size:10.5px; overflow:hidden;}
#tokenPanel.min .tp-body{display:none}
.tp-head{display:flex; align-items:center; justify-content:space-between; padding:7px 10px; cursor:pointer; background:var(--surface-2); border-bottom:1px solid var(--line); font-size:11px; color:var(--ink-2);}
.tp-body{padding:8px 10px; max-height:240px; overflow-y:auto}
.tp-theme-name{font-weight:600; margin-bottom:6px; color:var(--ink)}
.tp-row{display:flex; align-items:center; gap:6px; padding:1.5px 0}
.tp-swatch{width:10px; height:10px; flex:none; border-radius:2px; border:1px solid var(--line)}
.tp-name{color:var(--ink-2); width:82px}
.tp-val{color:var(--ink-3); font-family:Consolas,monospace}
</style>
</head>
<body data-theme="paper" data-bg="default" data-view="library">
<!-- 评审控制栏 -->
<div class="reviewbar">

    <select class="rb-select" id="bgSelect"></select>
  </div>

  </div>
  <div class="workspace">

        <button class="nav-item" data-nav-view="models"><span data-i18n="nav.models">模型</span></button>
      </div>
    </nav>

      <div class="lib-head">
        <div class="lib-title" data-i18n="lib.title">设定库</div>

        <div id="libNoProject" style="display:none"></div>
        <div id="libDetail" style="display:none"></div>
      </div>
    </div>
  </div>
</div>

<!-- 编辑/新建弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="editTitle">新建角色</h2>
    <div class="form-grid" id="editForm"></div>
    <div class="modal-foot">
      <button class="btn" id="editCancel">取消</button>
      <button class="btn primary" id="editSave">保存</button>
    </div>
  </div>
</div>

<!-- 删除确认框 -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal confirm-modal" role="dialog" aria-modal="true">
    <h2 id="cfTitle">确认删除</h2>
    <div class="confirm-text" id="cfText"></div>
    <div class="modal-foot">
      <button class="btn" id="cfCancel">取消</button>
      <button class="btn danger primary" id="cfOk" style="background:var(--err); border-color:var(--err); color:var(--accent-ink)">删除</button>
    </div>
  </div>
</div>

<!-- 世界观复制弹窗 -->
<div class="modal-overlay" id="copyModal">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="copyTitle">复制到项目</h2>
    <div class="form-grid">
      <div class="field">
        <label id="copyScopeLabel">复制范围</label>
        <div class="chip-group" id="copyScopeGroup" style="margin-top:4px">
          <button class="chip active" data-scope="subtree">本体 + 全部子级</button>
          <button class="chip" data-scope="self">仅本体</button>
        </div>
      </div>
      <div class="field">
        <label id="copyLabel">选择目标项目（世界观设定将复制过去，源项目不受影响）</label>
        <select class="select" id="copyProjectSel"></select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="copyCancel">取消</button>
      <button class="btn primary" id="copyOk">复制</button>
    </div>
  </div>
</div>

<!-- 地图标记弹窗（点击画布添加 / 编辑 pin） -->
<div class="modal-overlay" id="pinModal">
  <div class="modal" role="dialog" aria-modal="true" style="width:440px">

      <div class="row2">

    </div>
    <div class="modal-foot">
      <button class="btn" id="pinCancel">取消</button>
      <button class="btn primary" id="pinSave">保存</button>
    </div>
  </div>
</div>

        '<circle cx="50" cy="50" r="24" stroke="var(--accent)" stroke-width=".4" fill="none" opacity=".5"/></svg>'

    e.stopPropagation();
    S.selectedShape = s.dataset.shape;
    renderList();
    const canvas = $('mapCanvas');
    const rect = canvas.getBoundingClientRect();
    const startX = e.clientX, startY = e.clientY;
    const el = document.querySelector('[data-shape="'+s.dataset.shape+'"]');
    if (!el) return;
    const elRect = el.getBoundingClientRect();
    const dx = (elRect.left - rect.left) / rect.width * 100 - parseFloat(el.style.left);
    const dy = (elRect.top - rect.top) / rect.height * 100 - parseFloat(el.style.top);
    const move = (ev) => {
      const x = (ev.clientX - rect.left) / rect.width * 100 - dx;
      const y = (ev.clientY - rect.top) / rect.height * 100 - dy;
      el.style.left = Math.max(0, Math.min(95, x)) + '%';
      el.style.top = Math.max(0, Math.min(95, y)) + '%';
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      const sh = (MAP_SHAPES[activeMap.id]||[]).find(x => x.id === s.dataset.shape);
      if (sh){ sh.x = parseFloat(el.style.left); sh.y = parseFloat(el.style.top); }
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  }));
  document.querySelectorAll('[data-shapedel]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const arr = MAP_SHAPES[activeMap.id] || [];

    else if (v === 'maplist'){ S.activeMapId = maps[0].id; renderList(); }
  }));
  document.querySelectorAll('[data-sel]').forEach(b => b.addEventListener('click', (e) => {
    if (e.target.closest('.li-actions') || e.target.closest('[data-toggle]')) return;
    const id = b.dataset.sel;
    const w = d.find(x => x.id === id);
    if (w && w.map){ S.activeMapId = id; renderList(); }
  }));
  document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); const id = b.dataset.toggle; S.worldExpanded[id] = !S.worldExpanded[id]; renderList(); }));
  document.querySelectorAll('[data-ptype]').forEach(b => b.addEventListener('click', () => { S.pinType = b.dataset.ptype; renderList(); }));
  document.querySelectorAll('[data-pin]').forEach(p => p.addEventListener('click', () => showToast('warn', t('lib.worldMapPinTip'))));
  document.querySelectorAll('[data-pinedit]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const p = (MAP_PINS[S.activeMapId] || []).find(x => x.id === b.dataset.pinedit);
    if (p) openPinDialog(p.x, p.y, p);
  }));
  document.querySelectorAll('[data-pindel]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const pid = b.dataset.pindel;
    const arr = MAP_PINS[S.activeMapId];
    const idx = arr.findIndex(x => x.id === pid);
    if (idx >= 0) arr.splice(idx, 1);
    renderList();
    showToast('ok','toast.deleted');
  }));
  // 画布点击 → 添加标记（一图多标记）
  const canvas = $('mapCanvas');
  canvas.addEventListener('click', (e) => {
    if (e.target.closest('.map-pin')) return;
    const rect = canvas.getBoundingClientRect();
    const x = Math.round((e.clientX - rect.left) / rect.width * 100);
    const y = Math.round((e.clientY - rect.top) / rect.height * 100);
    openPinDialog(x, y);
  });
  bindItemActions(list);
}

/* --- 列表行事件 --- */
function bindItemActions(list){
  list.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const act = b.dataset.act, id = b.dataset.id;
    if (act === 'edit') openEdit('edit', id);
    else if (act === 'del') askDelete(id);
    else if (act === 'copy') openCopy(id);
    else if (act === 'tcheck'){
      const ev = LIB[S.libProject].timeline.find(x => x.id === id);
      showToast('ok', ev ? (S.lang==='zh' ? '「'+ev.title+'」与上下文一致' : '"'+ev.title+'" consistent with context') : '');
    }
  }));
  list.querySelectorAll('[data-edit]').forEach(row => row.addEventListener('click', () => openEdit('edit', row.dataset.edit)));
}
/* ================= 删除确认 ================= */
function askDelete(id){
  const item = data().find(x => x.id === id);
  if (!item) return;
  const name = item.name || item.title;
  const keyMap = { characters:'confirm.deleteChar', world:'confirm.deleteWorld', outline:'confirm.deleteOutline', timeline:'confirm.deleteTimeline', foreshadow:'confirm.deleteForeshadow' };
  openConfirm(t('confirm.deleteTitle'), tf(keyMap[S.libTab], {name}), () => {
    const arr = LIB[S.libProject][S.libTab];
    const idx = arr.findIndex(x => x.id === id);
    if (idx >= 0) arr.splice(idx, 1);
    renderList();
    showToast('ok','toast.deleted');
  });
}

  } else if (S.libTab === 'timeline'){
    html =
      '<div class="row2"><div class="field"><label>'+t('fld.title')+' *</label><input class="input" id="fName" value="'+v('title')+'"></div>' +
      '<div class="field"><label>'+t('fld.time')+'</label><input class="input" id="fTime" placeholder="青元历 317 年秋" value="'+v('time')+'"></div></div>' +
      '<div class="row2"><div class="field"><label>'+t('fld.priority')+'（世界内时间数值）</label><input class="input" id="fTimeValue" placeholder="317.7" value="'+v('timeValue')+'"></div>' +
      '<div class="field"><label>叙事位置</label><input class="input" id="fNarrative" placeholder="5" value="'+v('narrative')+'"></div></div>' +
      '<div class="field"><label>'+t('fld.description')+'</label><textarea class="input" rows="3" id="fDescription">'+v('description')+'</textarea></div>';
  } else if (S.libTab === 'foreshadow'){
    html =
      '<div class="row2"><div class="field"><label>'+t('fld.title')+' *</label><input class="input" id="fName" value="'+v('title')+'"></div>' +
      '<div class="field"><label>'+t('fld.priority')+'</label><select class="select" id="fPriority">' +
      ['high','mid','low'].map(p => '<option value="'+p+'"'+(item && item.priority===p?' selected':'')+'>'+t('fld.priority.'+p)+'</option>').join('') + '</select></div></div>' +
      '<div class="row2"><div class="field"><label>'+t('fld.status')+'</label><select class="select" id="fStatus">' +
      ['planned','pending','resolved'].map(s => '<option value="'+s+'"'+(item && item.status===s?' selected':'')+'>'+t('fld.status.'+s)+'</option>').join('') + '</select></div>' +
      '<div class="field"><label>'+t('fld.location')+'</label><input class="input" id="fLocation" value="'+v('location')+'"></div></div>' +
      '<div class="field"><label>'+t('fld.description')+'</label><textarea class="input" rows="3" id="fDescription">'+v('description')+'</textarea></div>';
  }
  f.innerHTML = html;
  if (S.libTab === 'characters') initTagEditor(item ? (item.groups || []) : []);
  $('editModal').classList.add('open');
  setTimeout(() => { const n = $('fName'); if (n) n.focus(); }, 60);
}
/* 标签多选编辑器（wiki 风格：可选已有 + 输入新建，可多选） */
const ALL_CHAR_TAGS = ['主角团','反派','青云宗','医谷','皇室','清河县城'];
function initTagEditor(selected){
  const wrap = $('tagEditorWrap');
  const sel = [...selected];
  const render = () => {
    wrap.innerHTML =
      '<div class="tag-editor" id="tagEditor">' +
      sel.map(g => '<span class="tag-chip" data-tag="'+g+'">'+g+'<span class="x">×</span></span>').join('') +
      '<input id="tagInput" placeholder="'+t('fld.tagPlaceholder')+'">' +
      '</div>' +
      '<div class="tag-suggest">' + ALL_CHAR_TAGS.filter(g => !sel.includes(g)).map(g =>
        '<button type="button" class="sug-chip" data-sug="'+g+'">+ '+g+'</button>').join('') + '</div>';
    wrap.querySelectorAll('.tag-chip').forEach(c => c.addEventListener('click', () => {
      const i = sel.indexOf(c.dataset.tag); if (i >= 0) sel.splice(i, 1); render();
    }));
    wrap.querySelectorAll('[data-sug]').forEach(b => b.addEventListener('click', () => { sel.push(b.dataset.sug); render(); }));
    const input = $('tagInput');
    input.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ',') && input.value.trim()){
        e.preventDefault();
        const v = input.value.trim();
        if (!sel.includes(v)) sel.push(v);
        render();
      }
    });
    input.addEventListener('blur', () => {
      if (input.value.trim() && !sel.includes(input.value.trim())){ sel.push(input.value.trim()); render(); }
    });
  };
  render();
}
function closeEdit(){ $('editModal').classList.remove('open'); }
function saveEdit(){
  const g = id => { const el = $(id); return el ? el.value.trim() : ''; };
  const d = data();
  const isNew = S.editMode === 'new';
  const name = g('fName');
  if (!name){ showToast('err','toast.required'); return; }
  // 等级必填：无默认值，必须显式选择（用户或 Agent 创建时同理）
  if (S.libTab === 'characters'){
    const rank = $('fRank').value;
    if (!rank){ showToast('err','toast.rankRequired'); $('fRank').focus(); return; }
    const tags = [...document.querySelectorAll('#tagEditor .tag-chip')].map(c => c.dataset.tag);
    if (isNew){
      d.push({ id:'c_'+Date.now(), name, rank, groups:tags, personality:g('fPersonality'), background:g('fBackground'), goals:g('fGoals') });
    } else {
      const it = d.find(x => x.id === S.editId);
      if (!it) return;
      it.name = name; it.rank = rank; it.groups = tags; it.personality = g('fPersonality'); it.background = g('fBackground'); it.goals = g('fGoals');
    }
    closeEdit(); renderList(); showToast('ok','toast.saved');
    return;
  }
  if (isNew){
    const nid = S.libTab[0] + '_' + Date.now();
    if (S.libTab === 'world') d.push({ id:nid, name, category:g('fCategory')||'未分类', scale:g('fScale'), parent:g('fParent')||null, content:g('fContent') });
    else if (S.libTab === 'outline') d.push({ id:nid, name, level:'overall', description:g('fDescription'), volumes:[] });
    else if (S.libTab === 'timeline') d.push({ id:nid, title:name, time:g('fTime')||'—', timeValue:parseFloat(g('fTimeValue'))||0, narrative:parseInt(g('fNarrative'))||d.length+1, desc:g('fDescription') });
    else if (S.libTab === 'foreshadow') d.push({ id:nid, title:name, priority:g('fPriority')||'mid', status:g('fStatus')||'planned', location:g('fLocation'), desc:g('fDescription') });
  } else {
    const it = d.find(x => x.id === S.editId);
    if (!it) return;
    if (S.libTab === 'world'){ it.name = name; it.category = g('fCategory')||it.category; it.scale = g('fScale'); it.parent = g('fParent')||null; it.content = g('fContent'); }
    else if (S.libTab === 'outline'){ it.name = name; it.description = g('fDescription'); }
    else if (S.libTab === 'timeline'){ it.title = name; it.time = g('fTime')||it.time; it.timeValue = parseFloat(g('fTimeValue'))||it.timeValue; it.narrative = parseInt(g('fNarrative'))||it.narrative; it.desc = g('fDescription'); }
    else if (S.libTab === 'foreshadow'){ it.title = name; it.priority = g('fPriority')||it.priority; it.status = g('fStatus')||it.status; it.location = g('fLocation'); it.desc = g('fDescription'); }
  }
  closeEdit(); renderList(); showToast('ok','toast.saved');
}
/* ================= 世界观复制 ================= */
let pinDialogX = 0, pinDialogY = 0, pinEditId = null;
function openPinDialog(x, y, editPin){
  pinDialogX = x; pinDialogY = y; pinEditId = editPin ? editPin.id : null;
  const cur = editPin || { label:'', type:S.pinType, ref:'' };
  $('pinModalTitle').textContent = t(editPin ? 'lib.pinEdit' : 'lib.pinNew');
  $('pinName').value = cur.label;
  $('pinTypeSel').value = cur.type;
  $('pinRef').value = cur.ref || '';
  $('pinModal').classList.add('open');
  setTimeout(() => $('pinName').focus(), 60);
}
function closePinDialog(){ $('pinModal').classList.remove('open'); pinEditId = null; }
function savePin(){
  const label = $('pinName').value.trim();
  if (!label){ showToast('err','toast.required'); return; }
  const type = $('pinTypeSel').value;
  const ref = $('pinRef').value.trim();
  const arr = MAP_PINS[S.activeMapId] || (MAP_PINS[S.activeMapId] = []);
  if (pinEditId){
    const p = arr.find(x => x.id === pinEditId);
    if (p){ p.label = label; p.type = type; p.ref = ref; }
  } else {
    arr.push({ id:'wp_'+Date.now(), x:pinDialogX, y:pinDialogY, label, type, ref });
  }
  closePinDialog(); renderList(); showToast('ok','toast.saved');
}
function openCopy(id){
  S.copySourceId = id;
  S.copyScope = 'subtree';
  document.querySelectorAll('[data-scope]').forEach(b => b.classList.toggle('active', b.dataset.scope === S.copyScope));
  $('copyTitle').textContent = id ? t('lib.copyTitle') + ' · ' + (LIB[S.libProject].world.find(x => x.id === id)?.name || '') : t('lib.copyAllTitle');
  $('copyModal').classList.add('open');
}
function closeCopy(){ $('copyModal').classList.remove('open'); S.copySourceId = null; }
function renderCopySel(){
  const opts = Object.keys(PROJECTS).filter(k => k !== S.libProject).map(k => '<option value="'+k+'">'+PROJECTS[k].name+'</option>').join('');
  $('copyProjectSel').innerHTML = opts || '<option value="">—</option>';
}
function doCopy(){
  const target = $('copyProjectSel').value;
  const allWorld = LIB[S.libProject].world;
  const srcItem = S.copySourceId ? allWorld.find(x => x.id === S.copySourceId) : null;
  if (!target) return;
  const targetArr = LIB[target].world;
  // 收集复制集合：整体复制=全部；单节点=本身(+子级递归)
  let toCopy = [];
  if (!srcItem){
    toCopy = allWorld;
  } else {
    toCopy = [srcItem];
    if (S.copyScope === 'subtree'){
      const children = allWorld.filter(w => w.parent === srcItem.id);
      children.forEach(c => {
        toCopy.push(c);
        allWorld.filter(w => w.parent === c.id).forEach(g => toCopy.push(g));
      });
    }
  }
  let skipped = 0, created = 0;
  toCopy.forEach(w => {
    if (targetArr.some(x => x.name === w.name)){ skipped++; return; }
    targetArr.push({ ...w, id: w.id + '_' + target });
    created++;
  });
  closeCopy();
  const msg = created + ' ' + (S.lang==='zh' ? '条已复制' : 'copied') + (skipped ? '，' + skipped + ' ' + (S.lang==='zh' ? '条同名跳过' : 'skipped') : '');
  showToast('ok', msg);
}
/* ================= Toast ================= */
function showToast(type, key){
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<span class="t-ico">'+(type==='ok'?'✓':type==='warn'?'!':'✕')+'</span><span>'+key+'</span>';
  $('toastWrap').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 220); }, 2000);
}
/* ================= Token 面板 ================= */
function updateTokenPanel(){
  const cs = getComputedStyle(document.body);
  const names = ['--bg','--surface','--surface-2','--surface-3','--ink','--ink-2','--ink-3','--line','--accent','--accent-weak','--ok','--warn','--err'];
  const themeLabel = {paper:'素笺', night:'夜航', ink:'墨韵'}[S.theme];
  $('tpBody').innerHTML = '<div class="tp-theme-name">'+themeLabel+'</div>' + names.map(n => {
    const v = cs.getPropertyValue(n).trim();
    return '<div class="tp-row"><span class="tp-swatch" style="background:'+v+'"></span><span class="tp-name">'+n+'</span><span class="tp-val">'+v+'</span></div>';
  }).join('');
}
/* ================= 事件绑定 ================= */
function bindEvents(){
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themeBtn)));
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.langBtn)));
  document.querySelectorAll('[data-nav-view]').forEach(b => b.addEventListener('click', () => setView(b.dataset.navView)));
  document.querySelectorAll('[data-demo-btn]').forEach(b => b.addEventListener('click', () => setDemo(b.dataset.demoBtn)));
  $('bgSelect').addEventListener('change', e => setBg(e.target.value));
  $('libProjectSel').addEventListener('change', e => setLibProject(e.target.value));
  $('libNewBtn').addEventListener('click', () => openEdit('new'));
  $('editCancel').addEventListener('click', closeEdit);
  $('editSave').addEventListener('click', saveEdit);
  $('cfCancel').addEventListener('click', closeConfirm);
  $('cfOk').addEventListener('click', () => { const fn = S.cfOnOk; closeConfirm(); if (fn) fn(); });
  $('copyCancel').addEventListener('click', closeCopy);
  $('copyOk').addEventListener('click', doCopy);
  $('pinCancel').addEventListener('click', closePinDialog);
  $('pinSave').addEventListener('click', savePin);
  document.querySelectorAll('[data-scope]').forEach(b => b.addEventListener('click', () => {
    S.copyScope = b.dataset.scope;
    document.querySelectorAll('[data-scope]').forEach(x => x.classList.toggle('active', x.dataset.scope === S.copyScope));
  }));
  $('editModal').addEventListener('click', e => { if (e.target === $('editModal')) return; });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if ($('confirmModal').classList.contains('open')) closeConfirm();
      else if ($('copyModal').classList.contains('open')) closeCopy();
      else if ($('pinModal').classList.contains('open')) closePinDialog();
      else if ($('editModal').classList.contains('open')) closeEdit();
    }
  });
  $('tpHead').addEventListener('click', () => $('tokenPanel').classList.toggle('min'));
}
/* ================= 初始化 ================= */
function rebuildBgOptions(){
  const map = { paper:['default','parchment'], night:['default','navy'], ink:['default','brown'] };
  const labels = { default:'默认', parchment:'羊皮纸', navy:'墨蓝黑', brown:'深褐纸' };
  $('bgSelect').innerHTML = map[S.theme].map(v => '<option value="'+v+'"'+(S.bg===v?' selected':'')+'>'+labels[v]+'</option>').join('');
}
bindEvents();
rebuildBgOptions();
setLang('zh');
setTheme('paper');
setBg('default');
setView('library');
renderAll();
updateTokenPanel();
</script>
