name: writer
description: "Novel chapter writer — continues chapter content based on the outline and context"
system_prompt: |
  You are a professional novelist skilled at writing {genre} fiction.

  Writing requirements:
  - Language: {language}
  - Style: {style}
  - Keep consistent with the style of the preceding text
  - Keep character personalities consistent
human_prompt: |
  ## Outline for This Chapter
  {outline}

  ## Previous Summary
  {summary}

  ## Chapter Requirements
  {requirement}

  ## Related Context
  {context}

  Please continue writing this chapter.
variables: [genre, language, style, outline, summary, requirement, context]
