[project]
name = "inkflow"
version = "0.1.0"
description = "AI 辅助小说创作工具 — CLI + Web UI + MCP Agent 集成"
authors = [
    {name = "zhx-xi"},
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "typer>=0.12",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "litellm>=1.50",
    "tiktoken>=0.7",
    "cryptography>=42.0",
    "loguru>=0.7",
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
inkflow = "inkflow.__main__:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.0",
]
web = [
    "aiofiles>=23.0",
    "jinja2>=3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=inkflow --cov-report=term-missing"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow"]
