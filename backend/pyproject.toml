[project]
name = "inkflow"
version = "0.1.0"
description = "AI 辅助小说创作工具 — CLI + Web UI + MCP Agent 集成"
authors = [
    {name = "zhx-xi"},
]
requires-python = ">=3.11"
dependencies = [
    # Web & CLI
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "typer>=0.12",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # Data validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # HTTP
    "httpx>=0.27",
    "httpx-sse>=0.4",
    # LangChain 全家桶 — LLM 抽象 + Agent 编排 + RAG
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<1.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-chroma>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    # LLM Provider（ChatLiteLLM 底层依赖，覆盖 100+ Provider）
    "litellm>=1.50",
    "tiktoken>=0.7",
    # RAG — 向量数据库 + 本地 Embedding
    "chromadb>=1.0.0,<2.0.0",
    "sentence-transformers>=3.0",
    # Security & Logging
    "cryptography>=42.0",
    "loguru>=0.7",
    # CLI
    "click>=8.1",
    "rich>=13.0",
    "jieba>=0.42.1",
]

[project.scripts]
inkflow = "inkflow.cli.app:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.0",
    # LangSmith 追踪（开发/调试用）
    "langsmith>=0.2.0",
]
web = [
    "aiofiles>=23.0",
    "jinja2>=3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "unit: 单元测试 — 无 I/O，无数据库，快速（< 100ms/条）",
    "integration: 集成测试 — 真实数据库（in-memory SQLite）",
    "api: API 集成测试 — FastAPI TestClient/ASGITransport",
    "cli: CLI 集成测试 — CliRunner + 临时 SQLite",
    "e2e: 端到端测试 — 完整用户链路（未来）",
    "chapter: 卷/章节功能相关测试",
    "project: 项目管理功能相关测试",
    "writing: AI 写作功能相关测试",
    "agent: Agent 编排功能相关测试（未来）",
]

# 覆盖率（#104 Phase 1）：pytest-cov 配置；fail_under 由 CI coverage job 的
# ci_cd/check_coverage.py 断言（行+分支双阈值），不在 pyproject 固定（unit job
# 只跑 tests/unit/ 会误红——覆盖率必须 unit+顶层合并后判定）
[tool.coverage.run]
branch = true
source = ["inkflow"]
# RAG 文件与 coverage 同进程冲突（chromadb C 扩展，F14 先例）——由 pytest --ignore 排除，
# 其覆盖率以「测试方法全覆盖」替代证据（docs/api-coverage.md 登记）
omit = ["*/test_*.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == \"__main__\":",
    "raise NotImplementedError",
    # #104 Phase 3 用户拍板 C 方案：Protocol 接口文件（domain/ports/）抽象方法体
    # `...` 物理不可执行（129 行接口签名永远 0 命中）——排除出统计口径，
    # 否则「行覆盖 99%」数学上不可能。errors/模型类（可执行逻辑）不受影响。
    "^\\s*\\.\\.\\.\\s*$",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RET", "TRY", "RUF"]
# B008: FastAPI Depends() 惯用法误报（LiteLLM 亦以 budget 放行）
# TRY003: FastAPI HTTPException(detail=...) 惯用法误报（LiteLLM 未启用）
# RUF001/002/003: 中文代码库歧义 Unicode 误报（CJK 字符全标记）
ignore = ["B008", "TRY003", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
ignore_missing_imports = true
# 类型纪律强化（2026-08-03，借鉴 LiteLLM type-discipline）：禁裸 ignore，检查未标注 def
# disallow_any_explicit 暂不开启：存量 Any 162 处（多为 FastAPI response_model/Depends 惯用法），
# 遵循「存量预算 + 渐进」——新代码避免 Any，存量清理后开启
warn_unused_ignores = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
