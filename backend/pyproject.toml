[project]
name = "inkflow"
version = "0.1.0"
description = "AI 辅助小说创作工具 — CLI + Web UI + MCP Agent 集成"
authors = [
    {name = "zhx-xi"},
]
requires-python = ">=3.11"
dependencies = [
    # Web & CLI
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "typer>=0.12",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # Data validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # HTTP
    "httpx>=0.27",
    "httpx-sse>=0.4",
    # LangChain 全家桶 — LLM 抽象 + Agent 编排 + RAG
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<1.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-chroma>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    # LLM Provider（ChatLiteLLM 底层依赖，覆盖 100+ Provider）
    "litellm>=1.50",
    "tiktoken>=0.7",
    # RAG — 向量数据库 + 本地 Embedding
    "chromadb>=1.0.0,<2.0.0",
    "sentence-transformers>=3.0",
    # Security & Logging
    "cryptography>=42.0",
    "loguru>=0.7",
    # CLI
    "click>=8.1",
    "rich>=13.0",
]

[project.scripts]
inkflow = "inkflow.__main__:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.0",
    # LangSmith 追踪（开发/调试用）
    "langsmith>=0.2.0",
]
web = [
    "aiofiles>=23.0",
    "jinja2>=3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
markers = [
    "unit: 单元测试 — 无 I/O，无数据库，快速（< 100ms/条）",
    "integration: 集成测试 — 真实数据库（in-memory SQLite）",
    "api: API 集成测试 — FastAPI TestClient/ASGITransport",
    "cli: CLI 集成测试 — CliRunner + 临时 SQLite",
    "e2e: 端到端测试 — 完整用户链路（未来）",
    "chapter: 卷/章节功能相关测试",
    "project: 项目管理功能相关测试",
    "writing: AI 写作功能相关测试",
    "agent: Agent 编排功能相关测试（未来）",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkflow"]
