repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2048']   # uv.lock / pnpm-lock.yaml 依赖锁文件可能 >500KB（ADR-025）
      - id: check-merge-conflict

  # 本地钩子：Conventional Commits + Conventional Branches（借鉴 LiteLLM .githooks）
  # 安装: pre-commit install --hook-type pre-commit --hook-type commit-msg --hook-type pre-push
  - repo: local
    hooks:
      - id: conventional-commit-msg
        name: conventional commit message
        entry: python .githooks/check_commit_msg.py
        language: system
        stages: [commit-msg]
      - id: conventional-branch
        name: conventional branch name
        entry: python .githooks/check_branch.py
        language: system
        stages: [pre-push]
      # 层② 原型 PNG ↔ HTML 同源性门禁（#1330）：
      # 改了 design/GUI/** 或门禁自身 → 提交时重跑 shot-*.cjs 并逐像素比对，真实漂移即拦。
      # 为何是本地钩子而非 CI job：像素比对绑定「出图机器」——原型的 serif 栈
      # （"Noto Serif SC"/"Source Han Serif SC"/SimSun/…）在 CI runner 上解析到不同字体，
      # 共享 chrome 大面积误报（PR #1459 的 CI 实测 91/107 假漂移）。本地 = 出图机器，比对才有意义。
      # 挂在**已安装**的 pre-commit 阶段（无需额外 install pre-push）。
      # entry 用 `uv run --no-project python`：本机 PATH 上的 `python` 是 WindowsApps 别名，
      # pre-commit 的 system 钩子 runner 解析不到（exit 9009）→ 走仓库既定的 uv 工具链。
      - id: gui-png-homology
        name: GUI prototype PNG <-> HTML homology
        entry: uv run --no-project python ci_cd/check_gui_png_homology.py .
        language: system
        files: '^(design/GUI/|ci_cd/check_gui_png_homology\.py$)'
        pass_filenames: false
        stages: [pre-commit]
